<!-- games/homework-play.html -->
<div class="screen active" style="background: #f8fafc; min-height: 100vh; padding: 20px;">
    <div style="max-width: 800px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden;">
        
        <!-- الرأس وشريط التقدم -->
        <div style="background: linear-gradient(45deg, #10b981, #059669); color: white; padding: 20px; text-align: center; position: relative;">
            <h2 style="margin: 0; font-size: 2rem;">تحدي الأبطال 🏆</h2>
            <div id="hp-student-name" style="font-size: 1.2rem; margin-top: 10px; font-weight: bold;"></div>
            <div id="hp-progress-text" style="position: absolute; top: 20px; left: 20px; font-size: 1.2rem; font-weight: bold; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; direction: ltr;"></div>
        </div>
        <div style="height: 10px; background: #e2e8f0; width: 100%;">
            <div id="hp-progress-bar" style="height: 100%; width: 0%; background: #fbbf24; transition: width 0.4s ease;"></div>
        </div>

        <!-- مساحة عرض السؤال الديناميكي -->
        <div id="hp-question-container" style="padding: 30px; text-align: right;">
            <!-- سيتم حقن الأسئلة هنا عبر الجافاسكربت -->
        </div>

        <!-- أزرار التنقل السفلية -->
        <div style="padding: 20px 30px; background: #f1f5f9; display: flex; justify-content: space-between; border-top: 1px solid #e2e8f0;">
            <button class="btn btn-outline" id="btn-hp-prev" style="visibility: hidden; font-size: 1.3rem;">السابق</button>
            <button class="btn" id="btn-hp-next" style="background: #0ea5e9; font-size: 1.3rem;">التالي ➡️</button>
            <button class="btn" id="btn-hp-submit" style="display: none; background: #8b5cf6; font-size: 1.4rem;">✅ إنهاء واعتماد</button>
        </div>
    </div>
</div>

<!-- 🌟 النافذة المنبثقة للنتيجة النهائية 🌟 -->
<div id="hp-result-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); z-index: 9999; justify-content: center; align-items: center;">
    <div class="modal-content" style="background: white; padding: 40px; border-radius: 20px; text-align: center; max-width: 500px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.4);">
        <div style="font-size: 5rem; margin-bottom: 10px;">🏅</div>
        <h2 style="color: #10b981; font-size: 2.5rem; margin-top: 0;">انتهى التحدي!</h2>
        <p id="hp-result-score" style="font-size: 1.8rem; font-weight: bold; color: #334155; margin: 20px 0; line-height: 1.5;"></p>
        <p style="color: #64748b; font-size: 1.2rem; margin-bottom: 30px;">تم حفظ نتيجتك وإجاباتك بنجاح ليراها معلمك.</p>
        
        <!-- الزر الجديد: إغلاق الصفحة -->
        <button class="btn" id="btn-hp-finish" style="width: 100%; font-size: 1.5rem; background: #ef4444;">✖️ إغلاق الصفحة</button>
    </div>
</div>
