name: Fetch Ayah Rects

# تشغيل يدوي فقط: ينزّل قاعدة مواضع الآيات على صور المصحف (ayahinfo من مشروع quran_android) ويحوّلها إلى JSON لكل صفحة في assets/mushaf/ayah/
# تُستعمل لتظليل الآية بالأصفر عند «إظهار الإجابة» في سؤال الذاكرة البصرية.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تنزيل قاعدة مواضع الآيات
        run: |
          set -euo pipefail
          mkdir -p work/ayahinfo
          curl -fsSL --retry 5 --retry-delay 3 -A "Mozilla/5.0" -o work/ayahinfo.zip \
            "https://android.quran.com/data/databases/ayahinfo/ayahinfo_1024.zip"
          unzip -o work/ayahinfo.zip -d work/ayahinfo
          ls -la work/ayahinfo

      - name: التحويل إلى JSON
        run: |
          set -euo pipefail
          db=$(find work/ayahinfo -name '*.db' | head -1)
          test -n "$db"
          python3 tools/build-ayah-rects.py "$db" assets/mushaf/ayah
          du -sh assets/mushaf/ayah

      - name: مصدر البيانات
        run: |
          cat >> assets/mushaf/SOURCE.md <<'MD'

          ## مواضع الآيات (assets/mushaf/ayah/)
          - من https://android.quran.com/data/databases/ayahinfo/ayahinfo_1024.zip (مشروع quran_android)، حُوّلت بـ `tools/build-ayah-rects.py` عبر `.github/workflows/fetch-ayah-rects.yml`.
          - لكل صفحة ملف `pNNN.json` بنِسَب مئوية من الصورة الأصلية (1024×1656) فتصلح لأي حجم عرض. تُستعمل لتظليل الآية في سؤال الذاكرة البصرية.
          MD

      - name: رفع الملفات
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mushaf
          git commit -m "إضافة مواضع الآيات على صور المصحف (للتظليل في الذاكرة البصرية)"
          git push
