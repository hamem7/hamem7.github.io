name: check-dark-theme
on:
  push:
    paths: ['**.html', '**.css', '**.js', 'tools/gen-dark-theme.mjs']
  pull_request:
    paths: ['**.html', '**.css', '**.js', 'tools/gen-dark-theme.mjs']
jobs:
  dark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/gen-dark-theme.mjs --check
