<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title>معاينة — تقرير التقييم الفردي · Individual report preview</title>
<!-- معاينة للنقاش فقط: لا تمسّ أي شاشة في المنصة. البيانات تجريبية. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap">
<link rel="stylesheet" href="css/fonts.css">
<style>
:root{
  --pg:#f3eee3; --panel:#fffdf8; --ink:#1f2a24; --soft:#6b6b63; --line:#e6dcc6; --strong:#b9a983;
  --em:#0d5c46; --em2:#147c5e; --gold:#c9a13b; --gold2:#8a6221; --red:#9e3b2d; --amber:#b8863b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--pg:#121614;--panel:#1b211e;--ink:#e9eee9;--soft:#a9b2ac;--line:#2d3632;--strong:#56635c}
}
:root[data-theme="dark"]{--pg:#121614;--panel:#1b211e;--ink:#e9eee9;--soft:#a9b2ac;--line:#2d3632;--strong:#56635c}
*{box-sizing:border-box}
body{margin:0;background:var(--pg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;line-height:1.6}
button{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.top h1{font-size:20px;margin:0;display:flex;align-items:center;gap:10px}
.top h1 img{width:30px}
.top p{margin:2px 0 0;color:var(--soft);font-size:13px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--strong);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--em);color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:8px 0 18px}
.tabs button{border:0;background:transparent;color:var(--soft);padding:10px 14px;font-size:15px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--em2);border-color:var(--gold)}
.tab{display:none}.tab.on{display:block}
.lead{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:14px}
.lead b{color:var(--em2)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.cmp h3{margin:0 0 8px;font-size:15px}
.cmp .cap{color:var(--soft);font-size:12.5px;margin:-4px 0 8px}
.shot{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:16px}
.legend h3{margin:0 0 6px;font-size:15px}
.legend ol{margin:0;padding-inline-start:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px 18px}
.legend li{display:flex;gap:8px;font-size:13.5px}
.legend li b{display:block}
.pin{flex:none;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#2b2000;font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
@media (max-width:860px){.cmp{grid-template-columns:1fr}}

/* ============ النموذج 1: التقرير الحالي بعد التحسين (ألوان ثابتة لأنه صورة تُصدَّر) ============ */
.r1{position:relative;background:#f9f4ea;color:#23302a;border-radius:12px;padding:18px 20px 16px;border:1px solid #e6dcc6;overflow:hidden;font-size:13px}
.r1 .pin{position:absolute;z-index:3}
.r1 .orn{position:absolute;width:38px;opacity:.7}
.r1 .orn.tr{top:6px;right:6px}.r1 .orn.tl{top:6px;left:6px;transform:scaleX(-1)}
.r1 .orn.br{bottom:6px;right:6px;transform:scaleY(-1)}.r1 .orn.bl{bottom:6px;left:6px;transform:scale(-1)}
.r1 .head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 26px}
.r1 .head .t{text-align:center;flex:1}
.r1 .head .eye{font-size:10.5px;color:#6f644e}
.r1 .head h2{margin:0;font-size:22px;color:#0b3d30;line-height:1.25}
.r1 .head .sub{font-family:'Amiri',serif;font-size:14px;color:#3a3a30}
.r1 .head img.logo{width:40px}.r1 .head img.rehl{width:78px}
.r1 .card{background:#fffdf8;border:1px solid #e6dcc6;border-radius:14px;padding:12px 14px;position:relative}
.r1 .row{display:grid;grid-template-columns:1.55fr 1fr;gap:10px;margin-top:10px}
.r1 .stu{display:flex;gap:12px;align-items:center}
.r1 .av{width:58px;height:58px;border-radius:50%;border:3px solid #147c5e;display:flex;align-items:center;justify-content:center;font-size:24px;color:#0d5c46;font-weight:700;flex:none;background:#fff}
.r1 .nm{font-size:19px;font-weight:800;color:#13231c}
.r1 .facts{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:11.5px;color:#4b4b40;margin-top:2px}
.r1 .facts b{color:#1d2a24}
.r1 .gauge{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.r1 .gauge .ring{position:relative;width:104px;height:104px}
.r1 .gauge .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.r1 .gauge .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.r1 .gauge .pct{font-size:26px;font-weight:800;line-height:1}
.r1 .gauge .tier{font-size:11px;font-weight:700;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px}
.r1 .delta{margin-top:6px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px}
.r1 .honest{text-align:center;font-weight:700;font-size:12.5px;margin:10px 0 4px}
.r1 h4{margin:0 0 6px;font-size:13.5px;color:#0b3d30}
.r1 .ladder{display:flex;align-items:center;justify-content:space-between;gap:4px}
.r1 .st{text-align:center;font-size:10.5px;color:#4b4b40;flex:1}
.r1 .st i{display:block;margin:0 auto 3px;width:28px;height:28px;border-radius:50%;color:#fff;font-style:normal;font-weight:800;font-size:11px;line-height:28px}
.r1 .st.cur i{box-shadow:0 0 0 3px #f0dfb2}
.r1 .arr{color:#b9a983;font-size:16px}
.r1 .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.r1 .chip{border-radius:12px;padding:6px 8px;text-align:center;font-size:11.5px;font-weight:700;border:1px solid}
.r1 .chip b{display:block;font-size:17px}
.r1 .chip small{display:block;font-weight:500;font-size:9.5px;opacity:.85}
.r1 .full{background:#e8f2ec;border-color:#bcd9c8;color:#0d5c46}
.r1 .help{background:#f8efd9;border-color:#e6cf98;color:#8a6221}
.r1 .wrong{background:#f6e4df;border-color:#e2bcb1;color:#9e3b2d}
.r1 .stats{display:flex;justify-content:center;gap:16px;font-size:11px;color:#4b4b40;margin-top:8px;flex-wrap:wrap}
.r1 .ins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.r1 .ins ul{margin:0;padding-inline-start:16px;font-size:11.5px}
.r1 .ins li{margin-bottom:3px}
.r1 .ins .g{background:#eef5f0;border-color:#cfe2d6}.r1 .ins .f{background:#f9eeea;border-color:#ebcdc3}
.r1 .home{margin-top:10px;background:#0d5c46;color:#fff;border-radius:14px;padding:10px 14px;position:relative}
.r1 .home h4{color:#f0d878}
.r1 .home p{margin:0;font-size:12px}
.r1 .note{margin-top:10px;border-top:3px solid #c9a13b}
.r1 .note p{margin:0;font-family:'Amiri',serif;font-size:14px;line-height:1.75}
.r1 .foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;padding-top:8px;border-top:1px solid #e6dcc6;font-size:10.5px;color:#6f644e}
.r1 .foot .sg{text-align:center;min-width:130px}
.r1 .foot .sg .ln{border-top:1px solid #8a7a58;margin-bottom:3px}
.r1 .foot .sg b{display:block;color:#0b3d30;font-size:12px}
.r1 .foot .id{font-size:9px;opacity:.75}

/* ============ النموذج 2: بطاقة ولي الأمر (عرض 1080 عند التصدير) ============ */
.m2{display:grid;grid-template-columns:minmax(0,540px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.m2{grid-template-columns:1fr}}
.cardwrap{width:100%;max-width:540px;container-type:inline-size}
.pc{width:100%;position:relative;overflow:hidden;border-radius:3cqw;
  background:#f8f3e8;color:#1c2a23;font-family:'IBM Plex Sans Arabic',sans-serif;box-shadow:0 18px 40px rgba(0,0,0,.18);display:flex;flex-direction:column}
.pc .band{background:linear-gradient(135deg,#0b3d30,#0d5c46 60%,#147c5e);color:#fff;padding:3.4cqw 5cqw 8cqw;position:relative}
.pc .band::after{content:"";position:absolute;inset:auto 0 -1px 0;height:6cqw;background:#f8f3e8;border-radius:6cqw 6cqw 0 0}
.pc .band>*{position:relative;z-index:1}
.pc .band>.gorn{position:absolute;z-index:0;inset:0 0 0 0;background:url(assets/report/report-geo-orn.png) repeat 0 0/32cqw;opacity:.3;pointer-events:none}
.pc .chips{display:flex;flex-wrap:wrap;gap:1.2cqw;margin-top:1.2cqw}
.pc .chips .scope{margin-top:0;display:inline-flex;align-items:center;gap:1cqw}
.pc .chips .scope svg{width:3.2cqw;height:3.2cqw;flex:none}
.pc .chips .dur{background:rgba(240,216,120,.22);border-color:rgba(240,216,120,.6)}
.pc .brandrow{display:flex;align-items:center;justify-content:space-between;gap:2cqw}
.pc .brandrow .b{display:flex;align-items:center;gap:2cqw;font-size:2.7cqw;font-weight:600;opacity:.95}
.pc .brandrow img{width:6.4cqw}
.pc .brandrow .dt{font-size:2.5cqw;opacity:.9;text-align:end;line-height:1.35}
.pc .hello{margin-top:2.2cqw;display:flex;align-items:center;gap:3.4cqw}
.pc .av{width:13cqw;height:13cqw;border-radius:50%;background:#fff;color:#0d5c46;display:flex;align-items:center;justify-content:center;font-size:7cqw;font-weight:800;flex:none;border:.8cqw solid #f0d878}
.pc .av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.edp{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.edp h4{margin:0 0 6px;font-size:14px}
.edp textarea{width:100%;min-height:78px;border:1px solid var(--strong);border-radius:8px;padding:8px;font:inherit;background:var(--pg);color:var(--ink);resize:vertical}
.edp .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.edp .hint{color:var(--soft);font-size:12px;margin:4px 0 0}
.pc .nm{font-size:6.2cqw;font-weight:800;line-height:1.2}
.pc .scope{display:inline-block;margin-top:1cqw;font-size:2.8cqw;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:.4cqw 2.4cqw;border-radius:99cqw}
.pc .body{padding:0 5cqw 3.4cqw;margin-top:-4cqw;position:relative;z-index:1;display:flex;flex-direction:column;gap:2.4cqw;flex:1}
.pc .hero{display:grid;grid-template-columns:27cqw 1fr;gap:3.4cqw;align-items:center;background:#fff;border:1px solid #e6dcc6;border-radius:3.4cqw;padding:3cqw 3.4cqw}
.pc .ring{position:relative;width:27cqw;height:27cqw}
.pc .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.pc .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pc .stars{display:flex;gap:.6cqw;margin-bottom:.4cqw}
.pc .stars svg{width:3.6cqw;height:3.6cqw}
.pc .pct{font-size:8cqw;font-weight:800;line-height:1}
.pc .tier{font-size:2.8cqw;font-weight:700;color:#fff;padding:.2cqw 2.4cqw;border-radius:99cqw;margin-top:.8cqw}
.pc .msg{font-size:4.1cqw;font-weight:800;line-height:1.4}
.pc .trend{margin-top:1.4cqw;display:flex;align-items:flex-end;gap:2cqw}
.pc .trend .bar{display:flex;flex-direction:column;align-items:center;font-size:2.3cqw;color:#6b6b63;gap:.6cqw}
.pc .trend .bar i{display:block;width:6cqw;border-radius:1.2cqw 1.2cqw .4cqw .4cqw;background:#d9cfb8}
.pc .trend .bar.cur i{background:var(--tc)}
.pc .trend .bar b{color:#1c2a23;font-size:2.6cqw}
.pc .trendtx{font-size:2.8cqw;font-weight:700;margin-top:1cqw;line-height:1.45}
.pc .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw}
.pc .tile{border-radius:2.8cqw;padding:1.4cqw 1cqw;border:1px solid;display:flex;align-items:center;justify-content:center;gap:1.8cqw}
.pc .tile b{font-size:5.6cqw;line-height:1.1}
.pc .tile span{font-size:2.9cqw;font-weight:700}
.pc .t1{background:#e8f2ec;border-color:#bcd9c8;color:#0d5c46}
.pc .t2{background:#f8efd9;border-color:#e6cf98;color:#8a6221}
.pc .t3{background:#f6e4df;border-color:#e2bcb1;color:#9e3b2d}
.pc .two{display:grid;grid-template-columns:1fr 1fr;gap:2cqw}
.pc .box{background:#fff;border:1px solid #e6dcc6;border-radius:2.8cqw;padding:2.2cqw 2.6cqw}
.pc .box h5{margin:0 0 .8cqw;font-size:3.1cqw;display:flex;align-items:center;gap:1.2cqw}
.pc .box h5 i{width:2.4cqw;height:2.4cqw;border-radius:50%;display:inline-block}
.pc .box ul{margin:0;padding:0;list-style:none;font-size:2.8cqw;line-height:1.5}
.pc .box li{margin-bottom:.5cqw}
.pc .box li b{color:#9e3b2d}
.pc .task{background:#fff6dc;border:.5cqw dashed #c9a13b;border-radius:3cqw;padding:2.4cqw 3cqw;display:flex;gap:2.4cqw;align-items:flex-start}
.pc .task .ic{flex:none;width:8cqw;height:8cqw;border-radius:50%;background:#c9a13b;display:flex;align-items:center;justify-content:center}
.pc .task .ic svg{width:4.6cqw;height:4.6cqw}
.pc .task h5{margin:0;font-size:3.3cqw;color:#6b4a10}
.pc .task p{margin:.3cqw 0 0;font-size:3cqw;line-height:1.5;font-weight:600}
.pc .kidmsg{display:none}
.pc .note{font-family:'Amiri',serif;font-size:3.5cqw;line-height:1.6;color:#2a352f;border-inline-start:.8cqw solid #c9a13b;padding-inline-start:2.4cqw}
.pc .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:2.4cqw;color:#6b6b63;gap:2cqw}
.pc .foot .sg{text-align:center}
.pc .foot .sg b{display:block;color:#0b3d30;font-size:2.9cqw}
.pc .foot .sg{display:flex;align-items:center;gap:2cqw;text-align:start}
.pc .foot .sg .stamp{flex:none;width:10cqw;height:10cqw;border-radius:50%;border:.4cqw dashed #9eb8ad;display:flex;align-items:center;justify-content:center;font-size:2cqw;color:#7a978b}

/* ---- نسخة ركن الأطفال: نفس الهيكل بألوان مرحة ---- */
.pc.kids{background:#f2f8ff}
.pc.kids .band{background:linear-gradient(135deg,#2f6fd6,#45a3e6 55%,#5cc8c2)}
.pc.kids .band::after{background:#f2f8ff}
.pc.kids .av{border-color:#ffd54a;color:#2f6fd6}
.pc.kids .hero,.pc.kids .box{border-color:#cfe1f5;border-radius:4.4cqw}
.pc.kids .tile{border-radius:4cqw}
.pc.kids .task{background:#fff4cf;border-color:#f2b705;border-radius:4.4cqw}
.pc.kids .kidmsg{display:flex;gap:2.2cqw;align-items:center;background:linear-gradient(90deg,#ffe37a,#ffd0e1);border-radius:4.4cqw;padding:2cqw 3cqw;font-size:3.2cqw;font-weight:800;color:#5a3a00}
.pc.kids .kidmsg svg{width:7cqw;height:7cqw;flex:none}
.pc.kids .note{display:none}
.hwl{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.hwl li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px}
.hwl .hwm{display:inline-block;background:var(--gold);color:#2b2000;border-radius:99px;padding:0 8px;font-size:11.5px;font-weight:700;margin-inline-start:6px}
.hwl .hwt{display:block;margin-top:3px;color:var(--soft)}
.hwn{font-size:13px;color:var(--soft);margin:0 0 8px}
.pc .confetti{display:none}
.pc.kids .confetti{display:block;position:absolute;inset:0;pointer-events:none}

.spec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13.5px}
.spec h3{margin:0 0 6px;font-size:15px}
.spec ul{margin:0 0 10px;padding-inline-start:18px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--em);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:10px;cursor:pointer;margin-top:12px}
.btn[disabled]{opacity:.6;cursor:wait}

/* ============ ملاحظات النصوص ============ */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:13.5px}
.tbl th,.tbl td{padding:10px 12px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl th{background:color-mix(in srgb,var(--em) 12%,var(--panel));font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.tbl td.old{color:var(--soft);text-decoration:line-through;text-decoration-color:color-mix(in srgb,#9e3b2d 55%,transparent)}
.tbl td.new{color:var(--em2);font-weight:600}
.tbl .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:0 8px;margin-bottom:4px}
.tag.fix{background:#f6e4df;color:#9e3b2d}.tag.clr{background:#f8efd9;color:#8a6221}.tag.add{background:#e8f2ec;color:#0d5c46}
@media (max-width:760px){
  .tbl thead{display:none}.tbl tr{display:block;border-bottom:1px solid var(--line)}.tbl td{display:block;border:0;padding:4px 12px}
  .tbl td:first-child{padding-top:10px}.tbl td:last-child{padding-bottom:10px}
  .r1 .row,.r1 .ins{grid-template-columns:1fr}
}

/* ============ النموذج ب: خريطة الآيات (شهادة) ============ */
.mb{width:100%;position:relative;overflow:hidden;background:#fbf6ea;color:#2a2418;font-family:'IBM Plex Sans Arabic',sans-serif;
  padding:4.2cqw;box-shadow:0 18px 40px rgba(0,0,0,.18);border-radius:1.4cqw}
.mb .frame{border:.5cqw solid #b8913a;outline:.25cqw solid #b8913a;outline-offset:-1.6cqw;border-radius:1cqw;padding:5cqw 5cqw 4cqw;position:relative;
  background:radial-gradient(circle at 50% 0%,#fffdf6 0,#fbf6ea 60%)}
.mb .corner{position:absolute;width:9cqw;opacity:.8}
.mb .corner.a{top:1.2cqw;right:1.2cqw}.mb .corner.b{top:1.2cqw;left:1.2cqw;transform:scaleX(-1)}
.mb .corner.c{bottom:1.2cqw;right:1.2cqw;transform:scaleY(-1)}.mb .corner.d{bottom:1.2cqw;left:1.2cqw;transform:scale(-1)}
.mb .mtop{text-align:center}
.mb .mtop img{width:9cqw;display:block;margin:0 auto}
.mb .mtop .k{font-size:2.6cqw;color:#8a6d2a;letter-spacing:.1cqw;margin-top:.6cqw}
.mb .mtop h2{margin:.4cqw 0 0;font-family:'Amiri',serif;font-size:6.4cqw;color:#0b3d30;line-height:1.25}
.mb .orn{display:flex;align-items:center;justify-content:center;gap:2cqw;color:#b8913a;margin:1.2cqw 0}
.mb .orn i{height:.25cqw;width:18cqw;background:linear-gradient(90deg,transparent,#b8913a)}.mb .orn i:last-child{transform:scaleX(-1)}
.mb .orn svg{width:3.4cqw;height:3.4cqw}
.mb .who{text-align:center;font-size:3cqw;color:#5a5140}

const HIST4 = { excellent:[72,78,88], average:[58,62,71], weak:[55,52,48] };
const HIST4_DATES = ['13/10','20/10','27/10'];
const tierOf = p => p>=90?'excellent':p>=75?'good':p>=60?'average':'weak';
const TIER_COL = { excellent:'#0d5c46', good:'#147c5e', average:'#b8863b', weak:'#a15230' };
const tierName = k => isAr() ? {excellent:'ممتاز',good:'جيد',average:'متوسط',weak:'يحتاج دعمًا'}[k] : {excellent:'Excellent',good:'Good',average:'Average',weak:'Needs support'}[k];
function progress4(){
  const d = DATA[S.tier], arr = [...HIST4[S.tier], d.score];
  const avg = Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
  const diff = arr[3]-arr[0];
  const dir = isAr()
    ? (Math.abs(diff)<=3 ? 'مستقر' : diff>0 ? `في تحسّن (${diff>0?'+':''}${diff} منذ ${HIST4_DATES[0]})` : `في تراجع يحتاج متابعة`)
    : (Math.abs(diff)<=3 ? 'steady' : diff>0 ? `improving (+${diff} since ${HIST4_DATES[0]})` : 'declining — needs follow-up');
  const steps = arr.map((p,i)=>({p, w: i<3 ? HIST4_DATES[i] : (isAr()?'اليوم':'Today'), cur: i===3, t: tierOf(p)}));
  return { avg, avgTier: tierOf(avg), dir, steps, up: diff>3, down: diff<-3 };
}

function qLabel(n, kind){
  if (!isAr()) return { full: n===1?'question correct':'questions correct', help: n===1?'question with help':'questions with help', wrong: n===1?'question to review':'questions to review' }[kind];
  const f = n===1?0 : n===2?1 : (n===0||n<=10)?2 : 3;
  return {
    full:  ['سؤال صحيح','سؤالان صحيحان','أسئلة صحيحة','سؤالًا صحيحًا'],
    help:  ['سؤال بمساعدة','سؤالان بمساعدة','أسئلة بمساعدة','سؤالًا بمساعدة'],

}

const SURAH = { mulk:{ar:'الملك',en:'Al-Mulk'}, qalam:{ar:'القلم',en:'Al-Qalam'}, baqara:{ar:'البقرة',en:'Al-Baqarah'} };
const band4 = p => p>=90 ? 'excellent' : p>=75 ? 'good' : p>=60 ? 'average' : p>=30 ? 'weak' : 'veryweak';
// «4 من 8 أسئلة»
function kOfN(k, n){
  const kp = k===1?'سؤالًا واحدًا':k===2?'سؤالين':String(k);
  return `${kp} من ${arCount(n,'سؤال واحد','سؤالين','أسئلة','سؤالًا')}`;
}
function remAr(r){ return r===1?'بقي سؤال واحد':r===2?'بقي سؤالان':r<=10?`بقيت ${r} أسئلة`:`بقي ${r} سؤالًا`; }
function remEn(r){ return r===1?'1 question left':`${r} questions left`; }
function scoreMsg(c, kid, N){
  const n=c.n, f=c.full, r=n-f, b=band4(c.score), ar=isAr(), all=(f===n);
  if (ar){
    const v = G('','ت');
    if (kid) return all ? `${G('أحسنت يا بطل','أحسنتِ يا بطلة')}! ${N} أتقن${v} الأسئلة كلها (${n} من ${n})`
      : {excellent:`${G('أحسنت يا بطل','أحسنتِ يا بطلة')}! ${N} أتقن${v} ${kOfN(f,n)}`,
         good:`رائع! ${N} أتقن${v} ${kOfN(f,n)}، و${remAr(r)} فقط`,
         average:`${N} أتقن${v} ${kOfN(f,n)}.. و${remAr(r)} لنتقنها معًا!`,
         weak:`${N} أتقن${v} ${kOfN(f,n)} بشجاعة، ومعًا نتقن البقية!`,
         veryweak:`${N} ${G('تدرّب','تدرّبت')} بشجاعة اليوم، ومعًا نبدأ من جديد!`}[b];
    return all ? `ما شاء الله! أتقن${v} ${N} الأسئلة كلها (${n} من ${n}) دون مساعدة`
      : {excellent:`ما شاء الله! أتقن${v} ${N} ${kOfN(f,n)} دون مساعدة`,
         good:`أتقن${v} ${N} ${kOfN(f,n)} دون مساعدة، و${remAr(r)} للتثبيت`,
         average:`أتقن${v} ${N} ${kOfN(f,n)} دون مساعدة، و${remAr(r)} تحتاج تثبيتًا`,
         weak:`أتقن${v} ${N} ${f===0?'أيّ سؤال':kOfN(f,n)} فقط دون مساعدة، والنطاق يحتاج مراجعة مكثّفة`,
         veryweak:f===0 ? `لم ${G('يُتقن','تُتقن')} ${N} أيّ سؤال دون مساعدة؛ النطاق يحتاج إعادة تثبيت`
                        : `لم ${G('يُتقن','تُتقن')} ${N} سوى ${kOfN(f,n)} دون مساعدة؛ النطاق يحتاج إعادة تثبيت`}[b];
  }
  const he = G('he','she');
  if (kid) return all ? `Well done, champion! ${N} mastered every question (${n} of ${n})`
    : {excellent:`Well done, champion! ${N} mastered ${f} of ${n} questions`,
       good:`Great! ${N} mastered ${f} of ${n} questions — only ${r} left`,
       average:`${N} mastered ${f} of ${n} questions… ${remEn(r)} to master together!`,
       weak:`${N} bravely mastered ${f} of ${n}, and together we'll master the rest!`,
       veryweak:`${N} practised bravely today; together we start fresh!`}[b];
  return all ? `Masha'Allah! ${N} mastered every question (${n} of ${n}) without help`
    : {excellent:`Masha'Allah! ${N} mastered ${f} of ${n} questions without help`,
       good:`${N} mastered ${f} of ${n} questions without help; ${remEn(r)} to reinforce`,
       average:`${N} mastered ${f} of ${n} questions without help; ${remEn(r)} need reinforcing`,
       weak:`${N} mastered only ${f} of ${n} questions without help; this range needs intensive review`,
       veryweak:f===0?`${N} did not master any question without help; this range needs re-memorizing`
                     :`${N} mastered just ${f} of ${n} without help; this range needs re-memorizing`}[b];
}

// آيات تحتاج مراجعة: الخطأ أولًا ثم ما أجاب عنه بمساعدة، بحدّ أقصى 6 آيات، مدمجة في مدى متصل وموزّعة على السور
const HW_MAX = 6;
function reviewSet(c){
  const seen = new Set(), pick = [];
  [...c.wrongA, ...c.helpA].forEach(x => { const k = x.s+':'+x.a; if(!seen.has(k)){ seen.add(k); pick.push(x); } });
  return { shown: pick.slice(0,HW_MAX), more: pick.length > HW_MAX, total: pick.length };
}
function fmtAyat(items){
  const ar = isAr(), bySurah = new Map();
  items.forEach(x => { if(!bySurah.has(x.s)) bySurah.set(x.s, []); bySurah.get(x.s).push(x.a); });
  const parts = [];
  bySurah.forEach((arr, s) => {
    arr = [...new Set(arr)].sort((a,b)=>a-b);
    const rg = []; arr.forEach(a => { const l = rg[rg.length-1]; (l && a===l[1]+1) ? l[1]=a : rg.push([a,a]); });
    const txt = rg.map(([a,b]) => a===b ? `${a}` : `${a}–${b}`);
    const j = txt.length>1 ? txt.slice(0,-1).join(ar?'، ':', ')+(ar?' و':' and ')+txt[txt.length-1] : txt[0];
    const cnt = arr.length, nm = SURAH[s][ar?'ar':'en'];
    parts.push(ar ? `${cnt===1?'الآية':cnt===2?'الآيتين':'الآيات'} ${j} من سورة ${nm}` : `${cnt===1?'āyah':'āyāt'} ${j} of Surah ${nm}`);
  });
  return parts.join(ar?' و':' and ');
}
// نطاق الاختبار صغير (≤ صفحتين) ← تُتلى كاملة؛ أكبر ← صفحة واحدة كل يوم
const scopeLabel = sc => isAr() ? `${sc.whole?'سورة':'الآيات '+sc.from+'–'+sc.to+' من سورة'} ${SURAH[sc.s].ar}`.replace('سورة سورة','سورة') : `${sc.whole?'Surah':'āyāt '+sc.from+'–'+sc.to+' of Surah'} ${SURAH[sc.s].en}`;
function homeTask(c, N){
  const ar = isAr(), b = band4(c.score), rs = reviewSet(c), sc = c.scope, small = sc.pages <= 2;
  const nothing = rs.total === 0;
  const min = (b==='weak' || b==='veryweak' || rs.total>10) ? 10 : 5;
  const A = fmtAyat(rs.shown);
  const tail = rs.more ? (ar ? '، ثم نكمل بقية الآيات الأسبوع القادم' : ', then we continue with the rest next week') : '';
  const rd = G('he','she');
  let key, text;
  if (c.noData){
    key='nodata';
    text = ar ? `راجعوا مع ${N} ${scopeLabel(sc)} مرة كل يوم، وأخبروا المعلم بما ${G('يتعثّر','تتعثّر')} فيه.`
              : `Review ${scopeLabel(sc)} with ${N} once a day and tell the teacher where ${rd} struggles.`;
  } else if (b==='veryweak'){
    key='veryweak';
    text = small
      ? (ar ? `${G('يقرأ','تقرأ')} ${N} ${scopeLabel(sc)} من المصحف مرتين كل يوم بهدوء، ثم ${G('يسمّع','تسمّع')} لكم ما ${G('حفظ','حفظت')}، وتواصلوا مع المعلم لخطة تثبيت.`
             : `${N} reads ${scopeLabel(sc)} from the Mushaf twice a day, calmly, then recites what ${rd} knows to you; talk to the teacher about a re-memorizing plan.`)
      : (ar ? `${G('يقرأ','تقرأ')} ${N} ${A||'صفحة واحدة من النطاق'} من المصحف مرتين كل يوم، ثم ${G('يسمّعها','تسمّعها')} لكم، وتواصلوا مع المعلم لتقسيم النطاق${tail}.`
             : `${N} reads ${A||'one page of the range'} from the Mushaf twice a day, then recites it to you; talk to the teacher about splitting the range${tail}.`);
  } else if (b==='weak'){
    key='weak';
    text = ar ? `${G('يقرأ','تقرأ')} ${N} ${A} من المصحف ثلاث مرات، ثم ${G('يسمّعها','تسمّعها')} لكم غيبًا آيةً آية${tail}.`
              : `${N} reads ${A} from the Mushaf three times, then recites ${rs.shown.length>1?'them':'it'} to you from memory, one āyah at a time${tail}.`;
  } else if (b==='average'){
    key='average';
    text = ar ? `استمعوا من ${N} إلى ${A} غيبًا مرتين، وصحّحوا ${G('له','لها')} بلطف${tail}.`
              : `Listen to ${N} recite ${A} from memory twice, and correct gently${tail}.`;
  } else if (b==='good'){
    key='good';
    text = ar ? `اطلبوا من ${N} تلاوة ${A} غيبًا مرتين هذا الأسبوع${tail}.`
              : `Ask ${N} to recite ${A} from memory twice this week${tail}.`;
  } else if (nothing){
    key='perfect';
    text = small
      ? (ar ? `ثبّتوا الإنجاز: اطلبوا من ${N} تلاوة ${scopeLabel(sc)} غيبًا مرة هذا الأسبوع، وامدحوا${G('ه','ها')}.` : `Lock it in: ask ${N} to recite ${scopeLabel(sc)} from memory once this week, and praise ${G('him','her')}.`)
      : (ar ? `ثبّتوا الإنجاز: اختاروا كل يوم صفحة من نطاق ${N} واطلبوا تلاوتها غيبًا، وامدحوا${G('ه','ها')}.` : `Lock it in: each day pick one page of ${N}'s range and ask for it from memory, and praise ${G('him','her')}.`);
  } else {
    key='excellent';
    text = ar ? `ثبّتوا ${A}: اطلبوا من ${N} تلاوتها غيبًا مرتين هذا الأسبوع${tail}.`
              : `Reinforce ${A}: ask ${N} to recite ${rs.shown.length>1?'them':'it'} from memory twice this week${tail}.`;
  }
  const head = ar ? `${min===10?'مهمتكم معًا':'مهمتكم في البيت'}: ${arCount(min,'دقيقة','دقيقتان','دقائق','دقيقة')} يوميًا`
                  : `${min===10?'Your task together':'Your home task'}: ${min} minutes a day`;
  return { min, key, text, head };
}

function starSvg(on){ return `<svg viewBox="0 0 20 20"><path d="M10 1.6l2.5 5.3 5.6.7-4.1 4 1.1 5.6L10 14.5l-5.1 2.7 1.1-5.6-4.1-4 5.6-.7z" ${on?'fill="#d4af37"':'fill="none" stroke="#d9cfb8" stroke-width="1.5"'}/></svg>`; }
function ring(score, color, stroke, track){
  const r=42, c=2*Math.PI*r, off=c*(1-score/100);
  return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}

  ];

  return `<h3>${ar?'سيناريوهات «مهمتكم في البيت»':'“Home task” scenarios'}</h3>

      ? 'تُبنى المهمة من: <b>درجة الاختبار</b> (تحدّد الأسلوب والمدة) + <b>آيات الأخطاء ثم آيات المساعدة</b> (تحدّد ماذا يراجعون، بحدّ 6 آيات) + <b>حجم نطاق الحفظ</b> (يحدّد هل يُتلى كله أم صفحة كل يوم) + <b>عدد السور</b> في النطاق. كل الآيات من نطاق الاختبار نفسه، ولا تُذكر سورة خارجه.'
      : 'Built from: <b>the score</b> (sets the method and the time) + <b>mistaken then helped āyāt</b> (what to review, max 6) + <b>the size of the memorized range</b> (recite it all, or a page a day) + <b>number of surahs</b>. Every āyah comes from the tested range; no surah outside it is named.'}</p>
    <ol class="hwl">${list}</ol>`;
}

let h2cPromise = null;
function loadH2C(){
  if (window.html2canvas) return Promise.resolve();
  if (!h2cPromise) h2cPromise = new Promise((res, rej) => { const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  return h2cPromise;
}
async function downloadCard(cardId, btnId, prefix){
  cardId = typeof cardId === 'string' ? cardId : 'pc'; btnId = btnId || 'dl'; prefix = prefix || 'a';
  const btn = document.getElementById(btnId); btn.disabled = true; btn.textContent = UI[S.lang].busy;
  const host = document.getElementById(cardId).closest('.cardwrap'); const prevW = host.style.width;
  try {
    await loadH2C(); await document.fonts.ready;
    host.style.width = '540px';
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const el = document.getElementById(cardId);
    const canvas = await html2canvas(el, { scale: 1080 / el.offsetWidth, backgroundColor: null, useCORS: true });
    const a = document.createElement('a'); a.download = `ham-report-${prefix}-${S.tier}-${S.aud}.png`; a.href = canvas.toDataURL('image/png'); a.click();
  } catch (e) { alert(e.message || e); }
  finally { host.style.width = prevW; btn.disabled = false; btn.textContent = UI[S.lang][btn.dataset.lbl || 'dl']; }
}

      <div class="ph" style="margin-top:.6cqw;opacity:.85"><span>${ar?'الاتجاه':'Trend'}: <b>${P.dir}</b></span><span>${ar?'مدة الاختبار':'Test duration'}: <b>${ar?arCount(d.mins,'دقيقة','دقيقتان','دقائق','دقيقة'):d.mins+' min'}</b></span></div>

    <div class="task">${task}</div>

  </div>
  <button class="btn" id="dl-c" data-lbl="dl_c">${UI[S.lang].dl_c}</button>`;
  document.getElementById('dl-c').onclick = () => downloadCard('mc','dl-c','c');
  document.getElementById('spec-c').innerHTML = ar ? `
    <h3>فكرة هذا النموذج</h3>
    <ul>
      <li><b>1080×1350 (4:5)</b>: كان مربعًا، لكن بعد إضافة التقدّم العام ووقت الإجابة والختم لم يعد المحتوى يتسع بخط مقروء، فصار 4:5 — وهو أيضًا مقاس يعرضه واتساب كاملًا تقريبًا داخل المحادثة.</li>
      <li><b>وقت الإجابة</b>: مربع رابع «متوسط وقت الإجابة» بجانب الأرقام، و«مدة الاختبار» بجانب الاتجاه.</li>
      <li><b>اسم المعلم وختمه</b> يُسحبان من «ملف المعلم» كما في التقرير الحالي (<code>getTeacherIdentity()</code>: الاسم والختم المرفوع). الختم يوضع على مربع فاتح حتى يظهر حبره على الخلفية الداكنة؛ وإن لم يُرفع ختم يظهر الاسم فقط. الختم المعروض هنا تجريبي.</li>
      <li><b>الأساسيات فقط</b>: من؟ وكم؟ (النتيجة + الأرقام الثلاثة بصيغة «4 أسئلة صحيحة») وأين الخطأ؟ وماذا أفعل؟ — والتفاصيل كلها في ملف PDF لمن يريد.</li>
      <li><b>جديد: مستوى التقدّم العام لآخر 4 اختبارات</b> كما في المنصة (هذا التقييم + 3 سابقة): كل اختبار دائرة بلون مستواه وتاريخه، مع المستوى العام (متوسط الأربعة) واتجاه التقدّم.</li>
      <li>خلفية داكنة بهوية المنصة تلفت النظر بين صور المحادثة، والنتيجة بلون المستوى (أخضر/ذهبي/مرجاني).</li>
      <li>مناسب للإرسال اليومي المتكرر؛ النموذج أ أو ب يناسبان التقرير الأسبوعي أو المهم.</li>
    </ul>
    <h3>للنقاش</h3>
    <ul><li>هل يكفي هذا القدر يوميًا، مع إرسال PDF الشامل عند الحاجة فقط؟</li><li>هل نضيف سطر ملاحظة المعلم (سيصغر الخط قليلًا)؟</li></ul>` : `
    <h3>The idea</h3>
    <ul>
      <li><b>1080×1350 (4:5)</b>: it was square, but with overall progress, answer time and the stamp the content no longer fit at a readable size; 4:5 is also shown almost whole inside a WhatsApp chat.</li>
      <li><b>Answer time</b>: a fourth tile “avg. answer time” next to the counts, and “test duration” next to the trend.</li>
      <li><b>Teacher name and stamp</b> come from the teacher profile, as in today's report (<code>getTeacherIdentity()</code>). The stamp sits on a light tile so its ink shows on the dark background; without a stamp only the name shows. The stamp here is a sample.</li>
      <li><b>Essentials only</b>: who? how much? (score + three numbers as “4 questions correct”) where are the mistakes? what do I do? — details stay in the PDF.</li>
      <li><b>New: overall progress over the last 4 tests</b>, as in the platform (this evaluation + 3 previous): each test a dot in its level colour with its date, plus the overall level (average of the four) and the trend.</li>
      <li>A dark background in the platform identity stands out among chat photos; the score takes the level colour.</li>
      <li>Fits frequent daily sending; designs A or B suit weekly or important reports.</li>
    </ul>
    <h3>To discuss</h3>
    <ul><li>Is this enough daily, with the full PDF only when needed?</li><li>Add the teacher's note line (type gets a bit smaller)?</li></ul>`;
}

/* ===================== النموذج د: المربع الفاتح بمنحنى التقدّم ===================== */
function renderMD(){
  const T = texts(), d = DATA[S.tier], ar = isAr(), kid = S.aud==='kids';
  const col = kid ? {excellent:'#2f6fd6',average:'#f29d0c',weak:'#e2604a'}[S.tier] : COLORS[S.tier];
  const P = progress4();
  const rev = T.review.slice(0,4).map(r=>+r[0]).sort((x,y)=>x-y);
  const revTxt = rev.length ? (ar ? `${rev.length>1?'الآيات':'الآية'} ${rev.join(' و ')}` : `āyāt ${rev.join(', ')}`) : '';
  const task = ar
    ? (rev.length ? `في البيت: ${G('يسمّع','تسمّع')} ${name()} ${revTxt} من سورة الملك مرتين يوميًا` : `في البيت: تلاوة سورة الملك كاملة غيبًا مرة هذا الأسبوع`)
    : (rev.length ? `At home: ${name()} recites ${revTxt} of Al-Mulk twice a day` : `At home: recite all of Al-Mulk from memory once this week`);
  // منحنى بسيط: محور أفقي زمني (الأقدم ← اليوم حسب اتجاه اللغة)، ونطاق رأسي 30–100
  const W = 400, H = 108, padX = 28, top = 20, bot = 24;
  const xs = P.steps.map((_,i) => { const x = padX + i*(W-2*padX)/3; return ar ? W - x : x; });
  const y = p => top + (100 - Math.max(30,Math.min(100,p))) / 70 * (H - top - bot);
  const pts = P.steps.map((st,i)=>[xs[i], y(st.p)]);
  const line = pts.map(p=>p.join(',')).join(' ');
  const area = `${pts[0][0]},${H-bot} ${line} ${pts[3][0]},${H-bot}`;
  const lineCol = kid ? '#2f6fd6' : '#0d5c46';
  const bands = [[90,'#e8f2ec'],[75,'#f1f7f3'],[60,'#fbf3e1']].map(([v,c],i,a)=>{ const y1=y(i?a[i-1][0]:100), y2=y(v); return `<rect x="0" y="${y1}" width="${W}" height="${y2-y1}" fill="${c}" opacity=".7"/>`; }).join('');
  const svg = `<svg viewBox="0 0 ${W} ${H}" style="direction:ltr">${bands}
    <line x1="0" x2="${W}" y1="${y(P.avg)}" y2="${y(P.avg)}" stroke="#b9a983" stroke-dasharray="4 4" stroke-width="1"/>
    <text x="${ar?W-4:4}" y="${y(P.avg)+12}" font-size="10" fill="#8a7a58" text-anchor="${ar?'end':'start'}" font-family="IBM Plex Sans Arabic">${ar?'المتوسط':'avg'} ${P.avg}%</text>
    <polygon points="${area}" fill="${lineCol}" opacity=".08"/>
    <polyline points="${line}" fill="none" stroke="${lineCol}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${P.steps.map((st,i)=>`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${st.cur?7:5}" fill="${TIER_COL[st.t]}" stroke="#fff" stroke-width="2"/>
      <text x="${pts[i][0]}" y="${pts[i][1]-11}" font-size="${st.cur?13:11}" font-weight="800" fill="#1c2a23" text-anchor="middle" font-family="IBM Plex Sans Arabic">${st.p}%</text>
      <text x="${pts[i][0]}" y="${H-8}" font-size="10.5" fill="#6b6b63" text-anchor="middle" font-family="IBM Plex Sans Arabic" ${st.cur?'font-weight="800"':''}>${st.w}</text>`).join('')}
  </svg>`;
  document.getElementById('md-host').innerHTML = `
  <div class="md${kid?' kids':''}" id="md" dir="${ar?'rtl':'ltr'}">
    <div class="hd"><div class="av">${name()[0]}</div>
      <div><div class="nm">${full()}</div><div class="sc">${T.scope} · ${T.facts}<br>${T.dateLong}</div></div>
      <div class="sp"><div class="pct" style="color:${col}">${d.score}%</div><span class="tl" style="background:${col}">${T.tierLabel}</span></div></div>
    <div class="chart">
      <div class="ch"><b>${ar?'مستوى التقدّم العام · آخر 4 اختبارات':'Overall progress · last 4 tests'}</b><span class="lv" style="background:${TIER_COL[P.avgTier]}">${tierName(P.avgTier)} · <span dir="ltr">${P.avg}%</span></span></div>
      ${svg}
      <div class="ch" style="justify-content:center;color:${P.up?'#0d5c46':P.down?'#9e3b2d':'#6f644e'}"><span>${ar?'الاتجاه':'Trend'}: <b style="color:inherit">${P.dir}</b></span></div>
    </div>
    <div class="rows">
      <div class="r1c"><b>${d.full}</b><span>${qLabel(d.full,'full')}</span></div>
      <div class="r2c"><b>${d.help}</b><span>${qLabel(d.help,'help')}</span></div>
      <div class="r3c"><b>${d.wrong}</b><span>${qLabel(d.wrong,'wrong')}</span></div>
      <div class="r4c tm"><b>${timeTile(d).v}</b><span>${timeTile(d).l}</span></div>
    </div>
    <div class="tk"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M10 20v-6h4v6"/></svg></div><span>${task}</span></div>
    <div class="sig">${teacherSig()}<div class="lbl">${ar?'الاسم والختم من «ملف المعلم»':'Name & stamp from the teacher profile'}</div></div>
    <div class="ft"><span><img src="assets/brand/ham-logo-light.svg" alt="">${T.brand}</span><span>${ar?'مدة الاختبار':'Test duration'}: ${ar?arCount(d.mins,'دقيقة','دقيقتان','دقائق','دقيقة'):d.mins+' min'}</span></div>
  </div>
  <button class="btn" id="dl-d" data-lbl="dl_d">${UI[S.lang].dl_d}</button>`;
  document.getElementById('dl-d').onclick = () => downloadCard('md','dl-d','d');
  document.getElementById('spec-d').innerHTML = ar ? `
    <h3>الفرق عن النموذج ج</h3>
    <ul>
      <li><b>خلفية فاتحة</b> بهوية التقرير الحالي (كريمي + أخضر) بدل الداكنة — أقرب لما اعتاده أولياء الأمور، ويُطبع بوضوح لو احتاجوا.</li>
      <li><b>التقدّم العام كمنحنى</b> لآخر 4 اختبارات: نقطة لكل اختبار بلون مستواه، وخط متقطع لمتوسط الأربعة، وخلفية ملوّنة خفيفة لنطاقات المستويات؛ فيُرى الصعود أو الهبوط بنظرة.</li>
      <li><b>النتيجة بجانب الاسم</b> في الأعلى، فتبقى المساحة الوسطى كلها للتقدّم.</li>
      <li>نفس الأرقام بصيغة «4 أسئلة صحيحة» + <b>متوسط وقت الإجابة</b> ومدة الاختبار، ونفس سطر مهمة البيت، و<b>اسم المعلم وختمه من ملفه</b> في صندوق مستقل (الختم هنا تجريبي).</li>
    </ul>
    <h3>ملاحظة على العدّ</h3>
    <ul><li>كتبتُ «4 أسئلة صحيحة» و«سؤالان بمساعدة» و«سؤال يحتاج مراجعة» بتمييز العدد الصحيح في العربية بدل «4 سؤال صحيح» حرفيًا؛ إن أردت الصيغة الحرفية أغيّرها.</li></ul>` : `
    <h3>How it differs from C</h3>
    <ul>
      <li><b>Light background</b> in the current report identity (cream + green) instead of dark — closer to what parents know, and prints clearly.</li>
      <li><b>Overall progress as a line chart</b> over the last 4 tests: a point per test in its level colour, a dashed line for the four-test average, and faint level bands, so rise or fall is visible at a glance.</li>
      <li><b>Score next to the name</b> at the top, leaving the middle for progress.</li>
      <li>Same counts as “4 questions correct” + <b>average answer time</b> and test duration, same home-task line, and <b>the teacher name and stamp from their profile</b> in its own box (sample stamp here).</li>
    </ul>`;
}

    ['fix', ar?'التوقيع':'Signature', 'المعلم / المعلم', ar?'الاسم + «معلم الحلقة»، أو سطر التوقيع فقط':'Name + “Halaqah teacher”, or the signature line only', ar?'حين لا يوجد اسم معلم يظهر الافتراضي «المعلم» مرتين فوق بعض.':'With no teacher name, the default “Teacher” appears twice.'],
    ['fix', ar?'الترويسة/التذييل':'Header/footer', 'منصة حمٓ لتثبيت الحفظ و المراجعة / منصة حمٓ · تحفيظ القرآن الكريم', 'منصة حمٓ لتثبيت الحفظ والمراجعة', ar?'مسافة زائدة قبل واو العطف، واسمان مختلفان للمنصة في التقرير نفسه — يُوحَّد.':'Extra space before “و”, and two different platform names in one report — unify.'],
    ['clr', ar?'عنوان التقرير':'Report title', 'تقرير تقدّم الطالب — في حفظ القرآن الكريم', 'تقرير تقييم المراجعة', ar?'الجلسة تقييم مراجعة لنطاق محدد، لا تقرير تقدّم عام في الحفظ (هذا دور التقرير الشهري).':'The session evaluates a review of a given range; overall progress is the monthly report\'s job.'],
    ['clr', ar?'شارة الفرق':'Change badge', '▼ 1 عن المحاولة السابقة', 'أقل بنقطة واحدة من المرة السابقة (71%) — أو «ثابت تقريبًا» إن كان الفرق ≤ 2', ar?'الرقم وحده مع سهم لا يوضح «نقطة أم سؤال؟»، وفرق نقطة واحدة باللون الأحمر يُقلق ولي الأمر بلا داعٍ.':'A bare number with an arrow is unclear, and a 1-point drop in red worries parents needlessly.'],

    ['clr', ar?'سطر الصدق (جيد)':'Honesty line (good)', 'نتيجة جيدة تدل على حفظ متين لمعظم الأسئلة، مع بعض الجوانب التي تستحق مزيدًا من المراجعة والتثبيت.', 'نتيجة جيدة وحفظ متين لمعظم الأسئلة، وبقيت مواضع قليلة للتثبيت.', ar?'أقصر بالنصف بنفس المعنى.':'Half the length, same meaning.'],
    ['clr', ar?'أول تقييم':'First evaluation', 'هذه أول محاولة مسجَّلة في سجل الطالب — ستظهر المقارنة مع المحاولات السابقة بدءًا من التقييم القادم.', 'هذا أول تقييم مسجَّل، وستظهر المقارنة من التقييم القادم.', ar?'اختصار.':'Shorter.'],
    ['add', ar?'جديد':'New', '—', ar?'مهمتكم في البيت (5 دقائق يوميًا): استمعوا من {name} إلى الآيات 12–15 و26–27 من سورة الملك غيبًا مرتين…':'Your home task (5 min a day): listen to {name} recite āyāt 12–15 and 26–27 from memory twice…', ar?'أهم سؤال عند ولي الأمر «ماذا أفعل؟» — تُبنى تلقائيًا من آيات الأخطاء، وتتغيّر مدتها حسب المستوى.':'The parent\'s key question is “what do I do?” — built from the mistaken āyāt.'],
    ['add', ar?'جديد':'New', '—', ar?'التاريخ باليوم: «الخميس 5 نوفمبر 2026»':'Date with weekday', ar?'الحالي «2026 / 11 / 05» بصيغة معكوسة غير مألوفة لولي الأمر.':'Today it shows “2026 / 11 / 05”, an unfamiliar order.'],
    ['add', ar?'جديد (الصغار)':'New (kids)', '—', ar?'رسالة إلى {name}: راجع{ي} آياتك الثلاث وستربح{ين} النجمة القادمة!':'A message to {name}: review your three āyāt and win the next star!', ar?'الطفل يرى الصورة مع والديه؛ جملة موجهة له تحفّزه.':'Children see the image with their parents; a line for them motivates.'],
    ['add', ar?'ختام اختياري':'Optional closing', 'وسنتابع التقدم معًا أولًا بأول.', 'وسنتابع التقدم معًا أولًا بأول، ونسعد بتواصلكم في أي وقت.', ar?'يفتح باب التواصل مع المعلم.':'Opens the door to contact the teacher.']

}

function applyUI(){
  const L = UI[S.lang];
  document.documentElement.lang = S.lang; document.documentElement.dir = isAr() ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = L[el.dataset.t] || ''; });
  document.title = L.title;
  renderR1(); renderPC(); renderMB(); renderMC(); renderMD(); renderTable();
}
function bindSeg(id, key){
  document.querySelectorAll(`#${id} button`).forEach(b => b.addEventListener('click', () => {
    S[key] = b.dataset.v;
    document.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle('on', x === b));
    applyUI();
  }));
}
bindSeg('seg-tier','tier'); bindSeg('seg-aud','aud'); bindSeg('seg-g','g'); bindSeg('seg-lang','lang');
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.id === b.dataset.tab));
  try { location.hash = b.dataset.tab; } catch(e){}
}));
const h = (location.hash || '').slice(1); if (h) { const b = document.querySelector(`.tabs button[data-tab="${h}"]`); if (b) b.click(); }
applyUI();
</script>
