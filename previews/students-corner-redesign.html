<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="../core/themeInit.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معاينة — إعادة ترتيب ركن «طلابي»</title>
<!-- المعاينة تحمّل نفس ملفات تنسيق المنصة وبنفس الترتيب (index.html) وكتلة #main-header كما هي، فيظهر الركن كما سيظهر داخل المنصة تمامًا -->
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/adults.css">
<link rel="stylesheet" href="../css/kids.css">
<link rel="stylesheet" href="../css/home.css">
<link rel="stylesheet" href="../css/homeFast.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/landscape.css">
<link rel="stylesheet" href="../css/theme-dark-auto.css">
<link rel="stylesheet" href="../css/theme-dark.css">
<link rel="icon" type="image/svg+xml" href="../icons/favicon.svg">
<style>
/* ===== «طلابي» الجديدة — مبنية بنفس نمط شاشة my-students.html (المحدِّدات تبدأ بـ #app-root #ms-screen) لكن بالكامل برموز الهوية
   (--dh-*) فتنقلب تلقائيًا في المظهر الداكن بلا ألوان ثابتة ===== */
#app-root #ms-screen{max-width:600px;text-align:start;padding:22px 20px !important;display:flex;flex-direction:column;gap:16px;color:var(--dh-ink)}
#app-root #ms-screen button{font-family:inherit}
#app-root #ms-screen .ms-head{display:flex;align-items:center;gap:10px}
#app-root #ms-screen .ms-back{width:44px;height:44px;flex-shrink:0;border-radius:14px;border:1.5px solid var(--dh-border-strong);background:var(--dh-surface-3);color:var(--dh-emerald-700);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;margin:0;min-width:0}
#app-root #ms-screen .ms-back:hover{background:var(--dh-surface-0)}
[dir="ltr"] #ms-screen .ms-back svg{transform:scaleX(-1)}
#app-root #ms-screen .ms-title{margin:0 !important;font-size:1.9rem !important;font-weight:700 !important;color:var(--dh-emerald-700) !important;text-shadow:none !important;line-height:1.3;text-align:start}
#app-root #ms-screen .ms-title small{display:block;font-size:.88rem;font-weight:400;color:var(--dh-ink-soft)}
#app-root #ms-screen .ms-titles{flex:1;min-width:0}

/* المطلوب الآن */
#app-root #ms-screen .ms-now{background:linear-gradient(135deg,var(--dh-emerald-700),var(--dh-emerald-600));color:var(--dh-on-emerald);border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center;box-shadow:var(--dh-sh-soft)}
#app-root #ms-screen .ms-now-ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:1.4rem;flex:none}
#app-root #ms-screen .ms-now-tx{flex:1;min-width:0}
#app-root #ms-screen .ms-now-tx small{display:block;font-size:.78rem;opacity:.9;font-weight:600}
#app-root #ms-screen .ms-now-tx b{font-size:1.05rem;line-height:1.5}
#app-root #ms-screen .ms-now-go{background:var(--dh-gold-500);color:var(--dh-on-gold);font-weight:700;border:0;border-radius:12px;padding:10px 18px;min-height:var(--dh-tap);white-space:nowrap;cursor:pointer;margin:0;min-width:0;box-shadow:none}
#app-root #ms-screen .ms-now.is-clear{background:var(--dh-ok-bg);color:var(--dh-ok-ink);box-shadow:none}
#app-root #ms-screen .ms-now.is-clear .ms-now-ic{background:transparent}


/* شريط الأرقام (نفس .ms-stats في المنصة) */
#app-root #ms-screen .ms-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#app-root #ms-screen .ms-num{background:var(--dh-surface-3);border:1.5px solid var(--dh-border);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
#app-root #ms-screen .ms-num.is-primary{background:var(--dh-emerald-700);border-color:var(--dh-emerald-700);color:var(--dh-on-emerald)}
#app-root #ms-screen .ms-num b{font-size:1.5rem;line-height:1.2}
#app-root #ms-screen .ms-num b.alert{color:var(--dh-warn)}
#app-root #ms-screen .ms-num b small{font-size:.95rem;font-weight:500;color:var(--dh-ink-soft)}
#app-root #ms-screen .ms-num > span{font-size:.82rem;color:var(--dh-ink-soft);line-height:1.4}
#app-root #ms-screen .ms-num.is-primary > span{color:var(--dh-on-emerald);opacity:.85}
/* تخطيط الركن: عمود واحد على الجوال، وعمودان على الشاشات العريضة */
#app-root #ms-screen .ms-layout{display:flex;flex-direction:column;gap:16px}
#app-root #ms-screen .ms-aside,#app-root #ms-screen .ms-main{display:flex;flex-direction:column;gap:16px;min-width:0}
#app-root #ms-screen .ms-side-month{display:none}
@media(min-width:900px){
  #app-root #ms-screen.is-wide{max-width:1120px !important;width:calc(100% - 48px);margin:28px auto !important;padding:28px 36px !important}
  #app-root #ms-screen.is-wide .ms-now{flex-wrap:wrap}
  #app-root #ms-screen.is-wide .ms-now-go{width:100%}
  #app-root #ms-screen.is-wide .ms-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:28px;align-items:start}
  #app-root #ms-screen.is-wide .ms-aside{order:2;position:sticky;top:16px}
  #app-root #ms-screen.is-wide .ms-main{order:1}
  #app-root #ms-screen.is-wide .ms-nums{grid-template-columns:1fr}
  #app-root #ms-screen.is-wide .ms-num{flex-direction:row;align-items:baseline;gap:10px;padding:12px 14px}
  #app-root #ms-screen.is-wide .ms-num b{min-width:2.6ch}
  #app-root #ms-screen.is-wide .ms-side-month{display:flex;flex-direction:column;gap:10px;background:var(--dh-surface-3);border:1.5px solid var(--dh-border);border-radius:18px;padding:14px}
  #app-root #ms-screen:not(.is-wide){max-width:760px !important}
}
#app-root #ms-screen .ms-side-month h4{margin:0;font-size:1rem;color:var(--dh-ink)}
#app-root #ms-screen .ms-side-step{display:flex;gap:10px;align-items:center;font-size:.9rem;background:transparent;border:0;color:var(--dh-ink);text-align:start;cursor:pointer;padding:4px 0;margin:0;min-width:0;box-shadow:none}
#app-root #ms-screen .ms-side-step .no{width:26px;height:26px;border-radius:50%;background:var(--dh-emerald-700);color:var(--dh-on-emerald);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
#app-root #ms-screen .ms-side-step small{margin-inline-start:auto;color:var(--dh-ink-soft)}

/* الاختصارات */
#app-root #ms-screen .ms-quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#app-root #ms-screen .ms-q{background:var(--dh-surface-3);color:var(--dh-ink);border:1.5px solid var(--dh-border-strong);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;font-weight:700;text-align:center;min-height:84px;cursor:pointer;margin:0;min-width:0;box-shadow:none;transition:transform .15s}
#app-root #ms-screen .ms-q:hover{transform:translateY(-2px);border-color:var(--dh-emerald-600)}
#app-root #ms-screen .ms-q svg{color:var(--dh-gold-ink,var(--dh-ink))}
[data-theme="dark"] #app-root #ms-screen .ms-q:not(.is-main) svg{color:var(--dh-gold-500)}
#app-root #ms-screen .ms-q.is-main{background:var(--dh-emerald-700);color:var(--dh-on-emerald);border-color:var(--dh-emerald-700)}
#app-root #ms-screen .ms-q.is-main svg{color:var(--dh-on-emerald)}

/* التبويبات */
#app-root #ms-screen .ms-tabs{display:flex;gap:4px;background:var(--dh-surface-0);border:1.5px solid var(--dh-border);border-radius:16px;padding:4px}
#app-root #ms-screen .ms-tab{flex:1;border:0;border-radius:12px;padding:10px 6px;font-weight:700;font-size:.92rem;color:var(--dh-ink-soft);background:transparent;min-height:var(--dh-tap);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;margin:0;min-width:0;box-shadow:none}
#app-root #ms-screen .ms-tab.on{background:var(--dh-emerald-700);color:var(--dh-on-emerald)}
#app-root #ms-screen .ms-tab .n{background:var(--dh-warn-bg);color:var(--dh-warn);border-radius:99px;font-size:.72rem;padding:0 7px;font-weight:700}
#app-root #ms-screen .ms-tab.on .n{background:rgba(255,255,255,.25);color:#fff}

#app-root #ms-screen .ms-tools{display:flex;gap:8px;flex-wrap:wrap}
#app-root #ms-screen .ms-search{flex:1;min-width:140px;border:1.5px solid var(--dh-border-strong);background:var(--dh-surface-3);color:var(--dh-ink);border-radius:99px;padding:8px 16px;min-height:var(--dh-tap);margin:0;width:auto;font-size:1rem}
#app-root #ms-screen .ms-btn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;min-height:var(--dh-tap);cursor:pointer;margin:0;min-width:0;font-size:1rem;box-shadow:none}
#app-root #ms-screen .ms-btn.gold{background:linear-gradient(135deg,var(--dh-gold-300),var(--dh-gold-500));color:var(--dh-on-gold)}
#app-root #ms-screen .ms-btn.em{background:var(--dh-emerald-700);color:var(--dh-on-emerald)}
#app-root #ms-screen .ms-btn.line{background:var(--dh-surface-3);color:var(--dh-ink);border:1.5px solid var(--dh-border-strong)}
#app-root #ms-screen .ms-chips{display:flex;gap:6px;flex-wrap:wrap}
#app-root #ms-screen .ms-chip{border:1.5px solid var(--dh-border-strong);background:var(--dh-surface-3);color:var(--dh-ink);border-radius:99px;padding:4px 14px;font-size:.84rem;font-weight:600;min-height:36px;cursor:pointer;margin:0;min-width:0;box-shadow:none}
#app-root #ms-screen .ms-chip.on{background:var(--dh-emerald-700);border-color:var(--dh-emerald-700);color:var(--dh-on-emerald)}

#app-root #ms-screen .ms-list{display:flex;flex-direction:column;gap:8px}
#app-root #ms-screen .ms-line{display:flex;gap:4px;align-items:center}
#app-root #ms-screen .ms-row{display:flex;align-items:center;gap:12px;background:var(--dh-surface-3);color:var(--dh-ink);border:1.5px solid var(--dh-border);border-radius:16px;padding:10px 12px;cursor:pointer;text-align:start;width:100%;margin:0;min-width:0;box-shadow:none}
#app-root #ms-screen .ms-row:hover{border-color:var(--dh-emerald-600)}
#app-root #ms-screen .ms-row.static{cursor:default}
#app-root #ms-screen .ms-av{width:44px;height:44px;border-radius:50%;background:var(--dh-ok-bg);color:var(--dh-ok-ink);display:grid;place-items:center;font-weight:700;flex:none}
#app-root #ms-screen .ms-nm{flex:1;min-width:0}
#app-root #ms-screen .ms-nm b{display:block;font-size:1.02rem}
#app-root #ms-screen .ms-nm small{color:var(--dh-ink-soft);font-size:.8rem}
#app-root #ms-screen .ms-tag{font-size:.74rem;font-weight:700;border-radius:99px;padding:2px 10px;white-space:nowrap}
#app-root #ms-screen .ms-tag.wait{background:var(--dh-warn-bg);color:var(--dh-warn)}
#app-root #ms-screen .ms-tag.done{background:var(--dh-ok-bg);color:var(--dh-ok-ink)}
#app-root #ms-screen .ms-tag.open{background:var(--dh-info-bg);color:var(--dh-info)}
#app-root #ms-screen .ms-chev{color:var(--dh-ink-soft)}
html[dir="rtl"] #ms-screen .ms-chev{transform:scaleX(-1)}
#app-root #ms-screen .ms-menu{position:relative}
#app-root #ms-screen .ms-dots{width:40px;height:40px;border-radius:10px;border:0;background:transparent;font-size:1.3rem;color:var(--dh-ink-soft);cursor:pointer;margin:0;min-width:0;padding:0;box-shadow:none}
#app-root #ms-screen .ms-dots:hover{background:var(--dh-surface-0)}
#app-root #ms-screen .ms-pop{display:none;position:absolute;inset-inline-end:0;top:42px;background:var(--dh-surface-3);border:1.5px solid var(--dh-border-strong);border-radius:12px;box-shadow:var(--dh-sh-lift);padding:6px;min-width:190px;z-index:10}
#app-root #ms-screen .ms-menu.open .ms-pop{display:grid}
#app-root #ms-screen .ms-pop button{background:none;border:0;color:var(--dh-ink);text-align:start;padding:10px 12px;border-radius:8px;font-weight:600;cursor:pointer;margin:0;min-width:0;box-shadow:none;font-size:1rem}
#app-root #ms-screen .ms-pop button:hover{background:var(--dh-surface-0)}
#app-root #ms-screen .ms-pop .dng{color:var(--dh-danger)}
#app-root #ms-screen .ms-hint{color:var(--dh-ink-soft);font-size:.85rem;margin:0}
#app-root #ms-screen details summary{cursor:pointer;color:var(--dh-ink-soft);font-weight:600}

/* هذا الشهر */
#app-root #ms-screen .ms-step{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--dh-border);border-radius:18px;background:var(--dh-surface-3)}
#app-root #ms-screen .ms-step .no{width:34px;height:34px;border-radius:50%;background:var(--dh-emerald-700);color:var(--dh-on-emerald);display:grid;place-items:center;font-weight:700;flex:none}
#app-root #ms-screen .ms-step.done .no{background:var(--dh-ok)}
#app-root #ms-screen .ms-step .bd{flex:1;min-width:0}
#app-root #ms-screen .ms-step h3{font-size:1.05rem;margin:0;color:var(--dh-ink) !important;text-align:start;text-shadow:none}
#app-root #ms-screen .ms-step p{color:var(--dh-ink-soft);font-size:.86rem;margin:2px 0 8px}
#app-root #ms-screen .ms-bar{height:8px;background:var(--dh-border-soft);border-radius:99px;overflow:hidden;margin:6px 0 10px}
#app-root #ms-screen .ms-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--dh-emerald-600),var(--dh-emerald-700))}
#app-root #ms-screen .ms-mini{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
#app-root #ms-screen .ms-mini span{background:var(--dh-warn-bg);color:var(--dh-warn);border-radius:99px;padding:2px 12px;font-size:.82rem;font-weight:700}
#app-root #ms-screen .ms-sched{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--dh-surface-0);border:1.5px dashed var(--dh-border-strong);border-radius:16px;padding:10px 12px;flex-wrap:wrap}
#app-root #ms-screen .ms-days{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
#app-root #ms-screen .ms-days i{font-style:normal;font-size:.74rem;background:var(--dh-ok-bg);color:var(--dh-ok-ink);border-radius:99px;padding:0 8px;font-weight:700}
#app-root #ms-screen .ms-days i.off{background:var(--dh-surface-0);color:var(--dh-ink-soft);font-weight:400}

/* ملف الطالب */
#app-root #ms-screen .ms-act{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
#app-root #ms-screen .ms-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#app-root #ms-screen .ms-stat{background:var(--dh-surface-3);border:1.5px solid var(--dh-border);border-radius:16px;padding:10px;text-align:center;display:flex;flex-direction:column}
#app-root #ms-screen .ms-stat b{font-size:1.4rem;color:var(--dh-emerald-700)}
#app-root #ms-screen .ms-stat small{color:var(--dh-ink-soft);font-size:.78rem}
#app-root #ms-screen .ms-subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
#app-root #ms-screen .ms-subtabs .ms-chip{white-space:nowrap;flex-shrink:0}
#app-root #ms-screen .ms-todo{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--dh-warn-bg);color:var(--dh-warn);font-weight:700;justify-content:space-between;margin-bottom:10px}
#app-root #ms-screen .ms-card2{background:var(--dh-surface-3);border:1.5px solid var(--dh-border);border-radius:16px;padding:14px;margin-bottom:10px}
#app-root #ms-screen .ms-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#app-root #ms-screen .ms-badges span{background:var(--dh-gold-soft,var(--dh-warn-bg));color:var(--dh-ink);border-radius:12px;padding:8px 12px;font-weight:700;font-size:.85rem}
#app-root #ms-screen .ms-hist{width:100%;border-collapse:collapse;font-size:.88rem}
#app-root #ms-screen .ms-hist td,#app-root #ms-screen .ms-hist th{padding:8px;border-bottom:1px solid var(--dh-border-soft);text-align:start}

/* ما الذي تغيّر */
#app-root #ms-screen .ms-legend{border:1.5px dashed var(--dh-border-strong);border-radius:16px;padding:14px;font-size:.88rem;color:var(--dh-ink-soft)}
#app-root #ms-screen .ms-legend h4{color:var(--dh-ink);margin:0 0 6px;font-size:1rem}
#app-root #ms-screen .ms-legend li{margin-inline-start:18px}

/* نافذة طالب جديد (نفس #add-modal: .modal-overlay/.modal-content) */
#add-modal .modal-content.as-add{max-width:520px;width:calc(100% - 24px);padding:22px !important;display:flex;flex-direction:column;gap:12px;text-align:start;max-height:92vh;overflow:auto;background:var(--dh-surface-1) !important;color:var(--dh-ink) !important;border-radius:20px !important}
#add-modal h2{margin:0 !important;font-size:1.5rem !important;text-align:center;color:var(--dh-ink) !important;text-shadow:none !important}
#add-modal label{display:block;font-size:.85rem;font-weight:700;color:var(--dh-ink-soft) !important;margin-bottom:3px}
#add-modal input,#add-modal select{width:100%;border:1.5px solid var(--dh-border-strong) !important;background:var(--dh-surface-3) !important;color:var(--dh-ink) !important;border-radius:12px !important;padding:10px 12px !important;min-height:46px;margin:0}
#add-modal .seg{display:flex;gap:8px}
#add-modal .seg button{flex:1;border:2px solid var(--dh-border-strong);border-radius:12px;padding:9px;font-weight:700;background:var(--dh-surface-3);color:var(--dh-ink);margin:0;min-width:0;cursor:pointer;box-shadow:none}
#add-modal .seg button.on{border-color:var(--dh-gold-500);background:var(--dh-warn-bg)}
#add-modal .dots2{display:flex;justify-content:center;gap:6px}
#add-modal .dots2 i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.85rem;border:2px solid var(--dh-border);color:var(--dh-ink-soft)}
#add-modal .dots2 i.on{background:var(--dh-emerald-700);color:var(--dh-on-emerald);border-color:var(--dh-emerald-700)}
#add-modal .nav{display:flex;gap:8px}#add-modal .nav>*{flex:1}
#add-modal .nbtn{border:0;border-radius:12px;padding:11px;font-weight:700;min-height:var(--dh-tap);cursor:pointer;margin:0;min-width:0;font-size:1rem;box-shadow:none}
#add-modal .nbtn.gold{background:linear-gradient(135deg,var(--dh-gold-300),var(--dh-gold-500));color:var(--dh-on-gold)}
#add-modal .nbtn.em{background:var(--dh-emerald-700);color:var(--dh-on-emerald)}
#add-modal .nbtn.line{background:var(--dh-surface-3);color:var(--dh-ink);border:1.5px solid var(--dh-border-strong)}
#add-modal .nbtn.ghost{background:none;color:var(--dh-ink-soft)}

/* شريط المعاينة السفلي (ليس جزءًا من المنصة) + رسالة */
.pv-bar{position:fixed;inset-inline:0;bottom:0;z-index:3000;background:#2b2100;color:#fbf3d5;font:600 .8rem 'IBM Plex Sans Arabic',sans-serif;padding:8px 14px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.pv-bar .pv-sw{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pv-bar button{border:1.5px solid #d4af37;background:transparent;color:#fbf3d5;border-radius:99px;padding:5px 14px;font:inherit;font-weight:700;cursor:pointer}
.pv-bar button.on{background:#d4af37;color:#2b2100}
.pv-toast{position:fixed;bottom:100px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#06231c;color:#fff;border-radius:99px;padding:10px 20px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:3001}
.pv-toast.on{opacity:1}
body{padding-bottom:110px}
@media(max-width:480px){#app-root #ms-screen{padding:16px 12px !important}#app-root #ms-screen .ms-quick{grid-template-columns:repeat(2,minmax(0,1fr))}#app-root #ms-screen .ms-now{flex-wrap:wrap}#app-root #ms-screen .ms-now-go{width:100%}#app-root #ms-screen .ms-act{grid-template-columns:1fr 1fr}#app-root #ms-screen .ms-act .ms-btn:first-child{grid-column:1/-1}}
</style>
</head>
<body class="adult-theme" id="main-body">

<!-- ═══ #main-header: نفس كتلة index.html (الشعار من core/brandLogo.js) ═══ -->
<div class="header-bar" id="main-header">
    <div class="home-header-brand ham-shine-host">
        <span class="home-header-logo" data-ham-logo="full" data-ham-tone="light" data-ham-shine="1" aria-hidden="true"></span>
        <div class="home-header-text">
            <span id="header-title">🏆 رحلة إتقان القرآن</span>
            <span id="top-student-name">منصة حمٓ</span>
        </div>

  <div class="ms-tabs" role="tablist">
   <button type="button" class="ms-tab ${S.tab==='students'?'on':''}" data-tab="students">${L('t_students')}</button>
   <button type="button" class="ms-tab ${S.tab==='month'?'on':''}" data-tab="month">${L('t_month')}${n?`<span class="n">${n}</span>`:''}</button>
   <button type="button" class="ms-tab ${S.tab==='sched'?'on':''}" data-tab="sched">${L('t_sched')}</button></div>
  ${S.tab==='students'?paneStudents():S.tab==='month'?paneMonth():paneSched()}
   </div>
  </div>
  ${legend()}`;
}
function profile(){
  const s=STU[S.prof],sec={
   over:`<div class="ms-todo"><span>🛠️ ${L('p_todo')}</span><button type="button" class="ms-btn gold" data-real="${L('p_fix')}">${L('p_fix')}</button></div>
     <div class="ms-card2"><p style="margin:0"><b>${L('ov_memo')}:</b> ${L('ov_memo_v')}</p><p style="margin:6px 0 0"><b>${L('ov_par')}:</b> <span dir="ltr">${L('ov_par_v')}</span></p></div>`,
   prog:['pg_skill','pg_sim','pg_taj','pg_arch'].map(k=>`<button type="button" class="ms-row" data-real="${L(k)}" style="margin-bottom:8px"><span class="ms-nm"><b>${L(k)}</b></span>${ic.chev}</button>`).join(''),
   badge:`<div class="ms-card2"><b>${L('pb_cab')}</b><div class="ms-badges"><span>🏅 ${S.lang==='ar'?'٣ أجزاء':'3 juz'}</span><span>🌟 ${S.lang==='ar'?'الأحقاف':'Al-Ahqaf'}</span><span>📅 ${S.lang==='ar'?'حضور':'Attendance'}</span></div></div><div class="ms-card2"><b>${L('pb_sched')}</b><div class="ms-days" style="margin-top:6px">${L('days').map((x,k)=>`<i class="${[1,0,1,0,1,0,0][k]?'':'off'}">${x}</i>`).join('')}</div></div><div class="ms-card2"><b>${L('pb_dual')}</b><div class="ms-badges"><span>⚔️ 2</span></div></div>`,
   hist:`<div class="ms-card2"><table class="ms-hist"><tr><th>${L('h_date')}</th><th>${L('h_range')}</th><th>${L('h_pct')}</th></tr><tr><td>12/10</td><td>${S.lang==='ar'?'الأحقاف':'Al-Ahqaf'}</td><td>92%</td></tr><tr><td>05/10</td><td>${S.lang==='ar'?'الجاثية':'Al-Jathiyah'}</td><td>88%</td></tr></table></div>`};
  return `<div class="ms-head"><button type="button" class="ms-back" id="pback" aria-label="${L('back')}">${ic.back}</button><div class="ms-titles"><h1 class="ms-title">${esc(s.n[S.lang])}<small>${esc(s.g[S.lang])}</small></h1></div></div>
  <div class="ms-act"><button type="button" class="ms-btn gold" data-real="${L('p_eval')}">${L('p_eval')}</button><button type="button" class="ms-btn line" data-real="${L('p_edit')}">${L('p_edit')}</button><button type="button" class="ms-btn line" data-real="${L('p_rep')}">${L('p_rep')}</button></div>
  <div class="ms-stats"><div class="ms-stat"><b>340</b><small>${L('ps_pts')}</small></div><div class="ms-stat"><b>17</b><small>${L('ps_ev')}</small></div><div class="ms-stat"><b>2</b><small>${L('ps_win')}</small></div></div>
  <div class="ms-subtabs">${['over','prog','badge','hist'].map(k=>`<button type="button" class="ms-chip ${S.sub===k?'on':''}" data-sub="${k}">${L('pt_'+k)}</button>`).join('')}</div>
  <div>${sec[S.sub]}</div>
  ${legend()}`;
}
function addModal(){
  const st=S.step,tt=['a_s1','a_s2','a_s3'];
  const body=[`<div><label>${L('a_name')}</label><input type="text"></div><div><label>${L('a_gender')}</label><div class="seg"><button type="button" class="on">${L('a_boy')}</button><button type="button">${L('a_girl')}</button></div></div>`,
   `<div><label>${L('a_grade')}</label><select><option>—</option></select></div><div><label>${L('a_dob')}</label><div style="display:grid;grid-template-columns:.8fr 1.3fr 1fr;gap:6px"><select><option>—</option></select><select><option>—</option></select><select><option>—</option></select></div></div>`,
   `<div><label>${L('a_phone')}</label><input type="text" inputmode="tel"></div><div><label>${L('a_memo')}</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select><option>${S.lang==='ar'?'الناس':'An-Nas'}</option></select><select><option>—</option></select></div></div>`][st];
  document.getElementById('addBox').innerHTML=`<h2>${L('a_title')}</h2><div class="dots2">${[0,1,2].map(i=>`<i class="${i<=st?'on':''}">${i+1}</i>`).join('')}</div><p class="ms-hint" style="text-align:center;margin:0">${L(tt[st])}</p>${body}
   <div class="nav">${st?`<button type="button" class="nbtn line" data-a="prev">${L('a_prev')}</button>`:''}${st<2?`<button type="button" class="nbtn em" data-a="next">${L('a_next')}</button>`:`<button type="button" class="nbtn gold" data-a="save">${L('a_save')}</button>`}</div>
   <button type="button" class="nbtn ghost" data-a="cancel">${L('a_cancel')}</button>`;
}
function syncChrome(){
  const h=document.documentElement;h.lang=S.lang;h.dir=S.lang==='ar'?'rtl':'ltr';
  document.getElementById('header-title').textContent=L('header_title');
  document.getElementById('top-student-name').textContent=L('header_sub');
  document.getElementById('hdr-home').textContent=L('h_home');
  document.querySelectorAll('#lang-toggle-btn .lb-opt').forEach((e,i)=>e.classList.toggle('is-on',(i===0)===(S.lang==='ar')));
  document.getElementById('pvBar').innerHTML=`<div>${esc(L('pv_note'))}</div><div class="pv-sw"><button type="button" data-v="a" class="${S.v==='a'?'on':''}">${L('var_a')}</button><button type="button" data-v="b" class="${S.v==='b'?'on':''}">${L('var_b')}</button></div>`;
}
function render(){
  syncChrome();
  root.innerHTML=`<div class="screen active"><div class="login-container ${S.prof===null?'is-wide':''}" id="ms-screen">${S.prof===null?hub():profile()}</div></div>`;
  if(document.getElementById('add-modal').style.display==='flex')addModal();
  const si=document.getElementById('search');if(si&&S.keepFocus){si.focus();si.setSelectionRange(si.value.length,si.value.length);S.keepFocus=false}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,.ms-row');if(!t)return;
  if(t.dataset.v){S.v=t.dataset.v;return render()}
  if(t.id==='lang-toggle-btn'){S.lang=S.lang==='ar'?'en':'ar';return render()}
  if(t.id==='theme-toggle-btn'){window.DHTheme&&window.DHTheme.cycle();return paintTheme()}
  if(t.id==='header-home-btn'||t.id==='header-account-btn')return real(t.title);
  if(!t.closest('.ms-menu')&&S.menu!==null){S.menu=null;render()}
  if(t.dataset.tab){S.tab=t.dataset.tab;return render()}
  if(t.dataset.f){S.filter=t.dataset.f;return render()}
  if(t.dataset.sub){S.sub=t.dataset.sub;return render()}
  if(t.dataset.open!==undefined){S.prof=+t.dataset.open;S.sub='over';window.scrollTo(0,0);return render()}
  if(t.id==='pback'){S.prof=null;return render()}
  if(t.dataset.back)return real(L('back'));
  if(t.dataset.menu!==undefined){const i=+t.dataset.menu;S.menu=S.menu===i?null:i;return render()}
  if(t.dataset.real){S.menu=null;render();return real(t.dataset.real)}
  if(t.dataset.act==='tabMonth'){S.tab='month';return render()}
  if(t.dataset.act==='find'){S.tab='students';S.keepFocus=true;return render()}
  if(t.dataset.act==='add'){S.step=0;document.getElementById('add-modal').style.display='flex';return addModal()}
  if(t.dataset.a){const a=t.dataset.a;
    if(a==='next')S.step++;else if(a==='prev')S.step--;
    else{document.getElementById('add-modal').style.display='none';if(a==='save')toast(L('a_saved'));return}
    return addModal()}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){S.q=e.target.value;S.keepFocus=true;render()}});
/* أيقونة المظهر كما في core/theme.js */
const TI={auto:'<path d="M12 3a9 9 0 1 0 0 18V3z" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="9"/>',light:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',dark:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'};
function paintTheme(){const p=window.DHTheme?window.DHTheme.get():'auto';const s=document.querySelector('#theme-toggle-btn svg');if(s)s.innerHTML=TI[p]||TI.auto}
document.addEventListener('app-theme-changed',paintTheme);
paintTheme();render();
</script>
</body>
</html>
