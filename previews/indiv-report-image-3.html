<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title>صورة التقرير الفردي · Report image</title>
<!-- معاينة للنقاش فقط: ثلاثة نماذج لتحسين صورة التقرير الفردي التي تُرسل لولي الأمر (تحميل/واتساب).
     لا تمسّ أي شاشة في المنصة. البيانات تجريبية مطابقة لصورة previews/indiv-report-current.jpg -->
<link rel="stylesheet" href="css/fonts.css">
<style>
:root{
  --pg:#f3eee3; --panel:#fffdf8; --ink:#1f2a24; --soft:#6b6b63; --line:#e6dcc6; --strong:#b9a983;
  --em:#0d5c46; --em2:#147c5e; --gold:#c9a13b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--pg:#121614;--panel:#1b211e;--ink:#e9eee9;--soft:#a9b2ac;--line:#2d3632;--strong:#56635c;--em2:#5fc9a0}
}
:root[data-theme="dark"]{--pg:#121614;--panel:#1b211e;--ink:#e9eee9;--soft:#a9b2ac;--line:#2d3632;--strong:#56635c;--em2:#5fc9a0}
*{box-sizing:border-box}
body{margin:0;background:var(--pg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;line-height:1.6}
button{font-family:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:8px}
.top h1{font-size:20px;margin:0;display:flex;align-items:center;gap:10px}
.top h1 img{width:30px}
.top p{margin:2px 0 0;color:var(--soft);font-size:13px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--strong);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--em);color:#fff}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:8px 0 16px}
.tabs button{border:0;background:transparent;color:var(--soft);padding:10px 12px;font-size:15px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--em2);border-color:var(--gold)}
.tab{display:none}.tab.on{display:block}
.lay{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.lay{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.box h3{margin:0 0 6px;font-size:15px}
.box ul{margin:0;padding-inline-start:18px;font-size:14px}
.box li{margin:3px 0}
.box p{margin:0;font-size:14px}
.tag{display:inline-block;background:var(--em);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.fit{width:100%;overflow:hidden;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.fit>.img{width:720px;transform-origin:top right}
[dir="ltr"] .fit>.img{transform-origin:top left}
.cur{width:100%;border-radius:12px;display:block;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.note{font-size:12.5px;color:var(--soft);margin-top:6px}

/* ============ الصورة المصدَّرة (ألوان ثابتة دائمًا: الصورة تُرسل فاتحة) ============ */
.img{position:relative;background:#f9f4ea;color:#23302a;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:14px;line-height:1.6;overflow:hidden}
.img .orn{position:absolute;width:56px;opacity:.75;pointer-events:none}
.img .orn.tr{top:8px;right:8px}.img .orn.tl{top:8px;left:8px;transform:scaleX(-1)}
.img .orn.br{bottom:8px;right:8px;transform:scaleY(-1)}.img .orn.bl{bottom:8px;left:8px;transform:scale(-1)}
.img .amiri{font-family:'Amiri',serif}
.img .card{background:#fffdf8;border:1px solid #e6dcc6;border-radius:18px}
.img b{font-weight:700}
.img .ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---- نموذج أ ---- */
.A{padding:26px 44px 22px}
.A .head{display:grid;grid-template-columns:110px 1fr 110px;align-items:center;text-align:center}
.A .head .logo{width:78px;justify-self:start}
.A .head .art{width:130px;justify-self:end}
[dir="ltr"] .A .head .logo{justify-self:end}[dir="ltr"] .A .head .art{justify-self:start}
.A .eye{font-size:11.5px;color:#6f644e}
.A h2{margin:0;font-family:'Amiri',serif;font-size:34px;color:#0b3d30;line-height:1.2}
.A .sub{font-family:'Amiri',serif;font-size:19px;color:#3a3a30}
.A .hero{display:grid;grid-template-columns:1fr 210px;gap:14px;margin-top:16px}
.A .who{padding:16px 18px;display:flex;gap:16px;align-items:center}
.A .av{flex:none;width:76px;height:76px;border-radius:50%;border:3px solid #147c5e;box-shadow:0 0 0 5px #e7f1ec;display:flex;align-items:center;justify-content:center;font-family:'Amiri',serif;font-size:34px;color:#0d5c46;background:#fff}
.A .nm{font-size:23px;font-weight:700;color:#14231c;line-height:1.3}
.A .facts{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px}
.A .fact{background:#f4efe3;border:1px solid #e6dcc6;border-radius:999px;padding:2px 10px;font-size:12.5px;color:#4b4a40}
.A .fact b{color:#14231c}
.A .score{padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.A .ring{position:relative;width:132px;height:132px}
.A .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.A .ring .p{font-size:34px;font-weight:700;color:#8a6221;line-height:1}
.A .ring .t{margin-top:4px;background:#b8863b;color:#fff;border-radius:999px;padding:0 12px;font-size:12px;font-weight:700}
.A .delta{font-size:12px;font-weight:700;color:#9e3b2d;background:#fbecea;border:1px solid #efc9c2;border-radius:999px;padding:1px 10px}
.A .verdict{margin:14px 0 0;text-align:center;font-weight:700;font-size:15px;color:#2b2620}
.A .sec{margin-top:14px;padding:14px 18px}
.A .sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.A .sh h4{margin:0;font-size:15.5px;color:#0b3d30}
.A .sh span{font-size:12px;color:#6f644e}
.A .bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:#eee6d4}
.A .bar i{display:block}
.A .leg{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:13.5px}
.A .leg span{display:flex;align-items:center;gap:6px;font-weight:600}
.A .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.A .mini{display:flex;justify-content:center;gap:22px;margin-top:10px;padding-top:8px;border-top:1px dashed #e6dcc6;font-size:12.5px;color:#4b4a40}
.A .trend{display:flex;align-items:flex-end;justify-content:space-around;height:118px;padding:0 20px;border-bottom:1px solid #e6dcc6}
.A .col{display:flex;flex-direction:column;align-items:center;gap:4px;width:110px}
.A .col .v{font-weight:700;font-size:14px}
.A .col .b{width:46px;border-radius:8px 8px 0 0;background:#e2d4b3}
.A .col.now .b{background:#c9a13b}
.A .lbls{display:flex;justify-content:space-around;padding:6px 20px 0;font-size:12px;color:#4b4a40;text-align:center}
.A .lbls div{width:110px}
.A .lbls .now{color:#8a6221;font-weight:700}
.A .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.A .ins{padding:14px 16px;border-radius:18px}
.A .ins.good{background:#edf5f0;border:1px solid #b9d9c8}
.A .ins.focus{background:#fbf0ee;border:1px solid #ebc4bc}
.A .ins h4{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.A .ins.good h4{color:#0d5c46}.A .ins.focus h4{color:#9e3b2d}
.A .ins ul{margin:0;padding:0;list-style:none;font-size:13.5px}
.A .ins li{display:flex;gap:8px;margin:6px 0;align-items:flex-start}
.A .ref{flex:none;background:#fff;border:1px solid #ebc4bc;border-radius:8px;padding:0 7px;font-size:11.5px;font-weight:700;color:#9e3b2d;margin-top:2px}
.A .tick{flex:none;color:#147c5e;font-weight:700}
.A .tnote{margin-top:14px;padding:14px 20px;border-top:4px solid #c9a13b}
.A .tnote h4{margin:0 0 4px;font-size:14.5px;color:#0b3d30}
.A .tnote p{margin:0;font-family:'Amiri',serif;font-size:17.5px;line-height:1.9;text-align:center;color:#2b2620}
.A .foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:16px;padding:12px 6px 0;border-top:1px solid #e6dcc6;font-size:12px;color:#4b4a40}
.A .foot img{width:22px;vertical-align:middle}
.A .sign{text-align:center;min-width:160px}
.A .sign .n{font-family:'Amiri',serif;font-size:18px;font-weight:700;color:#0b3d30;border-top:1px solid #b9a983;padding-top:4px}

/* ---- نموذج ب ---- */
.B{padding:22px 40px 20px}
.B .head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 30px 12px;border-bottom:1px solid #e6dcc6}
.B .head .brand{display:flex;align-items:center;gap:10px}
.B .head .brand img{width:46px}
.B .head .brand div{font-size:12px;color:#6f644e;line-height:1.3}
.B .head .brand b{display:block;font-family:'Amiri',serif;font-size:22px;color:#0b3d30}
.B .head .date{font-size:12px;color:#6f644e;text-align:end}
.B .hero{margin-top:16px;border-radius:22px;background:linear-gradient(135deg,#0d5c46,#0b3d30);color:#fff;padding:20px 24px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;position:relative;overflow:hidden}
.B .hero:after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;border:30px solid rgba(201,161,59,.16)}
[dir="ltr"] .B .hero:after{inset:auto auto -60px -40px}
.B .hero .hi{font-size:13px;opacity:.85}
.B .hero .nm{font-family:'Amiri',serif;font-size:30px;font-weight:700;line-height:1.25}
.B .hero .v{margin-top:6px;font-size:15px;line-height:1.7;max-width:420px}
.B .hero .sc{position:relative;z-index:1;text-align:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:18px;padding:10px 18px}
.B .hero .sc .p{font-size:40px;font-weight:700;color:#f2d684;line-height:1.1}
.B .hero .sc .t{font-size:13px;font-weight:700}
.B .hero .sc .d{font-size:11.5px;opacity:.85;margin-top:2px}
.B .meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.B .meta span{background:#fffdf8;border:1px solid #e6dcc6;border-radius:999px;padding:2px 12px;font-size:12.5px;color:#4b4a40}
.B .step{margin-top:14px;padding:14px 18px 14px;display:grid;grid-template-columns:40px 1fr;gap:12px}
.B .num{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff}
.B .s1 .num{background:#147c5e}.B .s2 .num{background:#b8863b}.B .s3 .num{background:#0b3d30}
.B .step h4{margin:2px 0 6px;font-size:16.5px;color:#14231c}
.B .step ul{margin:0;padding:0;list-style:none}
.B .step li{margin:5px 0;font-size:14px;display:flex;gap:8px}
.B .step li:before{content:"•";color:#b9a983;font-weight:700}
.B .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.B .chips span{border-radius:10px;padding:3px 10px;font-size:13px;font-weight:700}
.B .ok{background:#e4f2ea;color:#0d5c46}.B .pa{background:#f8eedb;color:#8a6221}.B .no{background:#f8e3df;color:#9e3b2d}
.B .ayah{display:flex;flex-direction:column;gap:6px}
.B .ayah div{background:#fbf5ea;border:1px solid #ecdcbf;border-radius:12px;padding:6px 12px;font-size:13.5px}
.B .ayah b{color:#8a6221}
.B .s3{background:#fff8e8;border-color:#e8d29c}
.B .s3 li:before{content:"☐";color:#8a6221}
.B .tr{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 18px;font-size:13px;color:#4b4a40}
.B .tr .lbl{font-weight:700;color:#0b3d30;white-space:nowrap}
.B .tr .pts{flex:1;display:flex;align-items:center;justify-content:space-between;position:relative}
.B .tr .pts:before{content:"";position:absolute;inset:50% 8% auto 8%;border-top:2px dashed #d9c9a4}
.B .tr .pt{position:relative;background:#fffdf8;padding:0 6px;text-align:center;line-height:1.3}
.B .tr .pt b{display:block;font-size:15px}
.B .tr .pt.now b{color:#8a6221}
.B .tnote{margin-top:14px;padding:12px 20px;display:flex;gap:14px;align-items:flex-start}
.B .tnote .q{font-family:'Amiri',serif;font-size:54px;line-height:.8;color:#c9a13b}
.B .tnote p{margin:0;font-family:'Amiri',serif;font-size:17px;line-height:1.85;color:#2b2620}
.B .tnote .by{margin-top:4px;font-size:12.5px;font-weight:700;color:#0b3d30}
.B .foot{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:14px;font-size:11.5px;color:#6f644e}
.B .foot img{width:18px}

/* ---- نموذج ج (4:5) ---- */
.C{height:900px;padding:24px 40px 22px;display:flex;flex-direction:column;justify-content:space-between}
.C .head{text-align:center;position:relative}
.C .head img.logo{width:58px;position:absolute;top:0;right:24px}
[dir="ltr"] .C .head img.logo{right:auto;left:24px}
.C .head .eye{font-size:11.5px;color:#6f644e}
.C .head h2{margin:0;font-family:'Amiri',serif;font-size:30px;color:#0b3d30;line-height:1.2}
.C .head .s{font-family:'Amiri',serif;font-size:16px;color:#3a3a30}
.C .main{padding:18px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.C .ring{position:relative;width:170px;height:170px}
.C .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.C .ring .p{font-size:44px;font-weight:700;color:#8a6221;line-height:1}
.C .ring .t{margin-top:6px;background:#b8863b;color:#fff;border-radius:999px;padding:0 14px;font-size:13px;font-weight:700}
.C .nm{font-family:'Amiri',serif;font-size:30px;font-weight:700;color:#14231c;line-height:1.2}
.C .ln{font-size:13.5px;color:#4b4a40;margin-top:4px}
.C .ln b{color:#14231c}
.C .cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.C .cnt div{border-radius:12px;padding:6px 4px;text-align:center;font-size:12px;font-weight:600}
.C .cnt b{display:block;font-size:22px;line-height:1.2}
.C .ok{background:#e4f2ea;color:#0d5c46}.C .pa{background:#f8eedb;color:#8a6221}.C .no{background:#f8e3df;color:#9e3b2d}
.C .trend{display:flex;justify-content:center;gap:6px;margin-top:10px;font-size:12px;color:#4b4a40;align-items:center}
.C .trend span.n{font-weight:700;color:#8a6221}
.C .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.C .pill{border-radius:16px;padding:12px 14px}
.C .pill h4{margin:0 0 4px;font-size:14px}
.C .pill p{margin:0;font-size:13.5px;line-height:1.7}
.C .pill.g{background:#edf5f0;border:1px solid #b9d9c8}.C .pill.g h4{color:#0d5c46}
.C .pill.f{background:#fbf0ee;border:1px solid #ebc4bc}.C .pill.f h4{color:#9e3b2d}
.C .tnote{padding:14px 18px;border-top:4px solid #c9a13b}
.C .home{display:flex;gap:12px;align-items:center;background:#fff8e8;border:1px solid #e8d29c;border-radius:16px;padding:12px 16px;font-size:14px}
.C .home b{color:#8a6221;white-space:nowrap}
.C .head img.art{width:104px;position:absolute;top:0;left:18px}
[dir="ltr"] .C .head img.art{left:auto;right:18px}
.C .tnote h4{margin:0 0 4px;font-size:14px;color:#0b3d30}
.C .tnote p{margin:0;font-family:'Amiri',serif;font-size:17px;line-height:1.85;text-align:center;color:#2b2620}
.C .foot{display:flex;justify-content:space-between;align-items:center;padding:0 40px;font-size:11.5px;color:#6f644e}
.C .foot .t{font-family:'Amiri',serif;font-size:16px;font-weight:700;color:#0b3d30}

/* ---- محاكاة واتساب ---- */
.wa{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.phone{width:220px;background:#e5ddd5;border-radius:22px;padding:10px;border:6px solid #222}
.phone .bub{background:#d9fdd3;border-radius:10px;padding:4px;margin-inline-start:auto;width:180px}
.phone .bub .frame{height:220px;overflow:hidden;border-radius:7px;position:relative}
.phone .bub .frame .fit{border-radius:0;box-shadow:none}
.phone .bub .t{font-size:10px;color:#667;text-align:end;padding:2px 4px 0}
.phone .cap{font-size:11.5px;text-align:center;color:#333;margin-top:6px;font-weight:600}
.phone .frame.crop:after{content:"";position:absolute;inset:auto 0 0 0;height:40px;background:linear-gradient(transparent,rgba(0,0,0,.35))}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1><img src="assets/brand/ham-logo.svg" alt=""><span data-t="title"></span></h1>
      <p data-t="subtitle"></p>
    </div>
    <div class="ctrls">
      <div class="seg" id="seg-lang"><button data-v="ar" class="on">العربية</button><button data-v="en">English</button></div>
      <div class="seg" id="seg-theme"><button data-v="light" class="on" data-t="light"></button><button data-v="dark" data-t="dark"></button></div>
    </div>
  </div>

  <div class="tabs">
    <button data-tab="a" class="on" data-t="tabA"></button>
    <button data-tab="b" data-t="tabB"></button>
    <button data-tab="c" data-t="tabC"></button>
    <button data-tab="cur" data-t="tabCur"></button>
  </div>

  <section class="tab on" id="a">
    <div class="lay">
      <div class="fit"><div class="img A" id="imgA"></div></div>
      <div class="side" id="sideA"></div>
    </div>
  </section>
  <section class="tab" id="b">
    <div class="lay">
      <div class="fit"><div class="img B" id="imgB"></div></div>
      <div class="side" id="sideB"></div>
    </div>
  </section>
  <section class="tab" id="c">
    <div class="lay">
      <div class="fit"><div class="img C" id="imgC"></div></div>
      <div class="side" id="sideC"></div>
    </div>
  </section>
  <section class="tab" id="cur">
    <div class="lay">
      <img class="cur" src="previews/indiv-report-current.jpg" alt="">
      <div class="side" id="sideCur"></div>
    </div>
  </section>
</div>

<script>
const ART = 'assets/report/';
const D = { pct:70, prev:71, older:62, full:4, part:2, wrong:2, total:8 };
const T = {
  ar:{
    title:'صورة التقرير الفردي لولي الأمر — 3 نماذج تحسين',
    subtitle:'الصورة التي تُحمَّل أو تُرسل بواتساب. البيانات تجريبية ومطابقة للصورة الحالية حتى تكون المقارنة عادلة.',
    light:'فاتح', dark:'داكن',
    tabA:'أ · نفس الورقة بوضوح أكبر', tabB:'ب · ولي الأمر أولًا', tabC:'ج · مقاس واتساب 4:5', tabCur:'الصورة الحالية',
    eye:'منصة حمٓ · تحفيظ القرآن الكريم', title2:'تقرير تقدّم الطالب', sub:'في حفظ القرآن الكريم',
    name:'يوسف أحمد', grade:'الصف', gradeV:'الرابع', scope:'النطاق', scopeV:'سورة الملك', dur:'المدة', durV:'2 د 56 ث', date:'التاريخ', dateV:'5 نوفمبر 2026 · 25 جمادى الأولى 1448هـ',

function fitAll(){
  document.querySelectorAll('.fit').forEach(f => {
    const img = f.firstElementChild; if (!img) return;
    const w = f.dataset.w ? +f.dataset.w : f.clientWidth; if (!w) return;
    const s = Math.min(1, w/720);
    img.style.transform = `scale(${s})`;
    f.style.height = (img.offsetHeight*s)+'px';
  });
}

  sideA.innerHTML = side(t.ideaA, t.fixA, t.askA) + pick;
  sideB.innerHTML = side(t.ideaB, t.fixB, t.askB) + pick;
  sideC.innerHTML = side(t.ideaC, t.fixC, t.askC) + waDemo() + pick;
  sideCur.innerHTML = `<div class="box"><p>${t.curIdea}</p></div><div class="box"><h3>${t.curIssT}</h3><ul>${t.curIssues.map(x=>`<li>${x}</li>`).join('')}</ul></div>` + pick;
  document.querySelectorAll('#sideC .img').forEach(el => el.setAttribute('dir', document.documentElement.dir));
  requestAnimationFrame(fitAll);
}

document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x===b));
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('on', s.id===b.dataset.tab));
  history.replaceState(null,'','#'+b.dataset.tab); requestAnimationFrame(fitAll);
}));
document.querySelectorAll('#seg-lang button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#seg-lang button').forEach(x => x.classList.toggle('on', x===b)); lang = b.dataset.v; render();
}));
document.querySelectorAll('#seg-theme button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#seg-theme button').forEach(x => x.classList.toggle('on', x===b)); document.documentElement.dataset.theme = b.dataset.v;
}));
window.addEventListener('resize', fitAll);
window.addEventListener('load', fitAll);
if (document.fonts) document.fonts.ready.then(fitAll);
render();
const h = (location.hash||'').slice(1); if (h) { const b = document.querySelector(`.tabs button[data-tab="${h}"]`); if (b) b.click(); }
</script>
</body>
</html>
