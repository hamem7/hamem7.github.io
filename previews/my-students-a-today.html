<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="../core/themeInit.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معاينة A — «طلابي»: لوحة اليوم</title>
<!-- نفس ملفات تنسيق المنصة وبنفس الترتيب (index.html) + كتلة #main-header كما هي -->
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/adults.css">
<link rel="stylesheet" href="../css/home.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/theme-dark-auto.css">
<link rel="stylesheet" href="../css/theme-dark.css">
<link rel="stylesheet" href="my-students-shared.css">
<link rel="icon" type="image/svg+xml" href="../icons/favicon.svg">
<style>
/* ===== النموذج A — لوحة اليوم ===== */
#msx .a-jump{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:6px;margin:0 -4px var(--gap);
  background:color-mix(in srgb,var(--dh-surface-1) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--dh-border);border-radius:18px;box-shadow:var(--dh-sh-soft)}
#msx .a-jump button{display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;color:var(--dh-ink);border-radius:13px;min-height:44px;padding:6px 8px;font-weight:700;font-size:.9rem}
#msx .a-jump button.on{background:var(--dh-emerald-700);color:var(--dh-on-emerald)}
#msx .a-jump .n{font-style:normal;font-size:.72rem;font-weight:800;min-width:20px;height:20px;padding:0 6px;border-radius:99px;display:grid;place-items:center;background:var(--dh-gold-500);color:var(--dh-on-gold)}
#msx .a-jump .n.ok{background:var(--dh-ok-bg);color:var(--dh-ok-ink)}
#msx .a-jump .n.mute{background:var(--dh-surface-0);color:var(--dh-ink-soft)}
#msx .a-grid{display:flex;flex-direction:column;gap:var(--gap)}
#msx .a-col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
#msx .zone{background:var(--dh-surface-2);border:1px solid var(--dh-border);border-radius:22px;padding:14px;box-shadow:var(--dh-sh-soft);display:flex;flex-direction:column;gap:10px;scroll-margin-top:140px}
#msx .zone-h{display:flex;align-items:flex-start;gap:10px}
#msx .zone-h>div{flex:1;min-width:0}
#msx .zone-h h2{font-size:1.12rem !important;font-weight:800 !important}
#msx .zone-h p{margin:2px 0 0;font-size:.82rem;color:var(--dh-ink-soft);line-height:1.5}
#msx .zi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--dh-ok-bg);color:var(--dh-emerald-700)}
#msx .zi.gold{background:var(--dh-warn-bg);color:var(--dh-gold-ink)}
#msx .zc{font-weight:800;font-size:.85rem;background:var(--dh-surface-0);border:1px solid var(--dh-border-soft);border-radius:99px;padding:3px 10px;white-space:nowrap}
#msx .a-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--dh-surface-3);border:1.5px solid var(--dh-border-soft);border-radius:16px;padding:8px 10px;transition:background .4s}
#msx .a-row.col{flex-direction:column;align-items:stretch}
#msx .a-row.col .who,#msx .b-card.col .who{flex:none}
#msx .a-row.flash{background:var(--dh-ok-bg)}
#msx .a-row .who{border:0;background:none;color:inherit;padding:0;text-align:start;flex:1 1 150px}
#msx .a-row .att{display:flex;gap:6px;margin-inline-start:auto}
#msx .ava.sm{width:34px;height:34px;font-size:1.05rem}
#msx .msx-ic.tiny{width:13px;height:13px;vertical-align:-2px}
#msx .step{border:1.5px solid var(--dh-border-soft);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--dh-surface-1)}
#msx .step.cur{border-color:var(--dh-gold-500);box-shadow:0 0 0 3px color-mix(in srgb,var(--dh-gold-500) 18%,transparent)}
#msx .step.fin{opacity:.85}
#msx .step-h{display:flex;align-items:center;gap:10px}
#msx .step-h>div{flex:1;min-width:0}
#msx .step-h h3{font-size:1rem !important;font-weight:800 !important}
#msx .step-h small{color:var(--dh-ink-soft);font-size:.8rem}
#msx .step .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--dh-emerald-700);color:var(--dh-on-emerald);flex:none}
#msx .step.fin .no{background:var(--dh-ok-bg);color:var(--dh-ok-ink)}
#msx .done-line,#msx .locked{display:flex;align-items:center;gap:6px;margin:0;font-size:.82rem;color:var(--dh-ok-ink);font-weight:600}
#msx .locked{color:var(--dh-ink-soft)}
#msx .done-line svg,#msx .locked svg{width:16px;height:16px}
#msx .wide{width:100%;min-height:46px}
#msx .a-list{display:flex;flex-direction:column;gap:8px}
#msx .a-row.st .who{flex:1}
#msx .st-act{display:flex;gap:6px;align-items:center}
[dir="rtl"] #msx .st-act .icon-b svg{transform:scaleX(-1)}
@media(max-width:420px){#msx .a-jump button{flex-direction:column;gap:2px;font-size:.78rem}#msx .a-row.st{flex-wrap:nowrap}#msx .a-row.st .icon-b{display:none}}
@media(min-width:960px){
  #msx{max-width:1180px;padding:0 24px 24px}
  #msx .a-jump{max-width:560px}
  #msx .a-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
}
</style>
</head>
<body class="adult-theme" id="main-body">

<!-- ═══ #main-header: نفس كتلة index.html (الشعار من core/brandLogo.js) ═══ -->
<div class="header-bar" id="main-header">
    <div class="home-header-brand ham-shine-host">
        <span class="home-header-logo" data-ham-logo="full" data-ham-tone="light" data-ham-shine="1" aria-hidden="true"></span>
        <div class="home-header-text">
            <span id="header-title">🏆 رحلة إتقان القرآن</span>
            <span id="top-student-name">منصة حمٓ</span>
        </div>
    </div>
    <div class="header-actions">
        <button id="header-home-btn" class="header-home-btn" title="الرئيسية">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M6.5 10v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="hdr-home">الرئيسية</span>
        </button>
        <div class="header-account-wrap" id="header-account-wrap">
            <button id="header-account-btn" class="header-account-btn" type="button" title="حسابي والنسخ الاحتياطي" aria-label="حسابي">
                <span class="ha-ic" id="header-account-ic">👤</span><span class="ha-dot" id="header-account-dot" data-level="ok"></span>
            </button>
        </div>
        <button id="theme-toggle-btn" class="theme-btn" type="button" title="المظهر" aria-label="المظهر">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
        </button>
        <button id="lang-toggle-btn" class="lang-btn" type="button" title="English"><span class="lb-opt is-on">AR</span><span class="lb-sep" aria-hidden="true">|</span><span class="lb-opt">EN</span></button>
    </div>
</div>

<div id="app-root"></div>

<div class="msx-sheet-bg" id="sheetBg" hidden></div>
<div class="pv-notes" id="pvNotes" hidden></div>
<div class="pv-toast" id="toast"></div>
<div class="pv-bar" id="pvBar"></div>

<script src="../core/brandLogo.js"></script>
<script>window.MSX_VARIANT = 'a';</script>
<script src="my-students-shared.js"></script>
</body>
</html>
