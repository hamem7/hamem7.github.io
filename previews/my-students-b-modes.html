<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="../core/themeInit.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معاينة B — «طلابي»: قائمة واحدة بأوضاع</title>
<!-- نفس ملفات تنسيق المنصة وبنفس الترتيب (index.html) + كتلة #main-header كما هي -->
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/adults.css">
<link rel="stylesheet" href="../css/home.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/theme-dark-auto.css">
<link rel="stylesheet" href="../css/theme-dark.css">
<link rel="stylesheet" href="my-students-shared.css">
<link rel="icon" type="image/svg+xml" href="../icons/favicon.svg">
<style>
/* ===== النموذج B — قائمة واحدة بأوضاع ===== */
#msx .b-modes{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:5px;border-radius:20px;margin-bottom:10px;
  background:linear-gradient(145deg,var(--dh-emerald-700),var(--dh-emerald-900));box-shadow:var(--dh-sh-lift)}
#msx .b-modes button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:color-mix(in srgb,#fff 82%,transparent);border-radius:15px;padding:8px 4px 7px;font-weight:700;font-size:.8rem;min-height:58px;position:relative}
#msx .b-modes button.on{background:var(--dh-surface-1);color:var(--dh-emerald-700)}
[data-theme="dark"] #msx .b-modes button.on{color:var(--dh-gold-300)}
#msx .b-modes .mi{position:relative;display:grid;place-items:center}
#msx .b-modes .mi svg{width:22px;height:22px}
#msx .b-modes .mi em{position:absolute;top:-7px;inset-inline-end:-13px;font-style:normal;font-size:.68rem;font-weight:800;min-width:18px;height:18px;padding:0 5px;border-radius:99px;display:grid;place-items:center;background:var(--dh-gold-500);color:var(--dh-on-gold);box-shadow:0 0 0 2px var(--dh-emerald-800)}
#msx .b-modes .ml{line-height:1.2;text-align:center}
#msx .b-guide{background:var(--dh-surface-2);border:1px solid var(--dh-border);border-radius:16px;padding:10px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
#msx .b-guide p{margin:0;font-size:.88rem;font-weight:600;line-height:1.55}
#msx .b-prog{display:flex;align-items:center;gap:10px}
#msx .b-prog .bar{flex:1}
#msx .b-prog b{font-size:.82rem;white-space:nowrap}
#msx .search{margin-bottom:10px}
#msx .b-list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
#msx .b-card{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--dh-surface-3);border:1.5px solid var(--dh-border);border-radius:18px;padding:10px 12px;transition:background .4s}
#msx .b-card.col{flex-direction:column;align-items:stretch}
#msx .b-card.col .who{flex:none}
#msx .b-card.flash{background:var(--dh-ok-bg)}
#msx .b-card .who{border:0;background:none;color:inherit;padding:0;text-align:start;flex:1 1 150px}
#msx .b-card.row .who{flex:1}
#msx .b-card.done{background:var(--dh-surface-2);border-style:dashed}
#msx .b-card.off{opacity:.62}
#msx .b-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-inline-start:auto}
#msx .b-card.col .b-tools{margin:0}
#msx .b-card.col .b-tools .pos{width:100%}
[dir="rtl"] #msx .b-tools .icon-b svg{transform:scaleX(-1)}
#msx .grp{margin:16px 2px 8px;font-size:.86rem;color:var(--dh-ink-soft);font-weight:800}
#msx .grp.ok{color:var(--dh-ok-ink)}
#msx .b-next{width:100%;display:flex;align-items:center;gap:10px;border:0;border-radius:16px;padding:12px 14px;margin-bottom:10px;font-weight:800;font-size:.95rem;
  background:linear-gradient(135deg,var(--dh-gold-300),var(--dh-gold-500));color:var(--dh-on-gold);text-align:start}
#msx .b-next span{flex:1}
[dir="rtl"] #msx .b-next svg:last-child{transform:scaleX(-1)}
#msx .wide{width:100%;min-height:46px;margin-bottom:10px}
@media(max-width:420px){#msx .b-card.row{flex-wrap:nowrap}#msx .b-card.row .icon-b{display:none}}
@media(min-width:960px){
  #msx{max-width:1100px;padding:0 24px 24px}
  #msx .b-modes{max-width:640px;margin-inline:auto}
  #msx .b-guide,#msx .search{max-width:640px;margin-inline:auto}
  #msx .b-list{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body class="adult-theme" id="main-body">

<!-- ═══ #main-header: نفس كتلة index.html (الشعار من core/brandLogo.js) ═══ -->
<div class="header-bar" id="main-header">
    <div class="home-header-brand ham-shine-host">
        <span class="home-header-logo" data-ham-logo="full" data-ham-tone="light" data-ham-shine="1" aria-hidden="true"></span>
        <div class="home-header-text">
            <span id="header-title">🏆 رحلة إتقان القرآن</span>
            <span id="top-student-name">منصة حمٓ</span>
        </div>
    </div>
    <div class="header-actions">
        <button id="header-home-btn" class="header-home-btn" title="الرئيسية">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M6.5 10v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="hdr-home">الرئيسية</span>
        </button>
        <div class="header-account-wrap" id="header-account-wrap">
            <button id="header-account-btn" class="header-account-btn" type="button" title="حسابي والنسخ الاحتياطي" aria-label="حسابي">
                <span class="ha-ic" id="header-account-ic">👤</span><span class="ha-dot" id="header-account-dot" data-level="ok"></span>
            </button>
        </div>
        <button id="theme-toggle-btn" class="theme-btn" type="button" title="المظهر" aria-label="المظهر">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
        </button>
        <button id="lang-toggle-btn" class="lang-btn" type="button" title="English"><span class="lb-opt is-on">AR</span><span class="lb-sep" aria-hidden="true">|</span><span class="lb-opt">EN</span></button>
    </div>
</div>

<div id="app-root"></div>

<div class="msx-sheet-bg" id="sheetBg" hidden></div>
<div class="pv-notes" id="pvNotes" hidden></div>
<div class="pv-toast" id="toast"></div>
<div class="pv-bar" id="pvBar"></div>

<script src="../core/brandLogo.js"></script>
<script>window.MSX_VARIANT = 'b';</script>
<script src="my-students-shared.js"></script>
</body>
</html>
