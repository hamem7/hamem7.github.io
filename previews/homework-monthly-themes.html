<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معاينة — ثيمات الواجب الشهرية (هجري)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
/* معاينة للمراجعة فقط — لا تمس المنصة. الخط القرآني Amiri Quran كما في css/global.css ولا يُغيَّر في أي ثيمة. */
:root { --pbg:#f4f3ee; --pink:#10241c; --pink2:#4a6058; --pcard:#fff; --pline:#ddd9c8; }
html[data-pm="dark"] { --pbg:#0b1411; --pink:#e8efe9; --pink2:#a8bbb1; --pcard:#14211c; --pline:#2a3b34; }
* { box-sizing:border-box; margin:0; padding:0; font-family:'IBM Plex Sans Arabic', system-ui, sans-serif; }
body { background:var(--pbg); color:var(--pink); line-height:1.6; }
.quran-text { font-family:'Amiri Quran', serif; }
.wrap { max-width:1240px; margin:0 auto; padding:0 16px; }
.bar { position:sticky; top:0; z-index:50; background:var(--pcard); border-bottom:1px solid var(--pline); }
.bar .wrap { display:flex; align-items:center; gap:10px; padding-block:10px; flex-wrap:wrap; }
.bar h1 { font-size:1.05rem; flex:1; min-width:200px; }
.pb { min-height:40px; padding:6px 14px; border-radius:12px; border:1px solid var(--pline); background:var(--pbg); color:var(--pink); font-weight:700; cursor:pointer; }
.intro { margin:18px 0; padding:16px 18px; background:var(--pcard); border:1px solid var(--pline); border-radius:16px; }
.intro p { color:var(--pink2); margin-top:4px; }
.now { display:inline-block; margin-top:8px; padding:4px 12px; border-radius:99px; background:var(--pbg); border:1px solid var(--pline); font-weight:700; }
.nav { display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:8px; margin-bottom:22px; }
.nav a { display:flex; align-items:center; gap:6px; padding:8px 10px; border-radius:12px; text-decoration:none; font-weight:700; font-size:.9rem; color:var(--pink); background:var(--pcard); border:1px solid var(--pline); }
.nav a i { width:14px; height:14px; border-radius:50%; flex:none; }
.nav a.cur { outline:3px solid #d4af37; }
.theme { margin-bottom:34px; padding:16px; border-radius:22px; background:var(--bg); border:1px solid var(--line); color:var(--ink); }
.th-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
.th-num { width:44px; height:44px; border-radius:14px; display:grid; place-items:center; background:var(--accent); color:var(--onAccent); font-weight:700; font-size:1.2rem; }
.th-head h2 { font-size:1.35rem; }
.th-head p { color:var(--ink2); font-size:.95rem; flex-basis:100%; }
.cur-tag { background:var(--hi); color:var(--onHi); border-radius:99px; padding:2px 12px; font-size:.8rem; font-weight:700; }
.swatches { display:flex; gap:6px; margin-inline-start:auto; }
.swatches b { width:24px; height:24px; border-radius:8px; border:1px solid var(--line); }
.frames { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:14px; }
.fcap { font-size:.82rem; font-weight:700; color:var(--ink2); margin-bottom:6px; }
.scr { border-radius:20px; padding:14px; min-height:470px; background-color:var(--bg); border:1px solid var(--line); position:relative; overflow:hidden; }
.pat-dots { background-image:radial-gradient(color-mix(in srgb,var(--accent) 16%,transparent) 1.5px,transparent 1.6px); background-size:18px 18px; }
.pat-diamond { background-image:repeating-linear-gradient(45deg,color-mix(in srgb,var(--accent) 12%,transparent) 0 1px,transparent 1px 16px),repeating-linear-gradient(-45deg,color-mix(in srgb,var(--accent) 12%,transparent) 0 1px,transparent 1px 16px); }
.pat-stripes { background-image:repeating-linear-gradient(90deg,color-mix(in srgb,var(--accent) 11%,transparent) 0 2px,transparent 2px 22px); }
.pat-waves { background-image:radial-gradient(circle at 50% 100%,transparent 0 10px,color-mix(in srgb,var(--accent) 16%,transparent) 10px 11px,transparent 11px); background-size:28px 14px; }
.pat-grid { background-image:linear-gradient(color-mix(in srgb,var(--accent) 10%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--accent) 10%,transparent) 1px,transparent 1px); background-size:22px 22px; }
.pat-spark { background-image:radial-gradient(circle at 20% 30%,color-mix(in srgb,var(--hi) 55%,transparent) 0 2px,transparent 3px),radial-gradient(circle at 70% 70%,color-mix(in srgb,var(--accent) 30%,transparent) 0 1.5px,transparent 2.5px); background-size:56px 56px; }
.card { position:relative; background:var(--surface); border-radius:22px; border-top:6px solid var(--hi); padding:18px 14px; box-shadow:0 12px 28px rgba(0,0,0,.12); text-align:center; }
.card .corner { position:absolute; top:8px; font-size:1.1rem; color:var(--hi); }
.card .corner.l { inset-inline-start:12px; } .card .corner.r { inset-inline-end:12px; }
.logo { width:54px; height:54px; border-radius:16px; margin:0 auto 6px; display:grid; place-items:center; background:var(--accent); color:var(--onAccent); font-size:1.5rem; font-weight:700; }
.badge { display:inline-block; padding:3px 12px; border-radius:99px; background:var(--chip); color:var(--accent); font-weight:700; font-size:.85rem; margin-bottom:6px; }
.card h3 { color:var(--accent); font-size:1.35rem; line-height:1.5; margin:2px 0 4px; }
.card .sub { color:var(--ink2); font-size:.95rem; margin-bottom:10px; }
.teacher { display:inline-flex; gap:6px; padding:5px 14px; border-radius:99px; background:var(--chip); font-size:.85rem; margin-bottom:10px; }
.afr { margin:6px 0 10px; padding:12px 8px; border-radius:16px; background:var(--frame); border:2px solid var(--frameLine); box-shadow:inset 0 0 0 4px var(--frame), inset 0 0 0 5px var(--frameLine); }
.afr h4 { font-size:1.12rem; line-height:1.7; color:var(--accent); }
.chips { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:12px; }
.chip { background:var(--chip); border-radius:99px; padding:3px 11px; font-size:.82rem; color:var(--ink); }
.btn { width:100%; min-height:48px; border-radius:14px; border:0; font-weight:700; font-size:1.1rem; background:var(--hi); color:var(--onHi); box-shadow:0 6px 14px color-mix(in srgb,var(--hi) 35%,transparent); }
.btn2 { margin-top:8px; background:none; border:0; color:var(--ink2); text-decoration:underline; font-size:.9rem; }
/* شاشة الحل */
.pcard { background:var(--surface); border-radius:18px; padding:12px 14px; margin-bottom:10px; box-shadow:0 8px 20px rgba(0,0,0,.10); }
.eyebrow { display:flex; justify-content:space-between; align-items:center; font-weight:700; color:var(--accent); font-size:.9rem; margin-bottom:8px; }
.segs { display:flex; gap:4px; } .segs i { flex:1; height:9px; border-radius:99px; background:var(--line); } .segs i.on { background:linear-gradient(90deg,var(--accent),var(--hi)); }
.cnt { font-size:.85rem; color:var(--ink2); margin-top:4px; }
.qcard { border-top:5px solid var(--hi); }
.qtype { display:inline-block; font-size:.75rem; font-weight:700; background:var(--chip); color:var(--accent); padding:2px 10px; border-radius:99px; }
.qtitle { font-size:1.05rem; margin:6px 0 8px; }
.mushaf { position:relative; text-align:center; border-radius:16px; padding:18px 10px 10px; margin:12px 0 10px; background:var(--frame); border:2px solid var(--frameLine); box-shadow:inset 0 0 0 4px var(--frame), inset 0 0 0 5px var(--frameLine); }
.mushaf::before { content:attr(data-g); position:absolute; top:-13px; left:50%; transform:translateX(-50%); background:var(--surface); color:var(--hi); font-size:1.3rem; padding:0 8px; line-height:1; }
.ayah { font-size:1.55rem; line-height:2.1; color:var(--ink); }
.opt { display:flex; align-items:center; gap:10px; min-height:48px; padding:6px 10px; margin-bottom:7px; border:2px solid var(--line); border-radius:14px; background:var(--surface); }
.opt .lt { width:30px; height:30px; border-radius:10px; background:var(--chip); color:var(--accent); display:grid; place-items:center; font-weight:700; flex:none; }
.opt .ot { flex:1; font-size:1.3rem; }
.opt.sel { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,var(--surface)); } .opt.sel .lt { background:var(--accent); color:var(--onAccent); }
.opt.sel::after { content:"✓"; color:var(--accent); font-weight:700; }
.nav2 { display:flex; gap:8px; margin-top:6px; } .nav2 .btn { min-height:44px; font-size:1rem; } .nav2 .btn.g { background:var(--chip); color:var(--accent); box-shadow:none; flex:.6; }
.enc { margin:8px auto 0; width:fit-content; max-width:100%; padding:6px 14px; border-radius:99px; background:var(--accent); color:var(--onAccent); font-weight:700; font-size:.88rem; }
/* الإنجاز */
.done { text-align:center; padding-top:24px; }
.fall { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.fall span { position:absolute; top:-20px; font-size:1.3rem; animation:fall 4s linear infinite; }
@keyframes fall { to { transform:translateY(560px) rotate(200deg); } }
.big { font-size:3.2rem; line-height:1.1; }
.medal { margin:12px auto; width:150px; height:150px; border-radius:50%; display:grid; place-items:center; align-content:center; background:radial-gradient(circle at 35% 30%,var(--hi),color-mix(in srgb,var(--hi) 60%,var(--accent))); color:var(--onHi); box-shadow:0 10px 24px rgba(0,0,0,.25), inset 0 0 0 6px rgba(255,255,255,.35); }
.medal b { font-size:2.4rem; line-height:1; } .medal small { font-weight:700; font-size:.82rem; padding:0 10px; }
.score { font-size:1.6rem; font-weight:700; color:var(--accent); }
.encs { margin-top:10px; display:grid; gap:6px; }
.encs div { background:var(--chip); border-radius:12px; padding:6px 10px; font-size:.88rem; }
@media (prefers-reduced-motion: reduce) { .fall span { animation:none; top:20px; } }
</style>
</head>
