<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معاينة (ج) — شهادة على قالب جاهز</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d2b23;min-height:100vh;display:grid;place-items:center;padding:16px;font-family:'Reem Kufi','Cairo',sans-serif}
/* container query units: كل المقاسات نسبة لعرض الشهادة فتبقى المواضع ثابتة في أي حجم */
.cert{width:100%;max-width:600px;aspect-ratio:1200/1490;position:relative;container-type:inline-size;
  background:url(../assets/certificates/template-emerald.jpg) center/100% 100% no-repeat;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.c{position:absolute;inset:0;padding:9.5cqw 15cqw 0;text-align:center;color:#10241c}
.brand{display:flex;align-items:center;justify-content:center;gap:2cqw;color:#7a5d10;font-size:2.6cqw;letter-spacing:.3cqw}
h1{font-size:7.4cqw;color:#06352a;line-height:1.3;font-weight:700;margin-top:1cqw}
.orn{display:flex;align-items:center;gap:2cqw;justify-content:center;color:#b8921f;margin:.4cqw 0 2cqw;font-size:2.6cqw}
.orn i{height:1px;width:16cqw;background:linear-gradient(90deg,transparent,#b8921f)}.orn i:last-child{transform:scaleX(-1)}
.who{display:flex;align-items:center;justify-content:center;gap:6cqw;margin-bottom:2.4cqw}
.grant{font-family:'Amiri',serif;color:#4a6058;font-size:3.4cqw}
.name{font-family:'Amiri',serif;font-size:7.6cqw;font-weight:700;color:#0d5c46;line-height:1.4;margin:0}
.medal{width:16cqw;height:16cqw;border-radius:50%;margin:0;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#06352a;
  background:radial-gradient(circle at 35% 30%,#f6e08a,#d4af37 55%,#a8841c);box-shadow:0 1.2cqw 2.4cqw rgba(0,0,0,.25),inset 0 0 0 .8cqw rgba(255,255,255,.4),inset 0 0 0 1.2cqw #a8841c}
.medal b{font-size:5cqw;line-height:1}.medal span{font-size:2.4cqw;font-weight:700}
.scope{font-family:'Amiri',serif;display:inline-block;background:rgba(13,92,70,.08);border:1px solid rgba(13,92,70,.28);border-radius:3cqw;padding:.8cqw 4cqw;font-size:3.3cqw;font-weight:700;color:#0d5c46;margin-bottom:2cqw}
.enc{font-family:'Amiri',serif;font-size:3.6cqw;line-height:1.6;margin:0 0 2cqw;white-space:nowrap}
.verse{font-family:'Amiri',serif;color:#06352a;font-size:4.2cqw}.verse small{font-size:2.6cqw;opacity:.65;margin-inline-start:2cqw}
.foot{position:absolute;left:15cqw;right:15cqw;top:60.5%;display:grid;grid-template-columns:1fr 1fr;gap:6cqw;align-items:start}
.sig{font-family:'Amiri',serif;font-size:3.1cqw;color:#4a6058;text-align:center}
.sig .ln{border-bottom:.35cqw solid #4a6058;height:5cqw;margin-bottom:1cqw}
.sig b{display:block;color:#10241c;font-size:3.4cqw;line-height:1.5}
.no{position:absolute;left:0;right:0;top:94%;font-size:2.2cqw;color:#a8841c;direction:ltr;letter-spacing:.2cqw}
</style>
</head>
<body>
<div class="cert"><div class="c">
  <div class="brand">❖ منصة حمٓ لتعليم القرآن ❖</div>
  <h1>شهادة تقدير</h1>
  <div class="orn"><i></i>✦<i></i></div>
  <div class="who"><div class="medal"><b>96%</b><span>ممتاز</span></div>
    <div><div class="grant">تُمنح هذه الشهادة للطالب المتميز</div><div class="name">محمد عبدالله</div></div></div>
  <div class="scope">سورة المزمل — من الآية ١ إلى الآية ٢٠</div>
  <div class="enc">أحسنتَ يا بطل! بارك الله فيك وزادك علمًا ونورًا.</div>
  <div class="verse">﴿ وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا ﴾<small>سورة المزمل: 4</small></div>
  <div class="foot">
    <div class="sig"><div class="ln"></div>التاريخ<b>١٤ ربيع الآخر ١٤٤٨<br>١٨ أكتوبر ٢٠٢٦</b></div>
    <div class="sig"><div class="ln"></div>المعلم<b>أ. عبدالرحمن</b></div>
  </div>
</div></div>
</body></html>
