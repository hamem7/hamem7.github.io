<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="../core/themeInit.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معاينة — تطوير «تقارير الشهر»</title>
<!-- معاينة تطوير «تقارير الشهر» (components/monthlyReportsHub.js): نفس ملفات تنسيق المنصة وكتلة #main-header كما هي، والمظهر الداكن واللغتان.
     بيانات تجريبية فقط، ولا تُقرأ أو تُكتب أي بيانات من المنصة. -->
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/adults.css">
<link rel="stylesheet" href="../css/kids.css">
<link rel="stylesheet" href="../css/home.css">
<link rel="stylesheet" href="../css/homeFast.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/landscape.css">
<link rel="stylesheet" href="../css/theme-dark-auto.css">
<link rel="stylesheet" href="../css/theme-dark.css">
<style>
/* ===== «تقارير الشهر» المقترحة — كل الألوان من رموز الهوية (--dh-*) فتنقلب في المظهر الداكن ===== */
#rh{--rh-acc:var(--dh-emerald-700);width:100%;max-width:1320px;margin:0 auto;padding:14px 20px 28px;box-sizing:border-box;color:var(--dh-ink);text-align:start;font-size:16px;line-height:1.6}
[data-theme="dark"] #rh{--rh-acc:#6ee7b7}
/* خلفية الشاشة الخضراء كما في المنصة (.mrh-overlay) */
html:not([data-theme="dark"]),html:not([data-theme="dark"]) body.adult-theme{background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.12),transparent 30%),radial-gradient(circle at 85% 85%,rgba(212,175,55,.16),transparent 30%),linear-gradient(135deg,#06231c,#0d5c46 55%,#147c5e);background-attachment:fixed}
#rh *,#rh *::before,#rh *::after{box-sizing:border-box}
#rh button,#rh select,#rh input{font-family:inherit;margin:0;min-width:0;box-shadow:none}
#rh button{cursor:pointer}
#rh h2,#rh h3,#rh h4{margin:0;text-shadow:none;line-height:1.35;text-align:start}
#rh :focus-visible{outline:3px solid var(--dh-focus,var(--dh-gold-500));outline-offset:2px}
#rh .muted{color:var(--dh-ink-soft)}

/* شريط العنوان: رجوع + عنوان (حُذفت أيقونة 📅 التي كانت توحي بأنها زر) */
#rh .rh-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
#rh .rh-back{display:inline-flex;align-items:center;gap:8px;background:var(--dh-surface-3);color:var(--rh-acc);border:1px solid var(--dh-border);border-radius:14px;padding:0 14px;height:44px;font-weight:700}
[dir="ltr"] #rh .rh-back svg{transform:scaleX(-1)}
#rh .rh-top h2{color:#fffdf6 !important;font-size:1.55rem;font-weight:700}

/* التخطيط: عمودان على الشاشة العريضة */
#rh .rh-grid{display:grid;grid-template-columns:minmax(340px,420px) 1fr;gap:16px;align-items:start}
#rh .rh-pane{background:var(--dh-surface-1);border:1px solid var(--dh-border-soft);border-radius:22px;padding:16px;box-shadow:var(--dh-sh-lift);min-width:0}
#rh .rh-detail{position:sticky;top:12px}

/* شريط التذكير (الفكرة 6) */
#rh .rh-remind{display:flex;align-items:center;gap:10px;background:var(--dh-warn-bg);color:var(--dh-warn);border:1.5px solid color-mix(in srgb,var(--dh-warn) 40%,transparent);border-radius:14px;padding:9px 12px;margin-bottom:12px;font-weight:700;font-size:.9rem}
#rh .rh-remind span{flex:1}
#rh .rh-remind button{background:none;border:0;color:inherit;font-weight:800;text-decoration:underline;padding:2px 4px}
#rh .rh-remind .x{text-decoration:none;font-size:1.1rem;opacity:.7}

/* البطاقة الخضراء: التقدّم + اختيار الشهر (مكان واحد) + أرقام قابلة للنقر كمرشّحات (الفكرتان 3 و4) */
#rh .rh-ov{background:linear-gradient(135deg,#0d5c46,#0a4736);color:#fff;border-radius:20px;padding:14px 16px;margin-bottom:12px}
#rh .rh-ov-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
#rh .rh-ov-top b{font-size:1.7rem;color:#f0d878;line-height:1}
#rh .rh-ov-top .lbl{flex:1;min-width:0}
#rh .rh-msel{position:relative;flex:0 0 100%;order:-1;margin-bottom:6px}
#rh .rh-msel select{width:auto;max-width:100%}
#rh .rh-msel select{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(240,216,120,.55);border-radius:12px;padding:7px 34px 7px 14px;font-weight:800;font-size:.95rem;cursor:pointer}
[dir="rtl"] #rh .rh-msel select{padding:7px 14px 7px 34px}
#rh .rh-msel select option{color:#10241c;background:#fff}
#rh .rh-msel-in{position:relative;display:inline-block}
#rh .rh-msel-in::after{content:"▾";position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:#f0d878}
#rh .rh-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);margin:12px 0 10px;overflow:hidden}
#rh .rh-bar i{display:block;height:100%;background:linear-gradient(90deg,#f0d878,#d4af37);border-radius:99px;transition:width .4s}
#rh .rh-flts{display:flex;gap:6px;flex-wrap:wrap}
#rh .rh-flt{background:rgba(255,255,255,.12);border:1.5px solid transparent;color:#fff;border-radius:99px;padding:4px 12px;font-weight:700;font-size:.82rem}
#rh .rh-flt b{margin-inline-start:4px;color:#f0d878}
#rh .rh-flt.on{background:#fffdf6;color:#0d5c46}
#rh .rh-flt.on b{color:#0d5c46}

/* البحث */
#rh .rh-search{width:100%;padding:12px 16px;border-radius:16px;border:1.5px solid var(--dh-border-strong);background:var(--dh-surface-3);color:var(--dh-ink);font-size:1.05rem}
#rh .rh-search:focus{outline:none;border-color:var(--dh-emerald-600);box-shadow:0 0 0 4px color-mix(in srgb,var(--dh-emerald-600) 18%,transparent)}

/* القائمة: صف الطالب + معلومة مختصرة (الفكرة 5) */
#rh .rh-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
#rh .rh-item{display:flex;align-items:center;gap:12px;width:100%;background:var(--dh-surface-3);border:1.5px solid var(--dh-border-soft);border-radius:16px;padding:9px 12px;text-align:start;color:var(--dh-ink)}
#rh .rh-item:hover{border-color:var(--dh-border-strong)}
#rh .rh-item.sel{border-color:var(--dh-emerald-600);box-shadow:0 0 0 3px color-mix(in srgb,var(--dh-emerald-600) 20%,transparent)}
#rh .rh-av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:1.05rem;background:var(--dh-ok-bg);color:var(--rh-acc);border:2px solid var(--rh-acc)}
#rh .rh-who{flex:1;min-width:0}
#rh .rh-nm{font-weight:800;font-size:1.02rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#rh .rh-sub{font-size:.8rem;color:var(--dh-ink-soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#rh .rh-sub .stat{font-weight:700;color:var(--dh-ink)}
#rh .up{color:var(--dh-ok);font-weight:800}
#rh .down{color:var(--dh-warn);font-weight:800}
#rh .rh-badge{font-size:.7rem;font-weight:800;background:var(--dh-warn-bg);color:var(--dh-gold-ink,#8a6612);border-radius:99px;padding:1px 8px;white-space:nowrap}
#rh .rh-chip{border-radius:99px;font-size:.74rem;font-weight:800;padding:3px 10px;white-space:nowrap;flex:none}
#rh .rh-chip.ready{background:var(--dh-info-bg);color:var(--dh-info)}
#rh .rh-chip.missing{background:var(--dh-warn-bg);color:var(--dh-warn)}
#rh .rh-chip.done{background:var(--dh-ok-bg);color:var(--dh-ok)}
#rh .rh-chip.nodata{background:var(--dh-surface-2);color:var(--dh-ink-soft);border:1px solid var(--dh-border-soft)}
#rh .rh-empty{color:var(--dh-ink-soft);text-align:center;padding:16px}
#rh .rh-keys{color:var(--dh-ink-soft);font-size:.75rem;text-align:center;margin-top:10px}
#rh kbd{font-family:inherit;background:var(--dh-surface-3);border:1px solid var(--dh-border);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:.72rem}

/* اللوحة اليسرى: ملخص الشهر (الفكرة 1) */
#rh .rh-sec{margin-bottom:16px}
#rh .rh-sec:last-child{margin-bottom:0}
#rh .rh-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
#rh .rh-h h3{font-size:1.2rem;color:var(--dh-ink);flex:1}
#rh .rh-h h4{font-size:1rem;color:var(--dh-ink);flex:1}
#rh .rh-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
#rh .rh-kpi{background:var(--dh-surface-3);border:1.5px solid var(--dh-border-soft);border-radius:16px;padding:12px;text-align:center}
#rh .rh-kpi b{display:block;font-size:1.6rem;color:var(--rh-acc);line-height:1.2}
#rh .rh-kpi small{color:var(--dh-ink-soft);font-size:.78rem;display:block}
#rh .rh-kpi em{font-style:normal;font-size:.75rem;display:block;margin-top:2px}
#rh .rh-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#rh .rh-box{background:var(--dh-surface-3);border:1.5px solid var(--dh-border-soft);border-radius:18px;padding:14px}
#rh .rh-box.warn{background:var(--dh-warn-bg);border-color:color-mix(in srgb,var(--dh-warn) 35%,transparent)}
#rh .rh-box.warn h4{color:var(--dh-warn)}
#rh .rh-box.gold{background:color-mix(in srgb,var(--dh-gold-500) 12%,var(--dh-surface-3));border-color:color-mix(in srgb,var(--dh-gold-500) 45%,transparent)}
#rh .rh-names{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
#rh .rh-name{background:var(--dh-surface-3);border:1px solid var(--dh-border);border-radius:99px;padding:3px 11px;font-weight:700;font-size:.85rem;color:var(--dh-ink)}
#rh .rh-star{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;background:var(--dh-surface-3);border:1px solid var(--dh-border-soft);border-radius:14px;padding:8px 12px;margin-bottom:6px;color:var(--dh-ink);text-align:start}
#rh .rh-star .ic{font-size:1.3rem}
#rh .rh-star span{flex:1;min-width:0}
#rh .rh-star>b{white-space:nowrap}
#rh .rh-star small{display:block;color:var(--dh-ink-soft);font-size:.75rem}
#rh .rh-btn{border-radius:14px;border:1.5px solid var(--dh-border-strong);background:var(--dh-surface-3);color:var(--dh-ink);font-weight:700;font-size:.98rem;padding:12px 14px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
#rh .rh-btn.pri{background:var(--dh-emerald-700);border-color:var(--dh-emerald-700);color:var(--dh-on-emerald,#fff);font-weight:800}
#rh .rh-btn.gold{background:var(--dh-gold-500);border-color:var(--dh-gold-500);color:var(--dh-on-gold,#2b2208);font-weight:800}
#rh .rh-btn.warn{background:var(--dh-warn);border-color:var(--dh-warn);color:#fff;font-weight:800}
#rh .rh-btn.sm{min-height:38px;padding:7px 12px;font-size:.88rem}
#rh .rh-btn[disabled]{opacity:.5;cursor:not-allowed}
#rh .rh-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#rh .rh-acts .wide{grid-column:1/-1}
#rh .rh-prog{margin-top:10px;background:var(--dh-surface-2);border:1px solid var(--dh-border-soft);border-radius:12px;padding:10px 12px;font-weight:700;font-size:.9rem}
#rh .rh-prog .rh-bar{background:var(--dh-border-soft);margin:8px 0 0}

/* بطاقة الطالب */
#rh .rh-stu{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#0d5c46,#0a4736);color:#fff;border-radius:20px;padding:12px 14px;margin-bottom:12px}
#rh .rh-stu .rh-av{width:50px;height:50px;background:rgba(255,255,255,.15);border-color:#d4af37;color:#fff}
#rh .rh-stu .rh-nm{color:#fff;font-size:1.15rem}
#rh .rh-stu .rh-sub{color:#cfe8dd}
#rh .rh-stu .x{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:6px 12px;font-weight:700;font-size:.82rem;margin-inline-start:auto;flex:none}
#rh .rh-paper{background:var(--dh-surface-3);border:1.5px solid var(--dh-border-soft);border-radius:18px;padding:12px;margin-bottom:12px}
#rh .rh-paper-h{font-size:.8rem;font-weight:800;color:var(--dh-ink-soft);border-bottom:1px dashed var(--dh-border);padding-bottom:8px;margin-bottom:10px}
#rh .rh-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
#rh .rh-tile{background:var(--dh-surface-2);border:1.5px solid var(--dh-border-soft);border-radius:14px;padding:10px 6px;text-align:center}
#rh .rh-tile b{display:block;font-size:1.45rem;color:var(--rh-acc);line-height:1.2}
#rh .rh-tile small{color:var(--dh-ink-soft);font-size:.75rem}
#rh .rh-tile em{display:block;font-style:normal;font-size:.72rem;margin-top:2px}
#rh .rh-panel{border-radius:14px;padding:12px 14px;margin-bottom:8px;border:1.5px solid var(--dh-border-soft);background:var(--dh-surface-2)}
#rh .rh-panel.ready{background:var(--dh-ok-bg);border-color:color-mix(in srgb,var(--dh-ok) 30%,transparent)}
#rh .rh-panel.missing{background:var(--dh-warn-bg);border-color:color-mix(in srgb,var(--dh-warn) 35%,transparent)}
#rh .rh-panel .st{font-weight:800;margin-bottom:4px}
#rh .rh-panel.ready .st{color:var(--dh-ok)}
#rh .rh-panel.missing .st{color:var(--dh-warn)}
#rh .rh-panel p{margin:0;font-size:.93rem;color:var(--dh-ink)}
#rh .rh-note{color:var(--dh-ink-soft);font-size:.85rem;margin:4px 0 10px}

/* بعد التصدير: «التالي» (الفكرة 2) */
#rh .rh-next{background:var(--dh-ok-bg);border:1.5px solid color-mix(in srgb,var(--dh-ok) 35%,transparent);border-radius:18px;padding:14px;text-align:center}
#rh .rh-next .big{font-size:2rem;line-height:1}
#rh .rh-next h4{text-align:center;color:var(--dh-ok);margin:6px 0 10px;font-size:1.05rem}
#rh .rh-next .rh-btn{width:100%}
#rh .rh-next .left{font-size:.82rem;color:var(--dh-ink-soft);margin-top:8px}

#rh .rh-new{display:inline-block;font-size:.65rem;font-weight:800;background:var(--dh-gold-500);color:var(--dh-on-gold,#2b2208);border-radius:6px;padding:0 6px;margin-inline-start:6px;vertical-align:middle}
#rh.hide-new .rh-new{display:none}

@media (max-width: 899px){
  #rh{padding:10px 12px 24px}
  #rh .rh-grid{grid-template-columns:1fr}
  #rh .rh-detail{position:static}
  #rh .rh-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  #rh .rh-cols,#rh .rh-acts{grid-template-columns:1fr}
  #rh .rh-keys{display:none}
  #rh.has-sel .rh-list-pane{display:none}
}

/* شريط المعاينة السفلي (ليس جزءًا من المنصة) + رسالة */
.pv-bar{position:fixed;inset-inline:0;bottom:0;z-index:3000;background:#2b2100;color:#fbf3d5;font:600 .8rem 'IBM Plex Sans Arabic',sans-serif;padding:8px 14px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.pv-bar .pv-sw{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pv-bar button{border:1.5px solid #d4af37;background:transparent;color:#fbf3d5;border-radius:99px;padding:5px 14px;font:inherit;font-weight:700;cursor:pointer;margin:0;min-width:0;box-shadow:none}
.pv-bar button.on{background:#d4af37;color:#2b2100}
.pv-toast{position:fixed;bottom:110px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#06231c;color:#fff;border-radius:99px;padding:10px 20px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:3001}
.pv-toast.on{opacity:1}
body{padding-bottom:120px}
@media(max-width:480px){.pv-bar{font-size:.68rem;padding:6px 8px;gap:4px}.pv-bar button{padding:3px 9px}.pv-bar .pv-sw{gap:4px}}
</style>
</head>
<body class="adult-theme" id="main-body">

<div class="pv-bar" id="pvBar"></div>

<script src="../core/brandLogo.js"></script>
<script>
/* ===== نصوص الشاشة باللغتين ===== */
const T = {
  ar: {
    header_title: '🏆 رحلة إتقان القرآن', header_sub: 'منصة حمٓ', h_home: 'الرئيسية',

    f_all: 'الكل', f_ready: 'جاهز', f_missing: 'ينقصه بيانات', f_done: 'تم التصدير', f_nodata: 'بلا بيانات',
    c_ready: 'جاهز', c_missing: 'ينقص', c_done: '✓ {d}', c_nodata: 'بلا بيانات',

    ayahs_s: '+{n} آية', cur_month: 'الشهر الحالي',
    sum_title: 'ملخص شهر {m}', sum_sub: 'اختر طالبًا من القائمة لعرض تقريره، أو ابدأ من هنا:',
    k_ayahs: 'آية جديدة لكل الطلاب', k_avg: 'متوسط الدرجات', k_sess: 'جلسة تدريب', k_done: 'تقارير صدرت',
    vs_prev: 'مقارنة بالشهر السابق',
    act_seq: '📲 ابدأ الإرسال عبر واتساب طالبًا تلو الآخر ({n})', act_pdf: '📄 تصدير كل الجاهزين PDF ({n})', act_zip: 'ملف واحد مضغوط',

/* ===== بيانات تجريبية ===== */
const STU = [
  ['يوسف أحمد', 'Yusuf Ahmed', 4], ['مريم خالد', 'Maryam Khaled', 5], ['عمر سامي', 'Omar Sami', 3], ['ليان محمد', 'Layan Mohammed', 6],
  ['آدم علي', 'Adam Ali', 4], ['سارة حسن', 'Sara Hassan', 5], ['زياد فهد', 'Ziad Fahd', 3], ['جنى طارق', 'Jana Tariq', 6],
  ['حمزة ناصر', 'Hamza Nasser', 4], ['رزان عادل', 'Razan Adel', 5], ['إياد مازن', 'Iyad Mazen', 3], ['هند وليد', 'Hind Walid', 6]
].map(([ar, en, g], i) => ({ id: i + 1, n: { ar, en }, g }));
const SURAH = [['الملك', 'Al-Mulk'], ['القلم', 'Al-Qalam'], ['الحاقة', 'Al-Haqqah'], ['المعارج', "Al-Ma'arij"], ['نوح', 'Nuh'], ['الجن', 'Al-Jinn'], ['المزمل', 'Al-Muzzammil'], ['المدثر', 'Al-Muddaththir'], ['القيامة', 'Al-Qiyamah'], ['الإنسان', 'Al-Insan']];
const NOW = new Date(2026, 10, 2);
const MONTHS = [0, 1, 2, 3, 4].map(k => { const d = new Date(NOW.getFullYear(), NOW.getMonth() - k, 1); return { y: d.getFullYear(), m: d.getMonth(), cur: k === 0 }; });
function rnd(a, b) { let h = (a * 2654435761 ^ b * 40503) >>> 0; h = Math.imul(h ^ (h >>> 15), 2246822519) >>> 0; return ((h ^ (h >>> 13)) >>> 0) / 4294967296; }
function infoOf(s, mi) {
  const r = rnd(s.id, mi + 3), r2 = rnd(s.id * 3, mi + 11), r3 = rnd(s.id * 7, mi + 5);
  let state = mi === 0 ? (r < .55 ? 'missing' : r < .8 ? 'ready' : 'nodata') : (r < .14 ? 'nodata' : r < .36 ? 'missing' : 'ready');
  const ayahs = state === 'ready' ? 8 + Math.round(r2 * 70) : null;
  const games = state === 'nodata' ? { n: 0, avg: null } : { n: Math.round(r3 * 14), avg: 62 + Math.round(r2 * 35) };
  if (!games.n) games.avg = null;
  const a = Math.floor(r3 * 7);
  return { state, ayahs, games, from: SURAH[a], to: SURAH[a + 1 + Math.floor(r2 * 2)], review: r2 > .35 ? { k: 1 + Math.floor(r * 3), n: 120 + Math.round(r3 * 400) } : null };
}
/* التصدير (يُحفظ في الذاكرة فقط داخل المعاينة) */
let DONE = {};
function seedDone() {
  DONE = {};
  STU.forEach(s => MONTHS.forEach((mo, mi) => {
    const i = infoOf(s, mi);
    if (i.state === 'ready' && (mi >= 2 || (mi === 1 && (s.id === 2 || s.id === 9)))) DONE[s.id + '_' + mi] = new Date(mo.y, mo.m + 1, 2 + (s.id % 4));
  }));
}
seedDone();

/* ===== الحالة ===== */
const S = { lang: 'ar', mi: NOW.getDate() <= 10 ? 1 : 0, flt: 'all', q: '', sel: null, mode: 'summary', remind: true, tags: true, justSent: null, pdf: null };
const L = (k) => T[S.lang][k];
const tpl = (k, o) => L(k).replace(/\{(\w+)\}/g, (_, x) => o[x]);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const loc = () => (S.lang === 'ar' ? 'ar-EG' : 'en-US') + '-u-nu-latn';
const mName = (mi, yr) => { const m = MONTHS[mi]; return new Date(m.y, m.m, 1).toLocaleDateString(loc(), yr ? { month: 'long', year: 'numeric' } : { month: 'long' }); };
const dShort = (d) => d.toLocaleDateString(loc(), { day: 'numeric', month: 'short' });
const NEW = () => `<span class="rh-new">${L('new')}</span>`;
const isWide = () => window.matchMedia('(min-width: 900px)').matches;

function rowsOf(mi) {
  const rank = { ready: 0, missing: 1, done: 2, nodata: 3 };
  return STU.map(s => {
    const info = infoOf(s, mi), prev = mi + 1 < MONTHS.length ? infoOf(s, mi + 1) : null;
    const done = DONE[s.id + '_' + mi];
    return { s, info, prev, done, state: done ? 'done' : info.state };
  }).sort((x, y) => (rank[x.state] - rank[y.state]) || x.s.n[S.lang].localeCompare(y.s.n[S.lang], S.lang));
}
function stars(rows) {
  const best = (f) => rows.reduce((m, r) => { const v = f(r); return v > 0 && (!m || v > f(m)) ? r : m; }, null);
  return {
    top: best(r => r.info.ayahs || 0),
    active: best(r => r.info.games.n || 0),
    up: best(r => (r.info.ayahs != null && r.prev && r.prev.ayahs != null) ? r.info.ayahs - r.prev.ayahs : 0)
  };
}
const delta = (cur, old, suf = '') => (cur == null || old == null || cur === old) ? '' : `<em class="${cur > old ? 'up' : 'down'}">${cur > old ? '▲' : '▼'} ${Math.abs(cur - old)}${suf}</em>`;
const initial = (s) => [...s.n[S.lang].trim()][0];

/* ===== الأجزاء ===== */
function listPane(rows, st) {
  const cnt = (k) => k === 'all' ? rows.length : rows.filter(r => r.state === k).length;
  const done = cnt('done'), total = rows.length, pending = cnt('ready') + cnt('missing');
  const fk = ['all', 'ready', 'missing', 'done', 'nodata'].filter(k => k === 'all' || k === S.flt || cnt(k));
  const remind = S.remind && MONTHS[S.mi] && !MONTHS[S.mi].cur && S.mi === 1 && pending
    ? `<div class="rh-remind" role="status">🔔 <span>${esc(tpl('remind', { m: mName(S.mi), n: pending }))}${NEW()}</span><button type="button" data-act="remind-show">${L('remind_show')}</button><button type="button" class="x" data-act="remind-x" aria-label="${L('remind_close')}">×</button></div>` : '';
  return `<section class="rh-pane rh-list-pane">
    ${remind}
    <div class="rh-ov">
      <div class="rh-ov-top"><b>${done}/${total}</b><span class="lbl">${L('ov')}</span>
        <label class="rh-msel"><span class="rh-msel-in"><select id="rh-month" aria-label="${L('month_aria')}">${MONTHS.map((m, i) => `<option value="${i}" ${i === S.mi ? 'selected' : ''}>${esc(mName(i, m.y !== NOW.getFullYear()))}${m.cur ? ' · ' + esc(L('cur_month')) : ''}</option>`).join('')}</select></span></label>
      </div>
      <div class="rh-bar"><i style="width:${total ? Math.round(done / total * 100) : 0}%"></i></div>
      <div class="rh-flts" role="group">${fk.map(k => `<button type="button" class="rh-flt ${k === S.flt ? 'on' : ''}" data-flt="${k}" aria-pressed="${k === S.flt}">${L('f_' + k)}<b>${cnt(k)}</b></button>`).join('')}</div>
    </div>
    <input class="rh-search" id="rh-search" type="search" autocomplete="off" placeholder="${esc(L('search'))}" value="${esc(S.q)}">
    <div class="rh-list" id="rh-list" role="listbox" aria-label="${L('title')}">${listItems(rows, st)}</div>
    <div class="rh-keys">${L('keys')}${NEW()}</div>
  </section>`;
}
function filtered(rows) {
  const q = S.q.trim().toLowerCase();
  return rows.filter(r => (S.flt === 'all' || r.state === S.flt) && (!q || r.s.n.ar.includes(q) || r.s.n.en.toLowerCase().includes(q)));
}
function listItems(rows, st) {
  const f = filtered(rows);
  if (!f.length) return `<div class="rh-empty">${L(S.q ? 'no_match' : 'no_rows')}</div>`;
  return f.map(r => {
    const badges = (st.top === r ? `<span class="rh-badge">🏆 ${L('st_top')}</span>` : '') + (st.active === r ? `<span class="rh-badge">🎮 ${L('st_active')}</span>` : '');
    const stat = r.info.ayahs != null ? `<span class="stat">${esc(tpl('ayahs_s', { n: r.info.ayahs }))}</span>${r.prev && r.prev.ayahs != null && r.prev.ayahs !== r.info.ayahs ? `<span class="${r.info.ayahs > r.prev.ayahs ? 'up' : 'down'}">${r.info.ayahs > r.prev.ayahs ? '▲' : '▼'}${Math.abs(r.info.ayahs - r.prev.ayahs)}</span>` : ''}` : '';
    const chip = r.state === 'done' ? tpl('c_done', { d: dShort(r.done) }) : L('c_' + r.state);
    return `<button type="button" class="rh-item ${r.s.id === S.sel ? 'sel' : ''}" data-stu="${r.s.id}" role="option" aria-selected="${r.s.id === S.sel}">
      <span class="rh-av" aria-hidden="true">${esc(initial(r.s))}</span>
      <span class="rh-who"><span class="rh-nm">${esc(r.s.n[S.lang])}${badges}</span>
        <span class="rh-sub">${esc(S.lang === 'ar' ? 'الصف ' + ['', '', '', 'الثالث', 'الرابع', 'الخامس', 'السادس'][r.s.g] : 'Grade ' + r.s.g)}${stat ? ' · ' + stat : ''}</span></span>
      <span class="rh-chip ${r.state}">${esc(chip)}</span></button>`;
  }).join('');
}

function summaryPane(rows, st) {
  const ready = rows.filter(r => r.state === 'ready'), missing = rows.filter(r => r.state === 'missing');
  const sum = (a) => a.reduce((x, y) => x + y, 0);
  const prevRows = S.mi + 1 < MONTHS.length ? rowsOf(S.mi + 1) : null;
  const ay = sum(rows.map(r => r.info.ayahs || 0)), ayP = prevRows ? sum(prevRows.map(r => r.info.ayahs || 0)) : null;
  const avgs = rows.map(r => r.info.games.avg).filter(v => v != null), avg = avgs.length ? Math.round(sum(avgs) / avgs.length) : null;
  const avgsP = prevRows ? prevRows.map(r => r.info.games.avg).filter(v => v != null) : [], avgP = avgsP.length ? Math.round(sum(avgsP) / avgsP.length) : null;
  const ses = sum(rows.map(r => r.info.games.n)), sesP = prevRows ? sum(prevRows.map(r => r.info.games.n)) : null;
  const done = rows.filter(r => r.state === 'done').length;
  const starRow = (ic, k, r, val) => r ? `<button type="button" class="rh-star" data-stu="${r.s.id}"><span class="ic">${ic}</span><span><b>${esc(r.s.n[S.lang])}</b><small>${L(k)}</small></span><b>${esc(val)}</b></button>` : '';
  const pdf = S.pdf ? `<div class="rh-prog" role="status">${esc(tpl('pdf_prog', { i: S.pdf.i, n: S.pdf.n }))}<div class="rh-bar"><i style="width:${Math.round(S.pdf.i / S.pdf.n * 100)}%"></i></div></div>` : '';
  return `<section class="rh-pane rh-detail" aria-live="polite">
    <div class="rh-sec">
      <div class="rh-h"><h3>📊 ${esc(tpl('sum_title', { m: mName(S.mi) }))}${NEW()}</h3></div>
      <p class="muted" style="margin:0 0 12px">${L('sum_sub')}</p>
      <div class="rh-kpis">
        <div class="rh-kpi"><b>${ay}</b><small>${L('k_ayahs')}</small>${delta(ay, ayP)}</div>
        <div class="rh-kpi"><b>${avg != null ? avg + '٪' : '—'}</b><small>${L('k_avg')}</small>${delta(avg, avgP, '٪')}</div>
        <div class="rh-kpi"><b>${ses}</b><small>${L('k_sess')}</small>${delta(ses, sesP)}</div>
        <div class="rh-kpi"><b>${done}/${rows.length}</b><small>${L('k_done')}</small></div>
      </div>
    </div>
    <div class="rh-sec">
      ${ready.length ? `<div class="rh-acts">
        <button type="button" class="rh-btn pri wide" data-act="seq">${esc(tpl('act_seq', { n: ready.length }))}${NEW()}</button>
        <button type="button" class="rh-btn gold" data-act="pdf-all" ${S.pdf ? 'disabled' : ''}>${esc(tpl('act_pdf', { n: ready.length }))}${NEW()}</button>
        <button type="button" class="rh-btn" data-act="zip" ${S.pdf ? 'disabled' : ''}>🗜️ ${L('act_zip')}</button>
      </div>${pdf}` : `<div class="rh-panel ready"><div class="st">${L('all_done')}</div></div>`}
    </div>
    <div class="rh-sec rh-cols">
      <div class="rh-box warn">
        <div class="rh-h"><h4>${esc(tpl('miss_h', { n: missing.length }))}</h4></div>
        ${missing.length ? `<p class="muted" style="margin:0 0 8px;font-size:.88rem">${L('miss_p')}</p>
        <div class="rh-names">${missing.map(r => `<button type="button" class="rh-name" data-stu="${r.s.id}">${esc(r.s.n[S.lang])}</button>`).join('')}</div>
        <button type="button" class="rh-btn warn sm" data-act="bulk" data-n="${missing.length}">${L('miss_btn')}${NEW()}</button>` : `<p class="muted" style="margin:0">${L('miss_none')}</p>`}
      </div>
      <div class="rh-box gold">
        <div class="rh-h"><h4>${esc(tpl('stars_h', { m: mName(S.mi) }))}</h4></div>
        ${(st.top || st.active || st.up) ? starRow('🏆', 'st_top', st.top, st.top && tpl('ayahs', { n: st.top.info.ayahs }))
          + starRow('🎮', 'st_active', st.active, st.active && tpl('sessions', { n: st.active.info.games.n }))
          + starRow('📈', 'st_up', st.up, st.up && tpl('up_by', { n: st.up.info.ayahs - st.up.prev.ayahs })) : `<p class="muted" style="margin:0">${L('st_none')}</p>`}
      </div>
    </div>
  </section>`;
}

function studentPane(rows) {
  const r = rows.find(x => x.s.id === S.sel); if (!r) return summaryPane(rows, stars(rows));
  const i = r.info, p = r.prev || { ayahs: null, games: { n: null, avg: null } };
  const head = `<div class="rh-stu"><span class="rh-av" aria-hidden="true">${esc(initial(r.s))}</span>
      <span class="rh-who"><span class="rh-nm">${esc(r.s.n[S.lang])}</span><span class="rh-sub">${esc(mName(S.mi, true))}</span></span>
      <button type="button" class="x" data-act="close">✕ ${L('change')}</button></div>`;
  if (S.justSent === r.s.id) {
    const ready = rows.filter(x => x.state === 'ready');
    const nx = ready[0];
    return `<section class="rh-pane rh-detail" aria-live="polite">${head}
      <div class="rh-next"><div class="big">✅</div><h4>${esc(tpl('sent', { name: r.s.n[S.lang] }))}</h4>
        ${nx ? `<button type="button" class="rh-btn pri" data-act="next" data-stu="${nx.s.id}" autofocus>${esc(tpl('next', { name: nx.s.n[S.lang] }))} ${S.lang === 'ar' ? '←' : '→'}${NEW()}</button>
        <div class="left">${esc(tpl('left', { n: ready.length }))}</div>` : `<h4>${L('seq_end')}</h4>`}
        <button type="button" class="rh-btn sm" style="margin-top:10px" data-act="close">${L('back_sum')}</button>
      </div></section>`;
  }
  let panel;
  if (i.state === 'ready') panel = `<div class="rh-panel ready"><div class="st">${L('p_ready')}</div>
      <p>${esc(tpl('p_memo', { a: i.from[S.lang === 'ar' ? 0 : 1], b: i.to[S.lang === 'ar' ? 0 : 1], n: i.ayahs }))}</p>
      <p>${esc(i.games.n ? tpl('p_games', { n: i.games.n, avg: i.games.avg }) : L('p_games_none'))}</p></div>`;
  else if (i.state === 'missing') panel = `<div class="rh-panel missing"><div class="st">${L('p_missing')}</div><p>${L('p_missing_p')}</p>
      <button type="button" class="rh-btn warn sm" style="margin-top:8px" data-act="fix">${L('p_fix')}</button></div>`;
  else panel = `<div class="rh-panel"><div class="st">${L('p_nodata')}</div></div>`;
  const review = i.state === 'nodata' ? '' : `<div class="rh-panel" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b style="flex:1">${esc(i.review ? tpl('p_review', { k: i.review.k, n: i.review.n }) : L('p_review_none'))}</b>
      <button type="button" class="rh-btn sm" data-act="review">${L('p_review_add')}</button></div>`;
  const can = i.state === 'ready';
  return `<section class="rh-pane rh-detail" aria-live="polite">${head}
    <div class="rh-paper"><div class="rh-paper-h">${esc(tpl('paper', { m: mName(S.mi, true) }))}</div>
      <div class="rh-tiles">
        <div class="rh-tile"><b>${i.ayahs != null ? i.ayahs : '—'}</b><small>${L('t_ayahs')}</small>${delta(i.ayahs, p.ayahs)}</div>
        <div class="rh-tile"><b>${i.games.n}</b><small>${L('t_sess')}</small>${delta(i.games.n, p.games.n)}</div>
        <div class="rh-tile"><b>${i.games.avg != null ? i.games.avg + '٪' : '—'}</b><small>${L('t_avg')}</small>${delta(i.games.avg, p.games.avg, '٪')}</div>
      </div>${panel}${review}</div>
    ${r.done ? `<p class="rh-note">${esc(tpl('exported_before', { d: r.done.toLocaleDateString(loc()) }))}</p>` : ''}
    <div class="rh-acts">
      <button type="button" class="rh-btn pri wide" data-act="wa" ${can || r.done ? '' : 'disabled'}>${L('b_wa')}</button>
      <button type="button" class="rh-btn gold" data-act="pdf" ${can || r.done ? '' : 'disabled'}>${L('b_pdf')}</button>
      <button type="button" class="rh-btn" data-act="preview" ${can || r.done ? '' : 'disabled'}>${L('b_prev')}</button>
    </div></section>`;
}

/* ===== الرسم ===== */
const root = document.getElementById('rh');
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2600); }
function syncChrome() {
  const h = document.documentElement; h.lang = S.lang; h.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  document.title = S.lang === 'ar' ? 'معاينة — تطوير «تقارير الشهر»' : 'Preview — Monthly reports redesign';
  document.getElementById('header-title').textContent = L('header_title');
  document.getElementById('top-student-name').textContent = L('header_sub');
  document.getElementById('hdr-home').textContent = L('h_home');
  document.getElementById('lang-toggle-btn').title = S.lang === 'ar' ? 'English' : 'العربية';
  document.querySelectorAll('#lang-toggle-btn .lb-opt').forEach((e, i) => e.classList.toggle('is-on', (i === 0) === (S.lang === 'ar')));
  const sw = (k, on, lbl) => `<button type="button" data-pv="${k}" class="${on ? 'on' : ''}">${lbl}</button>`;
  document.getElementById('pvBar').innerHTML = `<div>${esc(L('pv_note'))}</div>
    <div class="pv-sw">${sw('summary', S.mode === 'summary', L('pv_sum'))}${sw('auto', S.mode === 'auto', L('pv_auto'))}${sw('tags', S.tags, L('pv_tags'))}${sw('reset', false, L('pv_reset'))}</div>`;
}
function render(focusSel) {
  syncChrome();
  const rows = rowsOf(S.mi), st = stars(rows);
  if (S.mode === 'auto' && S.sel == null && isWide()) { const f = rows.find(r => r.state === 'ready'); if (f) S.sel = f.s.id; }
  root.classList.toggle('hide-new', !S.tags);
  root.classList.toggle('has-sel', S.sel != null);
  root.innerHTML = `<div class="rh-top">
      <button type="button" class="rh-back" data-act="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>${L('back')}</button>
      <h2>${L('title')}</h2></div>
    <div class="rh-grid">${listPane(rows, st)}${S.sel != null ? studentPane(rows) : summaryPane(rows, st)}</div>`;
  if (focusSel) { const el = root.querySelector(`.rh-item[data-stu="${S.sel}"]`); if (el) el.focus(); }
  const nx = root.querySelector('[data-act="next"]'); if (nx) nx.focus();
}
function renderList() {
  const rows = rowsOf(S.mi);
  document.getElementById('rh-list').innerHTML = listItems(rows, stars(rows));
}
function pick(id) { S.sel = id; S.justSent = null; render(!isWide() ? false : true); if (!isWide()) window.scrollTo({ top: 0 }); }
function markSent(id) { DONE[id + '_' + S.mi] = new Date(NOW); }

root.addEventListener('input', e => { if (e.target.id === 'rh-search') { S.q = e.target.value; renderList(); } });
root.addEventListener('change', e => { if (e.target.id === 'rh-month') { S.mi = +e.target.value; S.sel = null; S.justSent = null; S.flt = 'all'; render(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.sel != null) { S.sel = null; S.justSent = null; render(); } return; }
  const inList = e.target.closest && (e.target.closest('#rh-list') || e.target.id === 'rh-search');
  if (!inList) return;
  const ids = [...document.querySelectorAll('#rh-list .rh-item')].map(b => +b.dataset.stu);
  if (!ids.length) return;
  if (e.key === 'Enter' && e.target.id === 'rh-search') { e.preventDefault(); pick(ids[0]); return; }
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  let k = ids.indexOf(S.sel); k = k < 0 ? (e.key === 'ArrowDown' ? 0 : ids.length - 1) : Math.max(0, Math.min(ids.length - 1, k + (e.key === 'ArrowDown' ? 1 : -1)));
  S.sel = ids[k]; S.justSent = null;
  if (isWide()) render(true); else { document.querySelectorAll('#rh-list .rh-item').forEach(b => b.classList.toggle('sel', +b.dataset.stu === S.sel)); document.querySelector(`#rh-list .rh-item[data-stu="${S.sel}"]`).focus(); }
});

function runPdf(n) {
  S.pdf = { i: 0, n }; render();
  const ids = rowsOf(S.mi).filter(r => r.state === 'ready').map(r => r.s.id);
  const step = () => {
    S.pdf.i++; if (S.sel == null) render();
    if (S.pdf.i < n) return setTimeout(step, 380);
    ids.forEach(markSent); S.pdf = null; render(); toast(tpl('pdf_ok', { n }));
  };
  setTimeout(step, 380);
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'lang-toggle-btn') { S.lang = S.lang === 'ar' ? 'en' : 'ar'; return render(); }
  if (b.id === 'theme-toggle-btn') { window.DHTheme && window.DHTheme.cycle(); return paintTheme(); }
  if (b.id === 'header-home-btn' || b.id === 'header-account-btn') return toast(L('toast') + L('home_t'));
  const d = b.dataset;
  if (d.pv) {
    if (d.pv === 'tags') S.tags = !S.tags;
    else if (d.pv === 'reset') { seedDone(); S.sel = null; S.justSent = null; S.remind = true; S.flt = 'all'; S.q = ''; S.mi = 1; }
    else { S.mode = d.pv; S.sel = null; S.justSent = null; }
    return render();
  }
  if (d.flt) { S.flt = d.flt; return render(); }
  if (d.act === 'remind-show') { S.flt = 'ready'; return render(); }
  if (d.act === 'remind-x') { S.remind = false; return render(); }
  if (d.act === 'back') return toast(L('toast') + L('home_t'));
  if (d.act === 'close') { S.sel = null; S.justSent = null; return render(); }
  if (d.act === 'seq' || d.act === 'next') { const f = d.stu ? +d.stu : (rowsOf(S.mi).find(r => r.state === 'ready') || {}).s?.id; if (f != null) pick(f); return; }
  if (d.act === 'pdf-all' || d.act === 'zip') return runPdf(rowsOf(S.mi).filter(r => r.state === 'ready').length);
  if (d.act === 'bulk') return toast(L('toast') + tpl('bulk_open', { n: d.n }));
  if (d.act === 'fix') return toast(L('toast') + L('fix_open'));
  if (d.act === 'review') return toast(L('toast') + L('review_open'));
  if (d.act === 'preview') return toast(L('toast') + L('prev_open'));
  if (d.act === 'wa' || d.act === 'pdf') { markSent(S.sel); S.justSent = S.sel; return render(); }
  if (d.stu) return pick(+d.stu);
});

/* أيقونة المظهر كما في core/theme.js */
const TI = { auto: '<path d="M12 3a9 9 0 1 0 0 18V3z" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="9"/>', light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', dark: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>' };
function paintTheme() { const p = window.DHTheme ? window.DHTheme.get() : 'auto'; const s = document.querySelector('#theme-toggle-btn svg'); if (s) s.innerHTML = TI[p] || TI.auto; }
document.addEventListener('app-theme-changed', paintTheme);
window.matchMedia('(min-width: 900px)').addEventListener('change', () => render());
paintTheme(); render();
</script>
</body>
