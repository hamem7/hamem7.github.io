<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معاينة — تقارير الشهر (تخطيطات الشاشة الكاملة)</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g9:#06231c;--g8:#0a4736;--g7:#0d5c46;--g6:#147c5e;--g1:#e7f4ee;--gold:#d4af37;--gold-d:#8a6612;--gold-soft:#fbf3d5;
  --ink:#10241c;--ink2:#5a6b63;--line:#e4dfcc;--paper:#fffdf6;--amber:#b45309;--amber-soft:#fffbeb;--ok:#047857}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',system-ui,sans-serif;text-shadow:none}
body{background:#0d1b16;color:var(--ink);min-height:100vh;padding:16px 12px 40px}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
.bar{max-width:1200px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.bar button{padding:9px 16px;border-radius:999px;background:#17342a;color:#cfe8dd;font-weight:700;font-size:.9rem;border:1.5px solid transparent}
.bar button.on{background:var(--gold);color:#3b2d05}
.bar .sep{width:1px;height:24px;background:#2c5143;margin:0 6px}
.note{max-width:900px;margin:0 auto 14px;text-align:center;color:#b9d6c9;font-size:.92rem;line-height:1.7;min-height:3.4em}
.note b{color:var(--gold)}
/* إطار الجهاز */
.frame{margin:0 auto;width:100%;max-width:1200px;height:700px;border-radius:14px;overflow:hidden;position:relative;
  border:2px solid #2c5143;box-shadow:0 30px 70px rgba(0,0,0,.5);transition:max-width .25s}
.frame.mobile{max-width:390px;height:760px}
.screen{position:absolute;inset:0;overflow-y:auto;color:var(--ink);
  background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.12),transparent 30%),radial-gradient(circle at 85% 85%,rgba(212,175,55,.16),transparent 30%),linear-gradient(135deg,#06231c,#0d5c46 55%,#147c5e);}
.platform{background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:10px;font-weight:800;color:var(--g7)}
.platform i{margin-inline-start:auto;font-style:normal;font-size:.8rem;color:var(--ink2);font-weight:500}
/* رأس الصفحة */
.hdr{display:flex;align-items:center;gap:12px;padding:14px 20px}
.back{background:#fff;border:1px solid var(--line);color:var(--g7);height:42px;padding:0 14px;border-radius:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.hdr h2{font-size:1.45rem;color:#fff;font-weight:800}
.hdr .ico{margin-inline-start:auto;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:1.3rem}
/* لوحات عامة */
.paper{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px}
.ov{background:linear-gradient(135deg,var(--g7),var(--g8));color:#fff;border-radius:18px;padding:14px 16px}
.ov-top{display:flex;align-items:baseline;gap:10px}.ov-top b{font-size:1.6rem}.ov-top span{opacity:.85;font-size:.9rem}
.bar2{height:8px;border-radius:99px;background:rgba(255,255,255,.2);margin:10px 0 8px;overflow:hidden}
.bar2 i{display:block;height:100%;width:25%;background:linear-gradient(90deg,#f0d878,#d4af37)}
.chips{display:flex;gap:8px;font-size:.8rem;font-weight:700;flex-wrap:wrap}.chips span{background:rgba(255,255,255,.14);border-radius:99px;padding:2px 10px}
.stars{background:linear-gradient(135deg,#fff8dc,var(--gold-soft));border:1.5px solid #e9d27a;border-radius:18px;padding:12px 14px}
.stars h4{color:var(--gold-d);font-size:1rem;margin-bottom:8px}
.stars div{display:flex;flex-wrap:wrap;gap:8px}
.stars span{background:#fff;border:1px solid #e9d27a;border-radius:999px;padding:5px 12px;font-weight:700;color:#6b4e0a;font-size:.88rem}
.months,.flt{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
.mo,.fl{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:.88rem}
.mo.s,.fl.s{background:var(--g7);color:#fff;border-color:var(--g7)}.fl small{opacity:.7;margin-inline-start:4px}
.search{width:100%;padding:13px 16px;border-radius:16px;border:2px solid var(--g6);font-size:1.05rem;background:#fff;box-shadow:0 0 0 4px rgba(20,124,94,.1)}
.stack>*+*{margin-top:10px}
.av{width:44px;height:44px;border-radius:50%;background:var(--g1);border:2px solid var(--g7);display:grid;place-items:center;font-weight:800;color:var(--g7);flex:none}
.chip{border-radius:99px;font-size:.74rem;font-weight:800;padding:2px 10px;white-space:nowrap}
.chip.ready{background:var(--gold-soft);color:var(--gold-d)}.chip.missing{background:var(--amber-soft);color:var(--amber)}
.chip.done{background:var(--g1);color:var(--ok)}.chip.nodata{background:#f1f5f9;color:#64748b}
.badge{font-size:.72rem;font-weight:800;background:var(--gold-soft);color:var(--gold-d);border-radius:99px;padding:1px 8px;margin-inline-start:6px;white-space:nowrap}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:16px;background:#fff;cursor:pointer}
.row.sel{border-color:var(--g6);box-shadow:0 0 0 3px rgba(20,124,94,.14)}
.row .nm{font-weight:800}.row .gr{font-size:.8rem;color:var(--ink2)}.row .chip{margin-inline-start:auto}
/* 0) الحالي */
.cur .card{background:var(--paper);width:100%;min-height:100%;padding:0}
.cur .row{border-radius:0}
.cur .card .in{padding:18px 22px}
/* A) عمود مركزي */
.colA{max-width:760px;margin:0 auto;padding:0 16px 30px}
/* B) مقسومة */
.split{display:grid;grid-template-columns:400px 1fr;gap:16px;padding:0 20px 24px;align-items:start}
.frame.mobile .split{grid-template-columns:1fr;padding:0 12px 24px}
.detail .top{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--g7),var(--g8));color:#fff;border-radius:20px;padding:14px 16px;margin-bottom:12px}
.detail .top .av{width:54px;height:54px;background:rgba(255,255,255,.15);border-color:var(--gold);color:#fff;font-size:1.3rem}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.tile b{display:block;font-size:1.5rem;color:var(--g7)}.tile small{color:var(--ink2);font-size:.8rem}.tile em{display:block;font-style:normal;font-size:.72rem;font-weight:800;color:var(--ok)}
.panel{border:1.5px solid #a7e3c8;background:#ecfdf5;border-radius:16px;padding:12px 14px;line-height:1.9;font-size:.95rem}
.act{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.act button{flex:1;min-width:120px;padding:12px;border-radius:14px;font-weight:800;color:#fff}
.pdf{background:var(--g7)}.wa{background:#1fa855}.pv{background:#fff;color:var(--g7)!important;border:1.5px solid var(--g7)!important}
/* C) شبكة */
.gridC{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cardC{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px;text-align:center;cursor:pointer;position:relative}
.cardC .av{width:60px;height:60px;margin:0 auto 8px;font-size:1.4rem}
.cardC .nm{font-weight:800}.cardC .gr{font-size:.78rem;color:var(--ink2);margin-bottom:8px}
.cardC .badge{position:absolute;top:8px;inset-inline-start:8px;margin:0}
.cardC .mini{display:flex;justify-content:center;gap:10px;font-size:.78rem;color:var(--ink2);margin-top:8px}
.top2{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
.frame.mobile .top2{grid-template-columns:1fr}
.hide-m{}.frame.mobile .hide-m{display:none}
</style>
</head>
<body>
<div class="bar" id="tabs"></div>
<div class="bar" id="dev"></div>
<div class="note" id="note"></div>
<div class="frame" id="frame"><div class="screen" id="screen"></div></div>

<script>
const S=[
 {n:'آيات',s:'ready',g:'الصف الثالث',a:42,j:9,top:1},
 {n:'أحمد محمود',s:'ready',g:'الصف الخامس',a:31,j:14,act:1},
 {n:'خالد عبدالله',s:'missing',g:'الصف الرابع',a:0,j:6},
 {n:'سارة إبراهيم',s:'done',g:'الصف الثاني',a:25,j:8},
 {n:'عمر يوسف',s:'ready',g:'الصف السادس',a:18,j:3},
 {n:'مريم علي',s:'missing',g:'الصف الثالث',a:0,j:2},
 {n:'يوسف حسن',s:'done',g:'الصف الخامس',a:22,j:5},
 {n:'نور الدين',s:'nodata',g:'الصف الأول',a:0,j:0},
];
const L={ready:'جاهز',missing:'ناقص',done:'تم التصدير',nodata:'لا بيانات'};
const bg=s=>(s.top?'<span class="badge">🏆 الأكثر حفظًا</span>':'')+(s.act?'<span class="badge">🎮 الأكثر نشاطًا</span>':'');
const hdr='<div class="platform">🕌 دار الهمم <i>هيدر المنصة</i></div><div class="hdr"><button class="back">→ طلابي</button><h2>تقارير الشهر</h2><span class="ico">📅</span></div>';
const ov='<div class="ov"><div class="ov-top"><b>2/8</b><span>تقارير أكتوبر المُصدَّرة</span></div><div class="bar2"><i></i></div><div class="chips"><span>✓ 3 جاهز</span><span>! 2 ناقص</span></div></div>';
const stars='<div class="stars"><h4>🌟 نجوم شهر أكتوبر</h4><div><span>🏆 الأكثر حفظًا: آيات</span><span>🎮 الأكثر نشاطًا: أحمد محمود</span></div></div>';
const months='<div class="months"><button class="mo s">أكتوبر</button><button class="mo">سبتمبر</button><button class="mo">أغسطس</button></div>';
const flt=(n)=>'<div class="flt"><button class="fl s">الكل<small>8</small></button><button class="fl">جاهز<small>3</small></button><button class="fl">ناقص<small>2</small></button><button class="fl">تم<small>2</small></button><button class="fl">لا بيانات<small>1</small></button></div>';
const search='<input class="search" placeholder="🔍 ابحث باسم الطالب…">';
const row=(s,sel)=>`<div class="row ${sel?'sel':''}"><span class="av">${s.n[0]}</span><span><div class="nm">${s.n}${bg(s)}</div><div class="gr">${s.g}</div></span><span class="chip ${s.s}">${L[s.s]}</span></div>`;
const detail=`<div class="detail paper"><div class="top"><span class="av">آ</span><span><div style="font-weight:800;font-size:1.15rem">آيات</div><div style="opacity:.85;font-size:.85rem">الصف الثالث · أكتوبر</div></span></div>
 <div class="tiles"><div class="tile"><b>42</b><small>آيات جديدة</small><em>▲ 12</em></div><div class="tile"><b>9</b><small>جلسات اللعب</small><em>▲ 3</em></div><div class="tile"><b>88٪</b><small>متوسط النتائج</small><em>▲ 5٪</em></div></div>
 <div class="panel"><b>✅ التقرير جاهز</b><br>حفظ من البقرة 1 إلى البقرة 42 (42 آية جديدة)<br>🔁 مراجعة 3 أجزاء · 120 آية</div>
 <div class="act"><button class="pdf">📄 تصدير PDF</button><button class="wa">💬 واتساب</button><button class="pv">👁 معاينة</button></div></div>`;

const V={
cur:{note:'<b>الوضع الحالي بعد التمدد:</b> كل شيء ممدود على العرض كله — الاسم في أقصى اليمين والحالة في أقصى اليسار.',
 html:()=>`<div class="cur"><div class="platform">🕌 دار الهمم</div><div class="card"><div class="in" style="display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)"><button class="back">→ طلابي</button><h2 style="color:var(--g7)">تقارير الشهر</h2></div><div class="in stack">${ov}${months}${search}${flt()}${S.map(s=>row(s)).join('')}</div></div></div>`},
A:{note:'<b>(أ) عمود مركزي:</b> الخلفية والهيدر بعرض الشاشة، والمحتوى في عمود مريح (~760px) على لوحة ورقية. نفس الشكل تمامًا على الموبايل.',
 html:()=>`${hdr}<div class="colA"><div class="paper stack">${ov}${stars}${months}${search}${flt()}${S.map(s=>row(s)).join('')}</div></div>`},
B:{note:'<b>(ب) شاشة مقسومة:</b> القائمة يمينًا والتقرير يسارًا — تضغط على طالب فيظهر تقريره فورًا بدون تغيير الشاشة. على الموبايل تتحول لقائمة ثم بطاقة (جرّب زر «موبايل»).',
 html:()=>`${hdr}<div class="split"><div class="paper stack">${ov}${months}${search}${flt()}${S.map((s,i)=>row(s,i===0)).join('')}</div><div class="hide-m">${stars.replace('class="stars"','class="stars" style="margin-bottom:12px"')}${detail}</div></div>`},
C:{note:'<b>(ج) شبكة بطاقات:</b> الطلاب بطاقات صغيرة بعدة أعمدة تملأ العرض بشكل طبيعي، مع النجوم والتقدّم جنبًا إلى جنب في الأعلى.',
 html:()=>`${hdr}<div class="colA" style="max-width:1100px"><div class="top2">${ov}${stars}</div><div class="paper stack" style="margin-top:12px">${months}${search}${flt()}<div class="gridC" style="margin-top:12px">${S.map(s=>`<div class="cardC">${s.top?'<span class="badge">🏆</span>':s.act?'<span class="badge">🎮</span>':''}<div class="av">${s.n[0]}</div><div class="nm">${s.n}</div><div class="gr">${s.g}</div><span class="chip ${s.s}">${L[s.s]}</span><div class="mini"><span>📖 ${s.a}</span><span>🎮 ${s.j}</span></div></div>`).join('')}</div></div></div>`},
};
const names={cur:'الحالي (للمقارنة)',A:'(أ) عمود مركزي',B:'(ب) شاشة مقسومة',C:'(ج) شبكة بطاقات'};
let cur='A',mob=false;
function draw(){
 document.getElementById('tabs').innerHTML=Object.keys(V).map(k=>`<button class="${k===cur?'on':''}" data-k="${k}">${names[k]}</button>`).join('');
 document.getElementById('dev').innerHTML=`<button class="${!mob?'on':''}" data-m="0">🖥 كمبيوتر</button><button class="${mob?'on':''}" data-m="1">📱 موبايل</button>`;
 document.getElementById('frame').className='frame'+(mob?' mobile':'');
 document.getElementById('note').innerHTML=V[cur].note;
 document.getElementById('screen').innerHTML=V[cur].html();
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.k){cur=b.dataset.k;draw()}else if(b.dataset.m){mob=b.dataset.m==='1';draw()}});
draw();
</script>
</body>
</html>
