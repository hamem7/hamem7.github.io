<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معاينة (أ) — بطاقة آخر تسجيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mem-record-shared.css">
<style>
.a-head { padding: 20px 22px 14px; display: grid; gap: 12px; }
.a-kind { font-size: .8rem; font-weight: 700; color: var(--dh-gold-ink); }
.a-last { margin: 0 22px; border: 2px solid var(--dh-gold-500); background: var(--dh-gold-soft); border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
.a-last .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--dh-gold-500); color: #2b2100; flex-shrink: 0; }
.a-last small { display: block; font-size: .78rem; font-weight: 700; color: var(--dh-gold-ink); }
.a-last strong { font-size: 1.25rem; color: var(--dh-ink); }
.a-last em { display: block; font-style: normal; font-size: .8rem; color: var(--dh-ink-soft); }
.a-body { padding: 18px 22px 8px; display: grid; gap: 16px; }
.a-step { display: flex; align-items: stretch; gap: 8px; }
.a-step button.sq { width: 54px; border-radius: 14px; border: 2px solid var(--dh-border-strong); background: var(--dh-surface-3); font-size: 1.6rem; font-weight: 700; color: var(--dh-primary); }
.a-step button.sq:hover { background: var(--dh-tint); }
.a-step input { flex: 1; min-width: 0; text-align: center; font-size: 1.7rem; font-weight: 800; border-radius: 14px; border: 2px solid var(--dh-border-strong); background: var(--dh-surface-3); padding: 8px; direction: ltr; }
.a-step .of { align-self: center; font-size: .85rem; color: var(--dh-ink-soft); white-space: nowrap; font-weight: 600; }
.a-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.a-chip { border: 1.5px solid var(--dh-border-strong); background: var(--dh-surface-3); border-radius: 999px; padding: 6px 14px; font-size: .85rem; font-weight: 700; color: var(--dh-ink); }
.a-chip:hover { background: var(--dh-tint); border-color: var(--dh-primary); }
.a-foot { padding: 14px 22px 22px; display: grid; gap: 14px; }
</style>
</head>
<body>
<div class="mr-note" data-i18n="note"></div>
<div class="mr-top"><b data-i18n="topTitle"></b>
  <button class="mr-pill" id="mr-theme">◐</button>
  <button class="mr-pill" id="mr-lang">English</button>
</div>
<div class="mr-stage">
  <div class="mr-sheet" id="sheet"></div>
</div>
<script src="mem-record-shared.js"></script>
<script>
(function () {
  const sh = document.getElementById('sheet');
  const last = { s: MR.SAMPLE.last.s, a: MR.SAMPLE.last.a };
  let cur = { s: last.s, a: last.a };

  function render() {
    const max = MR.count(cur.s);
    cur.a = Math.min(Math.max(1, cur.a), max);
    const n = MR.newAyahs(last, cur);
    const cls = n < 0 ? 'bad' : n === 0 ? 'zero' : '';
    const msg = n < 0 ? MR.t('backward') : n === 0 ? MR.t('noProgress') : '';
    sh.innerHTML = `
      <div class="a-head">
        <div class="mr-stu"><div class="mr-av">${MR.t('student').charAt(0)}</div>
          <div><h2>${MR.t('student')}</h2><p>${MR.t('kind')} — ${MR.t('month', { m: MR.SAMPLE.month, y: MR.SAMPLE.year })}</p></div></div>
      </div>
      <div class="a-last">
        <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
        <div><small>${MR.t('lastTitle')}</small><strong>${MR.name(last.s)} — ${last.a}</strong><em>${MR.t('lastSub', { d: MR.t('dateSample') })}</em></div>
      </div>
      <div class="a-body">
        <div class="mr-field"><label for="s">${MR.t('surah')}</label>
          <select class="mr-select" id="s">${MR.surahOptions(cur.s)}</select>
          <div class="a-chips">
            <button class="a-chip" data-go="same">${MR.t('sameSurah')} · ${MR.name(last.s)}</button>
            ${last.s > 1 ? `<button class="a-chip" data-go="next">${MR.t('nextSurah')} · ${MR.name(last.s - 1)}</button>` : ''}
          </div></div>
        <div class="mr-field"><label for="a">${MR.t('ayah')}</label>
          <div class="a-step"><button class="sq" data-d="-1" aria-label="-1">−</button>
            <input id="a" type="number" inputmode="numeric" min="1" max="${max}" value="${cur.a}">
            <button class="sq" data-d="1" aria-label="+1">+</button>
            <span class="of">${MR.t('ayahOf', { n: max })}</span></div>
          <div class="a-chips"><button class="a-chip" data-go="end">${MR.t('finishSurah')} (${max})</button>
            <button class="a-chip" data-go="reset">↺ ${MR.t('reset')}</button></div></div>
      </div>
      <div class="a-foot">
        <div class="mr-delta ${cls}"><span>${msg || MR.t('newAyahs')}</span><strong>${n > 0 ? '+' + n : n === 0 ? '0' : '!'}</strong></div>
        <div class="mr-actions"><button class="mr-btn ghost">${MR.t('skip')}</button>
          <button class="mr-btn primary" ${n < 0 ? 'disabled' : ''}>${MR.t('next')}</button></div>
      </div>`;
    sh.querySelector('#s').onchange = e => { cur.s = +e.target.value; cur.a = Math.min(cur.a, MR.count(cur.s)); render(); };
    sh.querySelector('#a').onchange = e => { cur.a = parseInt(e.target.value, 10) || 1; render(); };
    sh.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { cur.a += +b.dataset.d; render(); });
    sh.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
      const g = b.dataset.go;
      if (g === 'same') cur = { s: last.s, a: cur.a };
      else if (g === 'next') cur = { s: last.s - 1, a: 1 };
      else if (g === 'end') cur.a = MR.count(cur.s);
      else cur = { s: last.s, a: last.a };
      render();
    });
  }
  MR.onChange(render);
})();
</script>
</body>
</html>
