<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="../core/themeInit.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معاينة — درس القلقلة للأطفال</title>
<!-- نموذج درس كامل للأطفال (القلقلة) بنفس ملفات المنصة وترويستها.
     المحتوى كله من مواد موجودة في المستودع: صور عرض القلقلة (assets/tajweed/qalqalah — إعداد المعلم)، رسوم المخارج من كتاب
     «التجويد المصوّر» (assets/tajweed/book — منسوبة في كل عرض)، والآيات وتظليلها من بيانات الركن (tajweed/challenge/data/pool.js)،
     والصوت بصوت المنشاوي (engine/ayahAudio.js). لا نص قرآني مكتوب يدويًا هنا؛ الحروف المفردة بحركاتها رموز تعليمية. -->
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/adults.css">
<link rel="stylesheet" href="../css/kids.css">
<link rel="stylesheet" href="../css/home.css">
<link rel="stylesheet" href="../css/homeFast.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/landscape.css">
<link rel="stylesheet" href="../css/theme-dark-auto.css">
<link rel="stylesheet" href="../css/theme-dark.css">
<link rel="icon" type="image/svg+xml" href="../icons/favicon.svg">
<style>
#tl{
  --c:#6d4ad8;--gold:#d4af37;--surface:var(--dh-surface-3);
  --k-q:#e8743b;--k-t:#3d8fd6;--k-b:#5aa83c;--k-j:#e0b100;--k-d:#d6457a;
  max-width:1040px;width:calc(100% - 32px);margin:24px auto 28px;background:var(--dh-surface-1);color:var(--dh-ink);border-radius:28px;
  box-shadow:var(--dh-sh-lift);padding:22px 26px 26px;text-align:start;font-size:17px;line-height:1.75;box-sizing:border-box;display:flex;flex-direction:column;gap:16px
}
[data-theme="dark"] #tl{--c:#a78bfa;--gold:#e3c155;--k-q:#f59a66;--k-t:#6cb4f0;--k-b:#86cf68;--k-j:#f2cc3d;--k-d:#f27aa6}
#tl *,#tl *::before,#tl *::after{box-sizing:border-box}
#tl button{font-family:inherit;margin:0;min-width:0;box-shadow:none;cursor:pointer}
#tl p{margin:0}
#tl :focus-visible{outline:3px solid var(--dh-focus,var(--dh-gold-500));outline-offset:2px}
#app-root #tl h1,#app-root #tl h2,#app-root #tl h3{color:var(--dh-ink) !important;text-shadow:none !important;margin:0;line-height:1.35;text-align:start}
/* تحييد إطار .quran-text العام في adults/kids/global (تخطيط فقط: الخلفية والحشوة والحجم؛ الخط والوزن والتباعد كما هي) */
#app-root #tl .quran-text{background:none !important;padding:0 !important;border:0 !important;border-radius:0 !important;box-shadow:none !important;max-width:none}
#app-root #tl span.quran-text,#app-root #tl b.quran-text{display:inline;color:inherit;font-size:inherit !important}

/* رأس الدرس */
#tl .tl-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#tl .tl-crumb{font-size:.85rem;color:var(--dh-ink-soft);font-weight:700}
#tl .tl-sp{flex:1}
#tl .tl-mode{display:flex;background:var(--dh-surface-0);border:1.5px solid var(--dh-border);border-radius:14px;padding:3px;gap:3px}
#tl .tl-mode button{border:0;background:transparent;color:var(--dh-ink-soft);font-weight:700;border-radius:11px;padding:7px 14px;font-size:.88rem;min-height:40px}
#tl .tl-mode button[aria-pressed="true"]{background:var(--dh-emerald-700);color:var(--dh-on-emerald)}
#tl .tl-prog{display:flex;gap:5px;align-items:center}
#tl .tl-prog button{width:30px;height:8px;border-radius:99px;border:0;background:var(--dh-border-soft);padding:0}
#tl .tl-prog button.done{background:color-mix(in srgb,var(--c) 55%,var(--dh-border-soft))}
#tl .tl-prog button.cur{background:var(--c);width:44px}

/* الشريحة */
#tl .sl{display:flex;flex-direction:column;gap:16px;animation:tlIn .35s ease-out}
#tl.is-scroll .sl{padding-bottom:26px;border-bottom:2px dashed var(--dh-border)}
#tl.is-scroll .sl:last-of-type{border-bottom:0}
@keyframes tlIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#tl .kick{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:color-mix(in srgb,var(--c) 14%,var(--dh-surface-3));color:color-mix(in srgb,var(--c) 80%,var(--dh-ink));font-weight:700;font-size:.82rem;border-radius:99px;padding:4px 14px}
#tl .sl h2{font-size:clamp(1.45rem,2.6vw + .7rem,2.1rem)}
#tl .lead{font-size:1.12rem;color:var(--dh-ink)}
#tl .muted{color:var(--dh-ink-soft)}
#tl .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center}
#tl .card{background:var(--dh-surface-3);border:1.5px solid var(--dh-border);border-radius:20px;padding:16px 18px}
#tl .kid{position:relative;background:color-mix(in srgb,var(--gold) 14%,var(--dh-surface-3));border:1.5px solid color-mix(in srgb,var(--gold) 45%,var(--dh-border));border-radius:22px;padding:16px 18px 16px 18px;font-size:1.12rem}
#tl .kid b.who{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--dh-gold-ink,var(--dh-ink));margin-bottom:4px}

/* صورة العرض (شرائح المعلم) */
#tl figure{margin:0}
#tl .deck{border-radius:20px;overflow:hidden;border:1.5px solid var(--dh-border);background:#fbf6e9}
#tl .deck img{display:block;width:100%;height:auto}
#tl .deck figcaption,#tl .book figcaption{font-size:.8rem;color:var(--dh-ink-soft);padding:6px 12px;background:var(--dh-surface-3);border-top:1px solid var(--dh-border-soft)}
#tl .book{border-radius:18px;overflow:hidden;border:1.5px solid var(--dh-border);background:#fff}
#tl .book img{display:block;width:100%;height:auto;max-height:340px;object-fit:contain;background:#fff}

/* أهداف ومعلومات */
#tl .chips{display:flex;gap:8px;flex-wrap:wrap}
#tl .chip{display:inline-flex;align-items:center;gap:6px;background:var(--dh-surface-3);border:1.5px solid var(--dh-border);border-radius:99px;padding:4px 12px;font-size:.85rem;font-weight:700}
#tl .goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
#tl .goals li{display:flex;gap:10px;align-items:flex-start}
#tl .goals li i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--dh-ok-bg);color:var(--dh-ok);display:grid;place-items:center;font-weight:700;flex:none;font-size:.85rem}

/* رسم الكرة */
#tl .bounce{width:100%;max-width:420px;height:auto;display:block;margin:auto}
#tl .bounce .gr{stroke:var(--dh-border-strong);stroke-width:4;stroke-linecap:round}
#tl .bounce .blk{fill:color-mix(in srgb,var(--c) 16%,var(--dh-surface-3));stroke:var(--c);stroke-width:3}
#app-root #tl .bounce .let{fill:var(--dh-ink);font-size:46px !important}
#tl .bounce .ball{fill:var(--gold);stroke:color-mix(in srgb,var(--gold) 60%,#000);stroke-width:2.5}
#tl .bounce .echo{fill:none;stroke:var(--c);stroke-width:3.5;stroke-linecap:round}
#tl .bounce .face{fill:#5b3d00}
@media (prefers-reduced-motion:no-preference){
  #tl .bounce .ballg{animation:tlBounce 1.6s cubic-bezier(.3,0,.4,1) infinite}
  #tl .bounce .echo{animation:tlEcho 1.6s ease-out infinite}
  @keyframes tlBounce{0%,100%{transform:translateY(-70px)}48%{transform:translateY(0)}52%{transform:translateY(0) scaleY(.92)}}
  @keyframes tlEcho{0%,40%{opacity:0}52%{opacity:1}80%,100%{opacity:0}}
}

/* حروف القلقلة */
#tl .coins{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#tl .coin{width:84px;height:84px;border-radius:50%;border:4px solid color-mix(in srgb,var(--k) 70%,#000 0%);background:var(--k);color:#fff;font-size:2.3rem;display:grid;place-items:center;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),0 6px 14px color-mix(in srgb,var(--k) 35%,transparent);transition:transform .15s}
#tl .coin:hover{transform:translateY(-4px)}
#tl .coin[aria-pressed="true"]{transform:translateY(-6px) scale(1.06);outline:4px solid color-mix(in srgb,var(--k) 35%,transparent);outline-offset:3px}
#app-root #tl .coin .quran-text{line-height:1 !important;font-size:2.3rem !important;padding-bottom:.25em !important}
#tl .mn{display:flex;align-items:center;justify-content:center;gap:10px;font-size:1rem;color:var(--dh-ink-soft)}
#app-root #tl .mn b{font-size:1.9rem !important;color:var(--dh-ink)}
#tl .mkh{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center;border-top:5px solid var(--k);background:var(--dh-surface-3);border-radius:20px;border-inline:1.5px solid var(--dh-border);border-bottom:1.5px solid var(--dh-border);padding:16px}
#tl .mkh h3{font-size:1.3rem}
#app-root #tl .mkh .big{font-size:3.4rem !important;color:var(--k);line-height:1.4 !important}
#tl .credit{font-size:.75rem;color:var(--dh-ink-soft)}

/* متى تقفز */
#tl .eq{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;font-size:1.05rem;font-weight:700}
#tl .eq .box{min-width:92px;min-height:92px;border-radius:22px;background:var(--dh-surface-3);border:2px solid var(--dh-border-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center}
#app-root #tl .eq .box .quran-text{font-size:2.4rem !important;line-height:1.3 !important}
#tl .eq .box small{font-size:.74rem;color:var(--dh-ink-soft);font-weight:700}
#tl .eq .op{font-size:2rem;color:var(--dh-ink-soft)}
#tl .eq .res{background:color-mix(in srgb,var(--gold) 20%,var(--dh-surface-3));border-color:var(--gold);font-size:2.2rem}
#tl .vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#tl .vs .card{text-align:center}
#app-root #tl .vs .card .quran-text{font-size:3rem !important;line-height:1.4 !important;display:block}
#tl .vs .yes{border-color:var(--dh-ok);background:var(--dh-ok-bg)}
#tl .q4{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#tl .q4 button{width:86px;height:86px;border-radius:20px;border:2px solid var(--dh-border-strong);background:var(--dh-surface-3);color:var(--dh-ink);font-size:2.3rem}
#tl .q4 button .quran-text{line-height:1.3 !important}
#tl .q4 button.ok{border-color:var(--dh-ok);background:var(--dh-ok-bg);animation:tlPop .35s}
#tl .q4 button.no{border-color:var(--dh-danger);background:var(--dh-danger-bg);animation:tlShake .4s}
#tl .fb{min-height:1.6em;text-align:center;font-weight:700}
#tl .fb.ok{color:var(--dh-ok)} #tl .fb.no{color:var(--dh-danger)}
@keyframes tlPop{50%{transform:scale(1.12)}}
@keyframes tlShake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* الآيات */
#tl .exs{display:flex;flex-direction:column;gap:12px}
#tl .ex{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--dh-surface-3);border:1.5px solid var(--dh-border);border-radius:20px;padding:12px 16px}
#tl .ex .coin{width:58px;height:58px;font-size:1.6rem;border-width:3px}
#app-root #tl .ex .coin .quran-text{font-size:1.6rem !important;line-height:1 !important;padding-bottom:.2em !important}
#app-root #tl .ayah .quran-text{font-size:clamp(1.55rem,3.6vw + .5rem,2.3rem) !important}
#tl .ayah{font-size:clamp(1.55rem,3.6vw + .5rem,2.3rem);text-align:center;line-height:2.2;color:var(--dh-ink)}
#tl .ayah .waqf{font-size:.7em;color:var(--dh-ink-soft)}
#tl .decor{position:relative;isolation:isolate}
#tl .ayah .w{position:relative;z-index:1}
#tl .hlbox{position:absolute;z-index:0;border-radius:.35em;pointer-events:none}
#tl .hlbox.cause{background:color-mix(in srgb,var(--k,var(--c)) 34%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--k,var(--c)) 80%,transparent)}
#tl .ex-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;border-top:1px dashed var(--dh-border);padding-top:6px;font-size:.85rem;color:var(--dh-ink-soft)}
#app-root #tl .ex-meta .quran-text{font-size:1.05rem !important;line-height:1.6 !important}
#tl .play{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--dh-emerald-600);background:var(--dh-surface-3);color:var(--dh-emerald-700);border-radius:99px;padding:4px 14px;font-weight:700;font-size:.85rem;min-height:38px}
[data-theme="dark"] #tl .play{color:var(--dh-ink)}
#tl .play.on{background:var(--dh-emerald-700);color:var(--dh-on-emerald)}
#tl .why{font-size:.9rem;color:var(--dh-ink)}

/* كيف أنطقها */
#tl .how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
#tl .how li{display:flex;gap:12px;align-items:flex-start;background:var(--dh-surface-3);border:1.5px solid var(--dh-border);border-radius:16px;padding:10px 14px}
#tl .how li .n{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
[data-theme="dark"] #tl .how li .n{color:var(--dh-surface-0)}
#tl .dd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#tl .dd .card{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
#tl .dd .bad{border-color:var(--dh-danger);background:var(--dh-danger-bg)}
#tl .dd .good{border-color:var(--dh-ok);background:var(--dh-ok-bg)}

/* المستويات */
#tl .lv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#tl .lv .card{display:flex;flex-direction:column;gap:6px;padding:0;overflow:hidden}
#tl .lv .card img{display:block;width:100%;height:auto;background:#fbf6e9}
#tl .lv .card div{padding:10px 14px 14px}
#tl .lv .card b{font-size:1rem}
#tl .lv .card small{color:var(--dh-ink-soft);font-size:.86rem;display:block}
#tl .adv{display:inline-flex;gap:6px;align-items:center;background:var(--dh-info-bg);color:var(--dh-info);border-radius:99px;padding:3px 12px;font-size:.8rem;font-weight:700;align-self:flex-start}

/* اللعبة */
#tl .game{display:flex;flex-direction:column;gap:12px;align-items:center}
#tl .score{display:flex;gap:6px}
#tl .score i{width:34px;height:34px;border-radius:50%;background:var(--dh-surface-0);border:2px solid var(--dh-border);display:grid;place-items:center;font-style:normal;font-size:1rem}
#tl .score i.ok{background:var(--gold);border-color:var(--gold)}
#tl .gq{width:100%;background:var(--dh-surface-3);border:1.5px solid var(--dh-border);border-radius:22px;padding:14px 16px;text-align:center}
#tl .tws{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl}
#app-root #tl .tw .quran-text{font-size:clamp(1.5rem,3.4vw + .4rem,2.1rem) !important}
#tl .tw{border:2px solid var(--dh-border-strong);background:var(--dh-surface-1);color:var(--dh-ink);border-radius:16px;padding:2px 14px;font-size:clamp(1.5rem,3.4vw + .4rem,2.1rem);min-height:64px}
#tl .tw .quran-text{line-height:2 !important}
#tl .tw:hover{border-color:var(--c)}
#tl .tw.ok{border-color:var(--dh-ok);background:var(--dh-ok-bg);animation:tlPop .35s}
#tl .tw.no{border-color:var(--dh-danger);background:var(--dh-danger-bg);animation:tlShake .4s}
#tl .gnav{display:flex;gap:10px;justify-content:center}
#tl .win{text-align:center;font-size:1.3rem;font-weight:700}

/* الملخص */
#tl .note{background:var(--dh-surface-3);border:1.5px dashed var(--dh-border-strong);border-radius:20px;padding:16px 18px;white-space:pre-line;font-size:.98rem}
#tl .tb{display:inline-flex;align-items:center;gap:8px;border-radius:14px;padding:10px 20px;font-weight:700;min-height:var(--dh-tap);border:1.5px solid transparent;font-size:.98rem}
#tl .tb.em{background:var(--dh-emerald-700);color:var(--dh-on-emerald);border-color:var(--dh-emerald-700)}
#tl .tb.line{background:var(--dh-surface-3);color:var(--dh-ink);border-color:var(--dh-border-strong)}
#tl .tb.gold{background:linear-gradient(135deg,var(--dh-gold-300),var(--dh-gold-500));color:var(--dh-on-gold)}
#tl .tb[disabled]{opacity:.45;cursor:not-allowed}

/* معرض الدروس القادمة (رسوم الركن الحالية) */
#tl .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
#tl .gal .card{display:flex;flex-direction:column;gap:6px;border-top:5px solid var(--g)}
#tl .gal svg{width:100%;height:auto;--c:var(--g)}
#tl .gal b{font-size:1rem}
#tl .gal small{color:var(--dh-ink-soft);font-size:.86rem}
#tl .vz-block rect{fill:var(--dh-surface-1);stroke:var(--dh-border-strong);stroke-width:3}
#tl .vz-block text{fill:var(--dh-ink)}
#tl .vz-block.cause rect{fill:color-mix(in srgb,var(--c) 18%,var(--dh-surface-3));stroke:var(--c)}
#tl .vz-block.trigger rect{fill:color-mix(in srgb,var(--gold) 22%,var(--dh-surface-3));stroke:var(--gold)}
#tl .vz-block.ghost{opacity:.5} #tl .vz-block.dashed rect{stroke-dasharray:7 6}
#tl .vz-wave,#tl .vz-arrow,#tl .vz-hide,#tl .vz-brace{fill:none;stroke:var(--c);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
#tl .vz-arrow{stroke:var(--dh-ink-soft);stroke-width:3} #tl .vz-hide{stroke-dasharray:5 7;opacity:.6}
#tl .vz-gap{stroke:var(--dh-danger);stroke-width:3;stroke-dasharray:5 6;fill:none;opacity:.55}
#tl .vz-check circle{fill:var(--dh-ok-bg);stroke:var(--dh-ok);stroke-width:2.5} #tl .vz-check path{fill:none;stroke:var(--dh-ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#tl .vz-no circle{fill:var(--dh-danger-bg);stroke:var(--dh-danger);stroke-width:2.5} #tl .vz-no path{stroke:var(--dh-danger);stroke-width:3;stroke-linecap:round}
#tl .vz-dot{fill:var(--gold)} #tl .vz-cap{fill:var(--dh-ink-soft);font-size:15px;font-weight:700}
#tl .vz-ground{stroke:var(--dh-border-strong);stroke-width:4;stroke-linecap:round} #tl .vz-ball{fill:var(--gold)}
#tl .vz-moon{fill:var(--gold)} #tl .vz-sun circle{fill:var(--gold)} #tl .vz-sun path{stroke:var(--gold);stroke-width:4;stroke-linecap:round;fill:none}
#tl .vz-seg{fill:var(--c)} #tl .vz-seg.opt{fill:color-mix(in srgb,var(--c) 35%,var(--dh-surface-3));stroke:var(--c);stroke-width:2;stroke-dasharray:5 4}

/* نصيحة المعلم */
#tl details.tip{background:var(--dh-info-bg);border-radius:16px;padding:10px 14px;font-size:.92rem;color:var(--dh-ink)}
#tl details.tip summary{cursor:pointer;font-weight:700;color:var(--dh-info);list-style:none}
#tl details.tip summary::-webkit-details-marker{display:none}
#tl details.tip p{margin-top:6px}

/* تنقّل الشرائح */
#tl .nav{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--dh-border-soft);padding-top:14px}
#tl .nav .tb.em .arr::after{content:"←"} [dir="ltr"] #tl .nav .tb.em .arr::after{content:"→"}
#tl .nav .tb.line .arr::after{content:"→"} [dir="ltr"] #tl .nav .tb.line .arr::after{content:"←"}
#tl .nav small{color:var(--dh-ink-soft);font-weight:700}

@media(max-width:760px){
  #tl{width:calc(100% - 16px);margin:12px auto 18px;padding:16px 14px 20px;border-radius:22px;font-size:16px}
  #tl .two,#tl .mkh,#tl .dd,#tl .lv,#tl .vs{grid-template-columns:1fr}
  #tl .coin{width:62px;height:62px}
  #app-root #tl .coin .quran-text{font-size:1.8rem !important}
  #tl .ex{grid-template-columns:1fr}
  #tl .ex .coin{justify-self:center}
  #tl .tl-prog button{width:16px} #tl .tl-prog button.cur{width:26px}
  #tl .nav .tb{padding:10px 14px}
}
.pv-bar{position:fixed;inset-inline:0;bottom:0;z-index:3000;background:#2b2100;color:#fbf3d5;font:600 .8rem 'IBM Plex Sans Arabic',sans-serif;padding:8px 14px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.pv-bar a{color:#f3d77a}

const tpl = (k, v) => Object.entries(v).reduce((s, [a, b]) => s.split(`{${a}}`).join(b), L(k));
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const AR_D = '٠١٢٣٤٥٦٧٨٩';
const num = (n) => (S.lang === 'ar' ? String(n).replace(/\d/g, d => AR_D[d]) : String(n));
const tx = (o) => (o ? (o[S.lang] ?? o.ar) : '');
const nl = (s) => esc(s).replace(/\n/g, '<br>');
setLangSource(() => S.lang);

const LETTERS = ['ق', 'ط', 'ب', 'ج', 'د'];
const KV = { 'ق': '--k-q', 'ط': '--k-t', 'ب': '--k-b', 'ج': '--k-j', 'د': '--k-d' };
const MAKH = { 'ق': 'p101_0', 'ط': 'p116_1', 'ب': 'p121_0', 'ج': 'p103_0', 'د': 'p116_0' };
const kvar = (ch) => `--k:var(${KV[ch]})`;
const coin = (ch, attrs = '') => `<span class="coin" style="${kvar(ch)}" ${attrs}><span class="quran-text" lang="ar">${ch}</span></span>`;
const DECK = (n, slug) => `../assets/tajweed/qalqalah/${n}-${slug}.webp`;
const deckFig = (id, n, slug) => `<figure class="deck"><img src="${DECK(n, slug)}" alt="${esc(tx(BOOK_IMAGES[id]))}" loading="lazy"><figcaption>${esc(tx(BOOK_IMAGES[id]))} — ${L('credit_deck')}</figcaption></figure>`;
const tip = (k) => `<details class="tip"><summary>${L('tip')}</summary><p>${esc(L(k))}</p></details>`;
const surahName = (s) => (S.lang === 'ar' ? `<span class="quran-text" lang="ar">${esc(SURAHS[s].ar)}</span>` : esc(SURAHS[s].en));

/* ===== الشرائح ===== */
function s0() {
  return `<span class="kick">✨ ${L('s0_k')}</span>
  <div class="two"><div style="display:flex;flex-direction:column;gap:14px"><h2>${L('s0_t')}</h2><p class="lead muted">${L('s0_s')}</p>
    <div class="chips"><span class="chip">${L('s0_c1')}</span><span class="chip">${L('s0_c2')}</span><span class="chip">${L('s0_c3')}</span><span class="chip">${L('s0_c4')}</span></div>
    <div class="card"><b>${L('s0_g')}</b><ul class="goals" style="margin-top:8px">${['g1', 'g2', 'g3'].map((g, i) => `<li><i>${num(i + 1)}</i><span>${L(g)}</span></li>`).join('')}</ul></div></div>
    ${deckFig('q01', '01', 'intro')}</div>${tip('s0_tip')}`;
}
const bounceSVG = () => `<svg class="bounce" viewBox="0 0 360 220" role="img" aria-label="${esc(L('s1_cap'))}">
  <path class="gr" d="M40 186 H320"/>
  <rect class="blk" x="140" y="120" width="80" height="66" rx="18"/><text class="let quran-text" x="180" y="168" text-anchor="middle" lang="ar">بْ</text>
  <g class="echo"><path d="M118 176 q-20 -16 0 -32"/><path d="M104 182 q-30 -24 0 -46"/><path d="M242 176 q20 -16 0 -32"/><path d="M256 182 q30 -24 0 -46"/></g>
  <g class="ballg" style="transform-box:fill-box;transform-origin:center bottom"><circle class="ball" cx="180" cy="96" r="22"/><circle class="face" cx="173" cy="92" r="2.6"/><circle class="face" cx="187" cy="92" r="2.6"/><path d="M172 101 q8 7 16 0" stroke="#5b3d00" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
</svg>`;
function s1() {
  return `<span class="kick">🏀 ${L('s1_k')}</span><h2>${L('s1_t')}</h2>
  <div class="two"><div style="display:flex;flex-direction:column;gap:12px"><div class="kid"><b class="who">${L('kid_who')}</b><p>${nl(L('s1_kid'))}</p></div>
     <div class="card"><b class="muted" style="font-size:.85rem">${L('s1_def')}</b><p>${esc(tx(RULES.qalqalah.def))}</p></div></div>
    <figure class="card" style="text-align:center">${bounceSVG()}<figcaption class="muted" style="font-size:.88rem">${L('s1_cap')}</figcaption></figure></div>
  ${deckFig('q02', '02', 'meaning')}${tip('s1_tip')}`;
}
function s2() {
  const ch = S.letter, info = L('L')[ch];
  return `<span class="kick">🦸 ${L('s2_k')}</span><h2>${L('s2_t')}</h2><p class="muted">${L('s2_s')}</p>
  <div class="coins" dir="rtl">${LETTERS.map(c => `<button type="button" class="coin" style="${kvar(c)}" data-letter="${c}" aria-pressed="${c === ch}" aria-label="${esc(L('L')[c].n)}"><span class="quran-text" lang="ar">${c}</span></button>`).join('')}</div>
  <p class="mn">${L('s2_mn')} <b class="quran-text" lang="ar">قطب جد</b></p>
  <section class="mkh" style="${kvar(ch)}"><div style="display:flex;flex-direction:column;gap:8px"><span class="big quran-text" lang="ar">${ch}</span><h3>${esc(info.n)}</h3>
      <div class="kid"><b class="who">${L('s2_where')}</b><p>${esc(info.kid)}</p></div><p class="muted" style="font-size:.88rem">${esc(info.ex)}</p></div>
    <figure class="book"><img src="${IMG(MAKH[ch])}" alt="${esc(tx(BOOK_IMAGES[MAKH[ch]]))}"><figcaption>${esc(tx(BOOK_IMAGES[MAKH[ch]]))} — ${L('credit_book')}</figcaption></figure></section>
  <div class="two"><div class="card"><b>${L('s2_why')}</b><p style="margin-top:6px">${esc(L('s2_why_kid'))}</p><p class="muted" style="font-size:.86rem;margin-top:6px">${esc(L('s2_why_t'))}</p></div>${deckFig('q04', '04', 'why')}</div>
  ${tip('s2_tip')}`;
}
const Q4 = [{ s: 'قْ', ok: true }, { s: 'بَ', why: 's3_mv' }, { s: 'دْ', ok: true }, { s: 'مْ', why: 's3_nl' }];
function s3() {
  const found = Q4.filter((q, i) => q.ok && S.q3.has(i)).length;
  const last = S.q3last;
  const fb = found === 2 ? `<p class="fb ok">${L('s3_done')}</p>` : last === null ? '<p class="fb"></p>' : Q4[last].ok ? `<p class="fb ok">${L('s3_ok')}</p>` : `<p class="fb no">${L(Q4[last].why)}</p>`;
  return `<span class="kick">🔑 ${L('s3_k')}</span><h2>${L('s3_t')}</h2><p class="muted">${L('s3_s')}</p>
  <div class="eq" dir="rtl"><span class="box"><span class="quran-text" lang="ar">قطب جد</span><small>${L('s3_a')}</small></span><span class="op">+</span>
    <span class="box"><span class="quran-text" lang="ar">ـْـ</span><small>${L('s3_b')}</small></span><span class="op">=</span><span class="box res">🏀<small>${L('s3_c')}</small></span></div>
  <div class="vs"><div class="card"><span class="quran-text" lang="ar">بَ</span><b>${L('s3_mov')}</b></div><div class="card yes"><span class="quran-text" lang="ar">بْ</span><b>${L('s3_sak')}</b></div></div>
  <div class="card" style="text-align:center"><b>${L('s3_q')}</b>
    <div class="q4" style="margin-top:10px" dir="rtl">${Q4.map((q, i) => `<button type="button" data-q3="${i}" class="${S.q3.has(i) ? (q.ok ? 'ok' : 'no') : ''}"><span class="quran-text" lang="ar">${q.s}</span></button>`).join('')}</div>${fb}</div>
  ${tip('s3_tip')}`;
}
function s4() {
  const exs = lessonExamples('qalqalah');
  return `<span class="kick">📖 ${L('s4_k')}</span><h2>${L('s4_t')}</h2><p class="muted">${L('s4_s')}</p>
  <div class="exs">${exs.map((e, i) => {
    const ch = e.occ[3]; const [s, a] = e.key.split(':').map(Number);
    return `<article class="ex" style="${kvar(ch)}">${coin(ch)}<div>${ayahHTML(e.key, { hl: locate(e.occ, POOL[e.key].w) })}
      <div class="ex-meta"><span>${tpl('from', { s: surahName(s), a: num(a) })} · ${L('reciter')}</span><button type="button" class="play" data-play="${i}" data-s="${s}" data-a="${a}">${L('listen')}</button></div>
      <p class="why">✔ ${esc(tx(whyOf('qalqalah', ch)))}</p></div></article>`;
  }).join('')}</div>${tip('s4_tip')}`;
}
function s5() {
  return `<span class="kick">👄 ${L('s5_k')}</span><h2>${L('s5_t')}</h2>
  <div class="two"><ol class="how">${RULES.qalqalah.how.map((h, i) => `<li><span class="n">${num(i + 1)}</span><p>${esc(tx(h))}</p></li>`).join('')}</ol>
    <figure class="book"><img src="${IMG('p185_0')}" alt="${esc(L('s5_book'))}"><figcaption>${esc(L('s5_book'))} — ${L('credit_book')}</figcaption></figure></div>
  <div class="dd"><div class="card bad"><span>❌</span><div><b>${L('s5_no')}</b><p>${L('s5_n1')}</p><p>${L('s5_n2')}</p></div></div>
    <div class="card good"><span>✅</span><div><b>${L('s5_yes')}</b><p>${L('s5_y1')}</p><p>${L('s5_y2')}</p></div></div></div>${tip('s5_tip')}`;
}
function s6() {
  const c = (n, slug, id, t, d) => `<div class="card"><img src="${DECK(n, slug)}" alt="${esc(tx(BOOK_IMAGES[id]))}" loading="lazy"><div><b>${L(t)}</b><small>${L(d)}</small></div></div>`;
  return `<span class="kick">📏 ${L('s6_k')}</span><h2>${L('s6_t')}</h2><span class="adv">${L('s6_adv')}</span>
  ${deckFig('q05', '05', 'levels')}
  <div class="lv">${c('06', 'minor', 'q06', 's6_1', 's6_1d')}${c('07', 'major', 'q07', 's6_2', 's6_2d')}${c('08', 'shaddah', 'q08', 's6_3', 's6_3d')}</div>${tip('s6_tip')}`;
}
// اللعبة: آيات قصيرة من بنك الركن، والإجابة الصحيحة كل كلمة فيها موضع قلقلة (أي درجة ثقة)
const GAME = ['79:9', '56:75', '51:31', '79:13', '79:4'];
const goodWords = (k) => { const s = new Set(); occsOf(k, 'qalqalah', 1).forEach(o => { for (let w = o[1]; w <= o[2]; w++) s.add(w); }); return s; };
function s7() {
  if (S.g >= GAME.length) {
    const n = S.gScore.filter(Boolean).length;
    return `<span class="kick">🎮 ${L('s7_k')}</span><h2>${L('s7_t')}</h2><div class="game"><div class="score">${GAME.map((_, i) => `<i class="${S.gScore[i] ? 'ok' : ''}">${S.gScore[i] ? '⭐' : '·'}</i>`).join('')}</div>
      <p class="win">${tpl('g_win', { n: num(n), m: num(GAME.length) })}</p><button type="button" class="tb gold" data-g="again">${L('g_again')}</button></div>${tip('s7_tip')}`;
  }
  const k = GAME[S.g]; const good = goodWords(k); const words = POOL[k].w; const [s, a] = k.split(':').map(Number);
  const pick = S.gPick; const done = pick !== null && good.has(pick);
  const occ = occsOf(k, 'qalqalah', 1).find(o => pick !== null && pick >= o[1] && pick <= o[2]);
  const fb = pick === null ? '<p class="fb"></p>' : done ? `<p class="fb ok">${L('g_ok')}${esc(tx(whyOf('qalqalah', occ[3])))}</p>` : `<p class="fb no">${L('g_no')}</p>`;
  return `<span class="kick">🎮 ${L('s7_k')}</span><h2>${L('s7_t')}</h2><p class="muted">${L('s7_s')}</p>
  <div class="game"><div class="score">${GAME.map((_, i) => `<i class="${S.gScore[i] ? 'ok' : ''}">${S.gScore[i] ? '⭐' : num(i + 1)}</i>`).join('')}</div>
    <div class="gq"><div class="tws" lang="ar">${words.map((w, i) => `<button type="button" class="tw ${pick === i ? (good.has(i) ? 'ok' : 'no') : (done && good.has(i) ? 'ok' : '')}" data-w="${i}" ${done ? 'disabled' : ''}><span class="quran-text">${esc(w)}</span></button>`).join('')}</div>
      <p class="muted" style="font-size:.85rem;margin-top:6px">${tpl('from', { s: surahName(s), a: num(a) })}</p></div>
    ${fb}${done ? `<button type="button" class="tb em" data-g="next">${L('g_next')}</button>` : ''}</div>${tip('s7_tip')}`;
}
function s8() {
  return `<span class="kick">🗺 ${L('s8_k')}</span><h2>${L('s8_t')}</h2>
  ${deckFig('q09', '09', 'map')}
  <div class="note" id="msg">${esc(L('s8_msg'))}</div>
  <div><button type="button" class="tb em" data-copy="1">${L('copy')}</button></div>${tip('s8_tip')}`;
}
function s9() {
  const G = L('G'); const HUE = { ghunna: '#6d4ad8', noon_ikhfa: '#0d7a5c', noon_iqlab: '#0d7a5c', noon_idgham_ghunna: '#0d7a5c', lam_shamsi: '#b86a00', madd_tabii: '#0b79b5' };
  return `<span class="kick">🧩 ${L('s9_k')}</span><h2>${L('s9_t')}</h2><p class="muted">${L('s9_s')}</p>
  <div class="gal">${Object.keys(G).map(id => `<div class="card" style="--g:${HUE[id]}">${vizFor(id).replace(/font-size:(\d+)px/g, 'font-size:$1px !important')}<b>${esc(G[id][0])}</b><small>${esc(G[id][1])}</small><small>${esc(tx(VIZ_CAPTION[id]))}</small></div>`).join('')}</div>`;
}
const SLIDES = [s0, s1, s2, s3, s4, s5, s6, s7, s8, s9];

/* ===== الرسم ===== */
const root = document.getElementById('tl');
let audio = null;
function stopAudio() { if (audio) { audio.pause(); audio = null; } root.querySelectorAll('.play.on').forEach(b => { b.classList.remove('on'); b.textContent = L('listen'); }); }
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2400); }
function syncChrome() {
  const h = document.documentElement; h.lang = S.lang; h.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('header-title').textContent = L('header_title');
  document.getElementById('top-student-name').textContent = L('header_sub');
  document.getElementById('hdr-home').textContent = L('h_home');
  document.getElementById('lang-toggle-btn').title = S.lang === 'ar' ? 'English' : 'العربية';
  document.querySelectorAll('#lang-toggle-btn .lb-opt').forEach((e, i) => e.classList.toggle('is-on', (i === 0) === (S.lang === 'ar')));
  document.getElementById('pvBar').innerHTML = `<div>${esc(L('pv_note'))} <a href="tajweed-corner-redesign.html">${L('pv_link')}</a></div>`;
}
function render(top = false) {
  stopAudio(); syncChrome();
  const n = SLIDES.length, i = S.i;
  const head = `<div class="tl-top"><span class="tl-crumb">${L('crumb')}</span><span class="tl-sp"></span>
    <div class="tl-mode" role="group"><button type="button" data-mode="slides" aria-pressed="${S.mode === 'slides'}">${L('m_slides')}</button><button type="button" data-mode="scroll" aria-pressed="${S.mode === 'scroll'}">${L('m_scroll')}</button></div></div>`;
  root.classList.toggle('is-scroll', S.mode === 'scroll');
  if (S.mode === 'scroll') { root.innerHTML = head + SLIDES.map((f, k) => `<section class="sl" id="sl${k}">${f()}</section>`).join(''); }
  else {
    const prog = `<div class="tl-prog" aria-label="${esc(tpl('of', { i: num(i + 1), n: num(n) }))}">${SLIDES.map((_, k) => `<button type="button" data-go="${k}" class="${k < i ? 'done' : k === i ? 'cur' : ''}" aria-label="${k + 1}"></button>`).join('')}</div>`;
    root.innerHTML = `${head}${prog}<section class="sl" id="sl${i}">${SLIDES[i]()}</section>
      <nav class="nav"><button type="button" class="tb line" data-step="-1" ${i === 0 ? 'disabled' : ''}><span class="arr"></span> ${L('prev')}</button><small>${tpl('of', { i: num(i + 1), n: num(n) })}</small>
      ${i === n - 1 ? `<button type="button" class="tb gold" data-step="0">✔ ${L('finish')}</button>` : `<button type="button" class="tb em" data-step="1">${L('next')} <span class="arr"></span></button>`}</nav>`;
  }
  if (top) window.scrollTo({ top: 0 });
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'lang-toggle-btn') { S.lang = S.lang === 'ar' ? 'en' : 'ar'; return render(); }
  if (b.id === 'theme-toggle-btn') { window.DHTheme && window.DHTheme.cycle(); return paintTheme(); }
  if (b.id === 'header-home-btn' || b.id === 'header-account-btn') return toast(L('toast') + b.title);
  const d = b.dataset;
  const keep = (fn) => { const y = window.scrollY; fn(); render(); window.scrollTo({ top: y }); };
  if (d.mode) { S.mode = d.mode; return render(true); }
  if (d.go) { S.i = +d.go; return render(true); }
  if (d.step) { if (+d.step === 0) { S.i = 0; return render(true); } S.i = Math.max(0, Math.min(SLIDES.length - 1, S.i + +d.step)); return render(true); }
  if (d.letter) return keep(() => { S.letter = d.letter; });
  if (d.q3 !== undefined) return keep(() => { S.q3.add(+d.q3); S.q3last = +d.q3; });
  if (d.w !== undefined) return keep(() => { const k = GAME[S.g]; const first = S.gScore[S.g] === undefined; S.gPick = +d.w; if (first) S.gScore[S.g] = goodWords(k).has(+d.w); });
  if (d.g === 'next') return keep(() => { S.g++; S.gPick = null; });
  if (d.g === 'again') return keep(() => { S.g = 0; S.gScore = []; S.gPick = null; });
  if (d.copy) { try { navigator.clipboard.writeText(L('s8_msg')); } catch (_) { /* لا حافظة */ } return toast(L('copied')); }
  if (d.play !== undefined) {
    const on = b.classList.contains('on'); stopAudio(); if (on) return;
    audio = new Audio(ayahAudioUrl(+d.s, +d.a)); b.classList.add('on'); b.textContent = L('stop');
    audio.addEventListener('ended', stopAudio);
    audio.play().catch(() => { stopAudio(); toast(L('hint_audio')); });
  }
});
document.addEventListener('keydown', e => {
  if (S.mode !== 'slides' || e.target.closest('input,textarea')) return;
  const fwd = S.lang === 'ar' ? 'ArrowLeft' : 'ArrowRight', back = S.lang === 'ar' ? 'ArrowRight' : 'ArrowLeft';
  if (e.key === fwd && S.i < SLIDES.length - 1) { S.i++; render(true); } else if (e.key === back && S.i > 0) { S.i--; render(true); }
});

const TI = { auto: '<path d="M12 3a9 9 0 1 0 0 18V3z" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="9"/>', light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', dark: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>' };
function paintTheme() { const p = window.DHTheme ? window.DHTheme.get() : 'auto'; const s = document.querySelector('#theme-toggle-btn svg'); if (s) s.innerHTML = TI[p] || TI.auto; }
document.addEventListener('app-theme-changed', paintTheme);
const startAt = Number(new URLSearchParams(location.search).get('s'));
if (startAt >= 0 && startAt < SLIDES.length) S.i = startAt;
paintTheme(); render(); initDecor(root);
</script>
</body>
</html>
