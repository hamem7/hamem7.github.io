<style>
#app-root #sc-screen{max-width:760px;text-align:start;padding:22px 18px !important;display:flex;flex-direction:column;gap:14px;color:var(--dh-ink)}
#app-root #sc-screen button{font-family:inherit}
#app-root #sc-screen h1{margin:0 !important;font-size:1.6rem !important;font-weight:700 !important;color:var(--dh-emerald-700) !important;text-shadow:none !important;text-align:start;line-height:1.3}
#app-root #sc-screen h1 small{display:block;font-size:.85rem;font-weight:400;color:var(--dh-ink-soft);margin-top:2px}
#app-root #sc-screen h2{margin:0 !important;font-size:1.05rem !important;font-weight:700 !important;color:var(--dh-ink) !important;text-shadow:none !important;text-align:start}
#app-root #sc-screen p{margin:0}

/* تبويبات الشاشات */
.sc-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.sc-tabs button{flex:none;border:1.5px solid var(--dh-border-strong);background:var(--dh-surface-3);color:var(--dh-ink);border-radius:99px;padding:8px 14px;font-weight:700;font-size:.9rem;cursor:pointer;min-height:40px;margin:0;min-width:0;box-shadow:none}
.sc-tabs button.on{background:var(--dh-emerald-700);color:var(--dh-on-emerald);border-color:var(--dh-emerald-700)}

.sc-card{background:var(--dh-surface-3);border:1.5px solid var(--dh-border);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sc-card.accent{border-color:var(--dh-gold-500)}
.sc-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sc-note{font-size:.84rem;color:var(--dh-ink-soft);line-height:1.6}
.sc-lbl{font-size:.82rem;font-weight:700;color:var(--dh-ink-soft)}
#app-root #sc-screen select,#app-root #sc-screen input[type=number]{min-height:44px;border-radius:12px;border:1.5px solid var(--dh-border-strong);background:var(--dh-surface-3);color:var(--dh-ink);padding:6px 10px;font:inherit;margin:0;width:auto;min-width:0;max-width:100%}
#app-root #sc-screen input[type=number]{width:84px;text-align:center}
.sc-btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;min-height:44px;cursor:pointer;margin:0;min-width:0;font-size:.95rem;box-shadow:none;background:var(--dh-emerald-700);color:var(--dh-on-emerald)}
.sc-btn.line{background:var(--dh-surface-3);color:var(--dh-ink);border:1.5px solid var(--dh-border-strong)}
.sc-btn.gold{background:linear-gradient(135deg,var(--dh-gold-300),var(--dh-gold-500));color:var(--dh-on-gold)}
.sc-btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem}
.sc-btn[disabled]{opacity:.45;cursor:not-allowed}

/* خريطة السور 114 */
.sc-map{display:grid;grid-template-columns:repeat(19,minmax(0,1fr));gap:3px;direction:ltr}
.sc-map i{aspect-ratio:1;border-radius:5px;border:1px solid var(--dh-border);background:var(--dh-surface-0);font-style:normal;font-size:.55rem;display:grid;place-items:center;color:var(--dh-ink-soft);position:relative;overflow:hidden}
.sc-map i.m{background:var(--dh-emerald-600);border-color:var(--dh-emerald-700);color:var(--dh-on-emerald)}
.sc-map i.s{background:var(--dh-gold-500);border-color:var(--dh-gold-500);color:var(--dh-on-gold)}
.sc-map i.p{border-color:var(--dh-gold-500)}
.sc-map i.p::before{content:"";position:absolute;inset:0;background:var(--dh-gold-500);width:var(--w);inset-inline-start:0}
.sc-map i.p span{position:relative}
.sc-map i.mp::after{content:"";position:absolute;inset:0;background:var(--dh-emerald-600);width:var(--w2)}
.sc-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--dh-ink-soft)}
.sc-legend b{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-inline-end:4px;border:1px solid var(--dh-border)}
.sc-legend .m{background:var(--dh-emerald-600)}.sc-legend .s{background:var(--dh-gold-500)}.sc-legend .e{background:var(--dh-surface-0)}

/* مقاطع متفرقة */
.sc-seg{border:1.5px solid var(--dh-border-strong);border-radius:14px;padding:10px;background:var(--dh-surface-0);display:flex;flex-direction:column;gap:8px}
.sc-seg .sc-sum{font-weight:700;font-size:.92rem}
.sc-tag{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:700;background:var(--dh-info-bg);color:var(--dh-info)}
.sc-tag.warn{background:var(--dh-warn-bg);color:var(--dh-warn)}.sc-tag.ok{background:var(--dh-ok-bg);color:var(--dh-ok)}.sc-tag.gold{background:var(--dh-gold-500);color:var(--dh-on-gold)}.sc-tag.em{background:var(--dh-emerald-700);color:var(--dh-on-emerald)}
.sc-x{border:0;background:var(--dh-danger-bg);color:var(--dh-danger);border-radius:10px;width:36px;height:36px;cursor:pointer;margin:0;min-width:0;font-size:1rem;padding:0;box-shadow:none}

/* شبكة الشارات */
.sc-chips{display:flex;flex-wrap:wrap;gap:6px}
.sc-chip{border:1.5px solid var(--dh-border-strong);background:var(--dh-surface-3);color:var(--dh-ink);border-radius:99px;padding:6px 12px;font-size:.85rem;font-weight:600;cursor:pointer;min-height:36px;margin:0;min-width:0;box-shadow:none}
.sc-chip.on{background:var(--dh-gold-500);color:var(--dh-on-gold);border-color:var(--dh-gold-500)}
.sc-chip.main{background:var(--dh-emerald-700);color:var(--dh-on-emerald);border-color:var(--dh-emerald-700)}
.sc-chip.lock{opacity:.55;cursor:not-allowed;background:var(--dh-surface-0);border-style:dashed}
.sc-chip.part{border-color:var(--dh-gold-500)}
.sc-search{width:100%}
.sc-grp{max-height:240px;overflow:auto;padding:2px}
details.sc-d{border:1.5px solid var(--dh-border);border-radius:14px;padding:8px 10px;background:var(--dh-surface-0)}
details.sc-d>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.sc-d>summary::-webkit-details-marker{display:none}

/* ملخص */
.sc-sumbox{background:linear-gradient(135deg,var(--dh-emerald-700),var(--dh-emerald-600));color:var(--dh-on-emerald);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.sc-sumbox b{font-size:1.05rem;line-height:1.5}.sc-sumbox small{opacity:.9}
.sc-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sc-num{background:var(--dh-surface-0);border:1.5px solid var(--dh-border);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}
.sc-num b{font-size:1.3rem}.sc-num span{font-size:.78rem;color:var(--dh-ink-soft)}

/* الألعاب */
.sc-seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sc-seg3 button{border:1.5px solid var(--dh-border-strong);background:var(--dh-surface-3);color:var(--dh-ink);border-radius:12px;padding:10px 6px;font-weight:700;font-size:.88rem;cursor:pointer;margin:0;min-width:0;box-shadow:none;line-height:1.35}
.sc-seg3 button.on{background:var(--dh-emerald-700);color:var(--dh-on-emerald);border-color:var(--dh-emerald-700)}
.sc-q{display:flex;gap:10px;align-items:center;background:var(--dh-ok-bg);color:var(--dh-ok);border-radius:14px;padding:10px 12px;font-weight:700}

/* أين تُضاف */
.sc-where{display:flex;gap:12px;align-items:flex-start}
.sc-where .n{width:34px;height:34px;border-radius:50%;background:var(--dh-emerald-700);color:var(--dh-on-emerald);display:grid;place-items:center;font-weight:700;flex:none}
.sc-where.new .n{background:var(--dh-gold-500);color:var(--dh-on-gold)}
.sc-where b{display:block}

/* مسارات (ملف الطالب) */
.sc-track{display:flex;gap:10px;align-items:center;border:1.5px solid var(--dh-border);border-radius:14px;padding:10px;background:var(--dh-surface-0)}
.sc-track .bar{flex:1;height:8px;border-radius:99px;background:var(--dh-surface-2,var(--dh-border));overflow:hidden}
.sc-track .bar i{display:block;height:100%;background:var(--dh-emerald-600)}
.sc-track.g .bar i{background:var(--dh-gold-500)}
.sc-track .tx{flex:1;min-width:0}.sc-track .tx b{display:block;font-size:.92rem}.sc-track .tx small{color:var(--dh-ink-soft)}

.pv-bar{position:fixed;inset-inline:0;bottom:0;z-index:3000;background:#2b2100;color:#fbf3d5;font:600 .8rem 'IBM Plex Sans Arabic',sans-serif;padding:8px 14px;text-align:center}
.pv-toast{position:fixed;bottom:60px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#06231c;color:#fff;border-radius:99px;padding:10px 20px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:3001}
.pv-toast.on{opacity:1}
body{padding-bottom:70px}
#app-root .screen.active,#app-root #sc-screen{animation:none !important;opacity:1 !important;transform:none !important}
@media(max-width:480px){#app-root #sc-screen{padding:14px 10px !important}.sc-map{grid-template-columns:repeat(12,minmax(0,1fr))}.sc-nums{grid-template-columns:1fr 1fr 1fr}}
</style>

/* ============ المنطق: طرح المسار المتصل ثم دمج المتبقي ============ */
function mainIv(){return [idx(S.main.to,1),idx(S.main.from,AY[S.main.from-1])]}   // يس←الناس بترتيب المصحف
function segIv(g){const a=idx(g.f.s,g.f.a),b=idx(g.t.s,g.t.a);return a<=b?[a,b]:[b,a]}
function cover(){
  const c=new Uint8Array(TOTAL);                       // 1 متصل، 2 متفرق
  const [m0,m1]=mainIv();for(let i=m0;i<=m1;i++)c[i]=1;
  S.segs.forEach(g=>{const [a,b]=segIv(g);for(let i=a;i<=b;i++)if(!c[i])c[i]=2});
  return c;
}
function surahOf(i){let s=1;while(s<114&&START[s+1]<=i)s++;return s}
function stats(c){
  let mem=0,scat=0;const per=[];
  for(let s=1;s<=114;s++){let m=0,x=0;for(let i=START[s];i<START[s]+AY[s-1];i++){if(c[i]===1)m++;else if(c[i]===2)x++}
    per[s]={m,x,n:AY[s-1]};mem+=m;scat+=x}
  return {per,mem,scat};
}
function ranges(c){                                    // المتفرق بعد الطرح والدمج (نطاقات متتالية بترتيب المصحف)
  const out=[];let st=-1;
  for(let i=0;i<=TOTAL;i++){const on=i<TOTAL&&c[i]===2;
    if(on&&st<0)st=i;if(!on&&st>=0){out.push([st,i-1]);st=-1}}
  return out;
}
const pos=i=>{const s=surahOf(i);return {s,a:i-START[s]+1}};
function rangeText(r){const a=pos(r[0]),b=pos(r[1]);
  const full=(p,first)=>first?p.a===1:p.a===AY[p.s-1];
  if(a.s===b.s){return full(a,1)&&full(b,0)?sName(a.s):`${sName(a.s)} (${a.a}–${b.a})`}
  const A=full(a,1)?sName(a.s):`${sName(a.s)} ${ayah()} ${a.a}`,B=full(b,0)?sName(b.s):`${sName(b.s)} ${ayah()} ${b.a}`;
  return `${A} ← ${B}`;
}
const cnt=r=>r[1]-r[0]+1;
const surahsIn=r=>{const a=pos(r[0]).s,b=pos(r[1]).s;return b-a+1};

/* ============ واجهات ============ */
function selOpts(v,mx){let h='';for(let n=1;n<=114;n++)if(n!==1)h+=`<option value="${n}"${n===v?' selected':''}>${n}. ${esc(sName(n))}</option>`;return h}
function mapHtml(c,st){
  let h='';for(let s=1;s<=114;s++){const p=st.per[s],n=p.n;
    let cls='',style='';const w=Math.round(p.x/n*100),w2=Math.round(p.m/n*100);
    if(p.m===n)cls='m';else if(p.x===n)cls='s';
    else if(p.x>0&&p.m>0){cls='p mp';style=`--w:${w}%;--w2:${w2}%`}
    else if(p.x>0){cls='p';style=`--w:${w}%`}
    else if(p.m>0){cls='m p mp';style=`--w2:${w2}%`}
    h+=`<i class="${cls}" style="${style}" title="${esc(sName(s))}"><span>${s}</span></i>`}
  return `<div class="sc-map">${h}</div><div class="sc-legend"><span><b class="m"></b>${L('lg_m')}</span><span><b class="s"></b>${L('lg_s')}</span><span><b class="e"></b>${L('lg_e')}</span></div>`;
}
function summaryHtml(){
  const c=cover(),st=stats(c),rs=ranges(c);
  const mSur=S.main.from-S.main.to+1;
  const scSur=rs.reduce((a,r)=>a+surahsIn(r),0);
  const tot=st.mem+st.scat,pct=(tot/TOTAL*100).toFixed(1);
  return {c,st,rs,html:`
  <div class="sc-sumbox"><small>${L('q_ex')}</small>
   <b>${L('sum_main')}: ${esc(sName(S.main.from))} ← ${esc(sName(S.main.to))} (${mSur} ${L('n_surah')})</b>
   <b>${L('sum_scat')}: ${rs.length?rs.map(r=>esc(rangeText(r))).join(' ، '):'—'}</b></div>
  <div class="sc-nums"><div class="sc-num"><b>${fmt(tot)}</b><span>${L('n_ayah')}</span></div><div class="sc-num"><b>${mSur+scSur}</b><span>${L('n_surah')}</span></div><div class="sc-num"><b>${pct}%</b><span>${L('n_pct')}</span></div></div>`};
}
function segRow(g){
  const [a,b]=segIv(g),m=mainIv();
  const ov=!(b<m[0]||a>m[1]);

    <span class="sc-lbl">${L('seg_to')}</span>
    <select data-k="ts" data-id="${g.id}">${selOpts(g.t.s)}</select>
    <input type="number" min="1" max="${AY[g.t.s-1]}" value="${g.t.a}" data-k="ta" data-id="${g.id}" aria-label="${L('seg_ayah')}">
    <button class="sc-x" data-del="${g.id}" aria-label="x">✕</button></div>
   <div class="sc-row"><span class="sc-sum">${esc(rangeText(r))}</span>
    <span class="sc-tag gold">${fmt(cnt(r))} ${L('n_ayah')}</span>${sameWhole?`<span class="sc-tag ok">${L('whole')}</span>`:''}
    ${ov?`<span class="sc-tag warn">⚠️ ${L('overlap')}</span>`:''}</div></div>`;
}
function chipsHtml(c,st){
  const q=S.q.trim().toLowerCase();let h='';
  for(let s=2;s<=114;s++){
    const nm=sName(s);if(q&&!nm.toLowerCase().includes(q)&&String(s)!==q)continue;
    const p=st.per[s],full=p.m===p.n,xfull=p.x===p.n;
    const cls=full?'sc-chip lock main':xfull?'sc-chip on':p.x>0?'sc-chip part':'sc-chip';
    h+=`<button class="${cls}" data-chip="${s}"${full?' disabled':''}>${full?'🔒 ':''}${esc(nm)}</button>`}
  return h;
}
function presets(list){list.forEach(s=>{if(s===1)return;const c=cover();for(let i=START[s];i<START[s]+AY[s-1];i++)if(c[i]===0){S.segs.push({id:S.nid++,f:{s,a:1},t:{s,a:AY[s-1]}});break}})}

/* ألعاب: عناصر قابلة للاختيار = المتصل (مطويّ) + كل سورة فيها مقطع متفرق */
function scatSurahs(c){const st=stats(c),o=[];for(let s=2;s<=114;s++){const p=st.per[s];if(p.x>0)o.push({s,x:p.x,n:p.n})}return o}
function games(){
  const c=cover(),G=S.g,sc=scatSurahs(c),mainList=[];
  for(let s=S.main.from;s>=S.main.to;s--)if(s!==1)mainList.push(s);
  let pool=0,desc='';
  const m=G.mode;
  if(m==='all'){pool=stats(c).mem+stats(c).scat;desc=`${mainList.length+sc.length} ${L('g_surahs')}`}
  else if(m==='pick'){const arr=[...G.picked];arr.forEach(s=>{const p=stats(c).per[s];pool+=p.m+p.x});desc=arr.length?`${arr.length} ${L('g_surahs')}`:L('g_none')}
  else{const p=G.part;pool=Math.max(0,p.b-p.a+1);desc=`${sName(p.s)} (${p.a}–${p.b})`}
  const chipBtn=(s,tag)=>`<button class="sc-chip${G.mode==='pick'&&G.picked.has(s)||G.mode==='part'&&G.part.s===s?' on':''}${tag==='sc'?' part':''}" data-gs="${s}">${esc(sName(s))}${tag==='sc'&&c?` <small>(${stats(c).per[s].x===AY[s-1]?AY[s-1]:stats(c).per[s].x+'/'+AY[s-1]})</small>`:''}</button>`;
  const partUI=m==='part'?`<div class="sc-card"><p class="sc-note">${L('g_pick_one')}</p>
   <div class="sc-row"><b>${esc(sName(G.part.s))}</b><span class="sc-lbl">${L('g_range')}</span>
   <input type="number" min="1" max="${AY[G.part.s-1]}" value="${G.part.a}" data-gp="a"><span>–</span><input type="number" min="1" max="${AY[G.part.s-1]}" value="${G.part.b}" data-gp="b"></div></div>`:'';
  const lists=m==='all'?'':`
   <details class="sc-d" open><summary>${L('g_grp_scat')} <span class="sc-tag gold">${sc.length}</span></summary>
    <div class="sc-chips" style="margin-top:8px">${sc.map(o=>chipBtn(o.s,'sc')).join('')||'—'}</div></details>
   <details class="sc-d"><summary>${L('g_grp_main')} <span class="sc-tag em">${mainList.length}</span>
    ${m==='pick'?`<button class="sc-btn line sm" data-gmain="1">${L('g_sel_all')}</button>`:''}</summary>
    <div class="sc-chips sc-grp" style="margin-top:8px">${mainList.map(s=>chipBtn(s,'m')).join('')}</div></details>`;
  return `<h1>${L('g_h')}<small>${L('stu')} · ${L('g_s')}</small></h1>
  <div class="sc-seg3"><button class="${m==='all'?'on':''}" data-gm="all">${L('g_all')}</button><button class="${m==='pick'?'on':''}" data-gm="pick">${L('g_pick')}</button><button class="${m==='part'?'on':''}" data-gm="part">${L('g_part')}</button></div>
  ${lists}${partUI}
  <div class="sc-q">🎯 ${L('g_count')}: ${fmt(pool)} ${L('n_ayah')} · ${esc(desc)}</div>
  <button class="sc-btn gold" data-toast="g_play" ${pool?'':'disabled'}>${L('g_play')}</button>`;
}

  root.innerHTML=`<div class="screen active"><div class="login-container" id="sc-screen">
   <div class="sc-tabs">${tabs.map(t=>`<button class="${S.tab===t?'on':''}" data-tab="${t}">${L('t_'+t)}</button>`).join('')}</div>${body}</div></div>`;
  if(keep!==null){const q=document.getElementById('q');if(q){q.focus();q.setSelectionRange(keep,keep)}}
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
const PRE={fri:[18,32,36,67],amma:Array.from({length:37},(_,i)=>78+i),zah:[2,3],mus:[57,59,61,62,64,87]};
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='lang-toggle-btn'){S.lang=S.lang==='ar'?'en':'ar';return render()}
  if(t.id==='theme-toggle-btn'){window.DHTheme&&window.DHTheme.cycle();return paintTheme()}
  if(t.id==='header-home-btn'||t.id==='header-account-btn')return toast(t.title);
  if(t.dataset.tab){S.tab=t.dataset.tab;window.scrollTo(0,0);return render()}
  if(t.id==='addSeg'){S.segs.push({id:S.nid++,f:{s:18,a:1},t:{s:18,a:AY[17]}});return render()}
  if(t.dataset.del){S.segs=S.segs.filter(g=>g.id!=t.dataset.del);return render()}
  if(t.dataset.pre){presets(PRE[t.dataset.pre]);return render()}
  if(t.dataset.chip){const s=+t.dataset.chip,hit=S.segs.find(g=>g.f.s===s&&g.t.s===s&&g.f.a===1&&g.t.a===AY[s-1]);
    const c=cover(),p=stats(c).per[s];
    if(hit)S.segs=S.segs.filter(g=>g!==hit);else if(p.x>0)return toast(L('in_seg'));else S.segs.push({id:S.nid++,f:{s,a:1},t:{s,a:AY[s-1]}});return render()}
  if(t.dataset.save)return toast(L('saved'));
  if(t.dataset.cancel)return toast('—');
  if(t.dataset.rec!==undefined){S.recOn=+t.dataset.rec;return render()}
  if(t.dataset.toast)return toast(t.dataset.toast==='saved'?L('saved'):'▶ …');
  if(t.dataset.gm){S.g.mode=t.dataset.gm;return render()}
  if(t.dataset.gmain){for(let s=S.main.from;s>=S.main.to;s--)if(s!==1)S.g.picked.add(s);return render()}
  if(t.dataset.gs){const s=+t.dataset.gs;if(S.g.mode==='pick'){S.g.picked.has(s)?S.g.picked.delete(s):S.g.picked.add(s)}
    else{S.g.part={s,a:1,b:AY[s-1]}}return render()}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='mf'){S.main.from=+el.value;if(S.main.to>S.main.from)S.main.to=S.main.from;S.main.frontier=AY[S.main.to-1];return render()}
  if(el.id==='mt'){S.main.to=+el.value;if(S.main.to>S.main.from)S.main.from=S.main.to;S.main.frontier=Math.min(S.main.frontier,AY[S.main.to-1]);return render()}
  if(el.dataset.k){const g=S.segs.find(x=>x.id==el.dataset.id),k=el.dataset.k,v=+el.value;
    if(k==='fs'){g.f.s=v;g.f.a=1}else if(k==='ts'){g.t.s=v;g.t.a=AY[v-1]}
    else if(k==='fa')g.f.a=Math.max(1,Math.min(AY[g.f.s-1],v||1));else g.t.a=Math.max(1,Math.min(AY[g.t.s-1],v||1));return render()}
  if(el.dataset.gp){const p=S.g.part;p[el.dataset.gp]=Math.max(1,Math.min(AY[p.s-1],+el.value||1));if(p.a>p.b)[p.a,p.b]=[p.b,p.a];return render()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;render()}});
const TI={auto:'<path d="M12 3a9 9 0 1 0 0 18V3z" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="9"/>',light:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',dark:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'};
function paintTheme(){const p=window.DHTheme?window.DHTheme.get():'auto';const s=document.querySelector('#theme-toggle-btn svg');if(s)s.innerHTML=TI[p]||TI.auto}
document.addEventListener('app-theme-changed',paintTheme);
paintTheme();render();
</script>
</body>
