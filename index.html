    <meta name="theme-color" content="#064e3b">
    <!-- 🌟 [2026-10-03 — سرعة الفتح] شاشة إقلاع بهوية المنصة الجديدة: أثناء تجهيز قواعد البيانات (قبل أول شاشة) كان يظهر
         تدرّج adult-theme الأزرق القديم والترويسة القديمة فيبدو كأن المنصة القديمة فُتحت. الكلاس dh-booting على <html>
         (لا على <body> لأن switchTheme تستبدل className الـ body كاملاً) يُزال في core/navigation.js بعد أول شاشة أو عند
         فشل الإقلاع، ومؤقّت احتياطي أسفل الصفحة يزيله بعد 15 ثانية مهما حدث حتى لا تبقى الترويسة مخفية أبداً. -->
    <style>
        html.dh-booting body { background: linear-gradient(165deg, #06231c 0%, #0b3d30 45%, #0d5c46 100%) !important; background-attachment: fixed !important; }
        html.dh-booting:not(.dh-boot-slow) #main-header { display: none !important; }
        .dh-boot-note { font-size: .9rem; opacity: 0; transition: opacity .4s; max-width: 280px; text-align: center; line-height: 1.7; }
        html.dh-boot-note-on .dh-boot-note { opacity: .8; }
        .dh-boot-loader { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #fffdf6; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; }
        /* 🌟 [2026-10-03] شعار المنصة بدل المربع الذهبي النابض: يُرسم من core/brandLogo.js وتعمل فيه الافتتاحية (مرة في الجلسة)،
           وبعدها توهّج هادئ خلفه ما دام التحميل مستمراً */
        .dh-boot-logo { position: relative; width: 132px; aspect-ratio: 253 / 352; }
        .dh-boot-logo::before { content: ""; position: absolute; inset: -10% -25%; border-radius: 50%; background: radial-gradient(closest-side, rgba(240,216,120,.32), transparent); animation: dh-boot-glow 3.2s ease-in-out infinite; pointer-events: none; }
        .dh-boot-name { font-size: 1.15rem; font-weight: 700; letter-spacing: .5px; opacity: .92; }
        @keyframes dh-boot-glow { 0%, 100% { opacity: .35; transform: scale(.92); } 50% { opacity: .9; transform: scale(1.04); } }
        @media (prefers-reduced-motion: reduce) { .dh-boot-logo::before { animation: none; } }
    </style>
    <!-- 🌟 [جديد 2026-10-03] حفظ حدث beforeinstallprompt مبكراً (Chrome/Edge على الحاسوب): يُطلَق مرة واحدة غالباً قبل تحميل
         components/guidedTour.js (يُستورد ديناميكياً)، فنحفظه هنا ليستعمله زر «تثبيت» في خطوة التثبيت بالجولة الإرشادية.
         لا preventDefault عمداً: حتى لا يتغير سلوك المتصفح الافتراضي (شريط التثبيت المصغّر على أندرويد). -->
    <script>
        window.addEventListener('beforeinstallprompt', function (e) { window.__dhInstallPrompt = e; });
        window.addEventListener('appinstalled', function () { window.__dhInstallPrompt = null; window.__dhAppInstalled = true; });
    </script>

    <link rel="stylesheet" href="css/teacherAuthGate.css">
    <!-- 🌟🌟 [جديد] Google Identity Services — لعرض زر "تسجيل الدخول بجوجل" في بوابة نظام الواجبات
         (راجع components/teacherAuthGate.js وcore/api.js). سكربت رسمي من جوجل، لا يحتاج مفتاحاً
         سرياً (Client ID علني بطبيعته)، ولا يُستخدم أو يظهر في أي شاشة أخرى في المنصة إلا عند فتح
         بوابة نظام الواجبات صراحة. async حتى لا يؤخر عرض الصفحة لأي زائر/طالب لا يحتاجه أبداً. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <link rel="stylesheet" href="css/mobile.css">

    <!-- 🌟🌟 [جديد] تحليلات خصوصية بسيطة عبر GoatCounter (مجاني بالكامل، مفتوح المصدر،
         بدون أي إعلانات وبدون بصمة متصفح Fingerprinting) — لا تُخزَّن أي بيانات شخصية
         (طلاب/معلم)، ولوحة النتائج خاصة تماماً (خارج المنصة) على
         https://dar-ham.goatcounter.com فقط. لو غيّرت حساب GoatCounter لاحقاً، بدّل
         الكود "dar-ham" في data-goatcounter أدناه بالكود الجديد.
         no_onload:true يوقف الإرسال الأوتوماتيكي لأول تحميل، لأن هذه المنصة SPA بالكامل
         (راجع core/navigation.js + core/analytics.js) — كل تغيير شاشة يُرسَل يدوياً بدلاً
         من ذلك حتى تُحسب كل الشاشات لا فقط أول تحميل لـ index.html 🌟🌟 -->
    <script>
        window.goatcounter = { no_onload: true };
    </script>
    <script data-goatcounter="https://dar-ham.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>

<body class="adult-theme" id="main-body">
    <canvas id="confetti"></canvas>
    <div id="toast-encouragement"></div>

    <!-- 🌟 شاشة "الجديد في هذا التحديث" — عنصر ثابت خارج #app-root (زي الكونفيتي والتوست
         بالضبط) حتى يفضل موجود بغض النظر عن الشاشة الحالية. core/app.js (دالة checkForUpdates)
         هو اللي يتحكم في إظهارها بمقارنة رقم الإصدار في core/version.js مع آخر رقم شافه
         المعلم على هذا الجهاز. مخفية افتراضياً بـ display:none ولا تظهر إلا لو فيه تحديثات

    <div class="whats-new-modal" id="whats-new-modal" style="display:none;">
        <div class="whats-new-modal-box">
            <h3 data-i18n="whats_new_title">✨ الجديد في هذا التحديث</h3>

            <div class="whats-new-modal-actions">
                <button type="button" class="btn" id="whats-new-close" data-i18n="whats_new_close_btn">تمام، فهمت 👍</button>
            </div>
        </div>
    </div>

    <!-- 🌟 [جديد] نافذة "تذكير شهري بالنسخة الاحتياطية" — نفس نمط whats-new-modal أعلاه
         بالضبط (عنصر ثابت خارج #app-root، مخفي افتراضياً بـ display:none)، وتستخدم نفس
         كلاسات whats-new-modal/whats-new-modal-box البصرية حرفياً لتوحيد الهوية بلا أي
         CSS جديد مكرَّر. core/app.js (checkMonthlyBackupReminder) هو المتحكم الوحيد في
         إظهارها (مرة واحدة تلقائياً عند أول دخول كل شهر جديد على هذا الجهاز)، وcore/backupRestore.js
         هو المسؤول عن التصدير الفعلي عند الضغط على "نزّل النسخة الآن" 🌟 -->
    <div class="whats-new-modal" id="backup-reminder-modal" style="display:none;">
        <div class="whats-new-modal-box">
            <h3 data-i18n="backup_reminder_title">🗄️ تذكير شهري بالنسخة الاحتياطية</h3>
            <p style="text-align:right; color:var(--dh-ink); line-height:1.6; margin-bottom:6px;" data-i18n="backup_reminder_body">مرّ شهر منذ آخر مرة أخذت فيها نسخة احتياطية من بيانات طلابك. يُفضَّل تنزيل نسخة جديدة الآن والاحتفاظ بها على جهازك للطوارئ.</p>
            <div class="whats-new-modal-actions dh-backup-reminder-actions">
                <button type="button" class="btn" id="backup-reminder-download-btn" data-i18n="backup_reminder_download_btn">⬇️ نزّل النسخة الآن</button>
                <button type="button" class="btn btn-outline" id="backup-reminder-later-btn" data-i18n="backup_reminder_later_btn">لاحقاً</button>
            </div>
        </div>
    </div>

    <!-- 🌟 [جديد] "بطاقة الترحيب بالطالب" — عنصر ثابت خارج #app-root (بنفس نمط بطاقة
         التلميحات وwhats-new-modal والكونفيتي والتوست أعلاه)، وهذا مقصود تماماً: البطاقة

        <div class="dh-boot-loader" role="status" aria-label="جاري التحميل">
            <div class="dh-boot-logo" data-ham-logo="full" data-ham-tone="light" data-ham-play="intro" aria-hidden="true"></div>

    <!-- 🌟 [2026-10-03] شعار المنصة: سكربت عادي صغير يُنفَّذ هنا فوراً فيظهر الشعار في الإقلاع والترويسة قبل core/app.js،
         ويملأ تلقائياً أي [data-ham-logo] في الشاشات التي تُحقن لاحقاً — راجع core/brandLogo.js -->
    <script src="core/brandLogo.js"></script>
    <!-- 🌟 مؤقّتات احتياطية: بعد 5 ثوانٍ تظهر عبارة توضيحية (غالباً أول تشغيل وتنزيل المصحف)، وبعد 15 ثانية تظهر الترويسة
         مهما حدث (dh-boot-slow) — مع إبقاء خلفية الهوية الجديدة حتى أول شاشة، فلا يعود الشكل القديم أثناء تنزيل المصحف الطويل -->
    <script>
        setTimeout(function () { document.documentElement.classList.add('dh-boot-note-on'); }, 5000);
        setTimeout(function () { document.documentElement.classList.add('dh-boot-slow'); }, 15000);
    </script>

    <!-- ⚠️ [مؤقت للتجربة المحلية فقط] راجع دليل-تفعيل-App-Check.md قسم "للتجربة المحلية
         قبل النشر" — بما إن App Check (reCAPTCHA v3) بقى مفعّل فعليًا في core/firebase.js،
         والتجربة المحلية بتحصل من سيرفر محلي (زي 127.0.0.1:5500 أو localhost) وهو دومين غير
         مسجّل عند reCAPTCHA، السطر ده بيخلي المتصفح يطبع "Debug Token" في الـ Console بدل ما
         يحاول يتحقق فعليًا من reCAPTCHA — تسجيل هذا الـ Token (مرة واحدة فقط) في Firebase
         Console (App Check → Manage debug tokens) هو ما يسمح للتجربة المحلية تعمل حتى بعد
         تفعيل Enforce.
         🌟 [تعديل] كان السطر ده بيتفعّل دايمًا بغض النظر عن الدومين، فكان لازم نفتكر نمسحه
         يدويًا قبل كل رفع للمستودع المنشور (وده معرّض للنسيان). دلوقتي اتحط جوه شرط بيتأكد
         إن الصفحة شغالة فعليًا على localhost/127.0.0.1 بس قبل ما يفعّل وضع الـ Debug Token —
         فلو اتفتح على أي دومين تاني (زي hamem7.github.io بعد الرفع)، السطر ده يتجاهل نفسه
         تلقائيًا وبأمان تام، وreCAPTCHA الحقيقي هو اللي يشتغل عادي من غير أي تدخل يدوي. -->
    <script>
        if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
            self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
        }
    </script>

    <script type="module" src="core/app.js"></script>

    <!-- 🌟 [تجربة بطلب المعلم بتاريخ 2026-09-14] أعدنا تفعيل كود تسجيل Service Worker الطبيعي
         (كان معطّلاً مؤقتاً أثناء التطوير بسبب مشكلة تحميل نسخ قديمة من الملفات — راجع تاريخ الملف
         في Git/النسخ الاحتياطية لو احتجت ترجع للكود المؤقت القديم اللي كان بيلغي تسجيل SW ويمسح
         الكاش عند كل فتح للصفحة). تم رفع رقم CACHE_NAME في service-worker.js من v1 إلى v2 في نفس
         هذا التعديل حتى يجبر أي متصفح فتح النسخة القديمة على تحميل كل الملفات من جديد بدل الكاش.
         ⚠️ هذه تجربة: لو ظهرت نفس مشكلة "نسخة قديمة من الملفات" تاني أثناء التطوير المستمر، ارجع
         لتعطيل التسجيل مؤقتاً (بنفس أسلوب الكود القديم: getRegistrations + reg.unregister +
         caches.delete لكل الأسماء) وارفع رقم الكاش كل مرة تعمل فيها تعديل جوهري في الملفات. -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                .then(registration => {
                    console.log('تم تسجيل ServiceWorker بنجاح للمسار: ', registration.scope);
                })
                .catch(err => {
                    console.log('فشل تسجيل ServiceWorker: ', err);
                });
            });
        }
    </script>
