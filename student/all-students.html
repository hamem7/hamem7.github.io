<!-- student/all-students.html -->
<!-- 🌟 [عدّل 2026-10-03] تبسيط الشاشة بطلب صاحب المنصة ("كلهم حلوين بس زحمة، عايز السهولة"):
     الجدول ذو التسعة أعمدة صار قائمة هادئة داخل لوحة بيضاء: لكل طالب صورته واسمه وصفه وعمره
     ونقاطه، وزر واحد بارز "تقييم"، وزر ⋯ يجمع التعديل/الإخفاء/الحذف، وسطر "أخطاء للعلاج" يظهر
     فقط عند وجود أخطاء. الطلاب المخفيون مجمّعون أسفل القائمة، وأزرار التصدير/الاستيراد/الرجوع
     في أعلى الصفحة. نفس المعرّفات وأسماء الأصناف (btn-edit/btn-hide/...) التي يعتمد عليها
     setupAllStudentsListeners في student.js. اللوحة بخلفية بيضاء ثابتة لتبقى مقروءة فوق خلفية
     الكبار الداكنة وخلفية الأطفال الفاتحة معاً 🌟 -->
<style>
    #app-root .as-btn-primary {
        background: linear-gradient(135deg, var(--dh-gold-300), var(--dh-gold-500)) !important;
        color: var(--dh-emerald-900) !important;
        border: none !important;
        box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3) !important;
    }
    #app-root .as-btn-primary:hover { box-shadow: 0 14px 26px rgba(212, 175, 55, 0.4) !important; }

    #app-root .as-btn-secondary {
        background: #fff !important;
        color: var(--dh-emerald-700) !important;
        border: 2px solid var(--dh-emerald-600) !important;
        box-shadow: none !important;
    }
    #app-root .as-btn-secondary:hover { background: var(--dh-surface-alt) !important; }

    /* 🌟 [جديد 2026-10-01] وسم الحقول: "مطلوب" للاسم فقط و"اختياري" لباقي الحقول في نافذة التعديل */
    #edit-modal .dh-opt-tag { font-size: 0.85rem; font-weight: normal; color: #94a3b8; }
    #edit-modal .dh-req-tag { color: #b45309; font-weight: bold; }

    #app-root .as-panel { max-width: 780px; margin: 0 auto; background: #fff; color: #10261f; border-radius: 20px; padding: 20px; box-shadow: 0 16px 40px rgba(0,0,0,0.18); text-align: right; display: grid; gap: 14px; }
    #app-root .as-toplinks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
    #app-root .as-link { background: none; border: none; padding: 4px 2px; color: #5d7269; font-family: inherit; font-size: 0.95rem; cursor: pointer; margin: 0; min-width: unset; box-shadow: none; }
    /* mobile.css يصغّر #btn-back-login كزر رجوع عام؛ هنا هو رابط ضمن صف الروابط العلوية فيأخذ نفس شكلها */
    body #app-root .as-panel .as-toplinks #btn-back-login.as-link { margin: 0 !important; padding: 4px 2px !important; font-size: 0.95rem !important; min-height: unset; }
    #app-root .as-link:hover { color: var(--dh-emerald-700); text-decoration: underline; }
    #app-root .as-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    #app-root .as-head h1 { margin: 0; font-size: 1.7rem; color: #10261f; text-align: right; }
    #app-root .as-count { display: block; font-size: 0.95rem; font-weight: normal; color: #6b7f77; }
    #app-root .as-head .as-btn-primary { padding: 10px 18px; font-size: 1.05rem; min-width: unset; margin: 0; }
    #app-root .as-search { width: 100%; box-sizing: border-box; border: 1px solid #dbe5e0; background: #f7faf9; color: #10261f; border-radius: 12px; padding: 12px 14px; font-family: inherit; font-size: 1rem; }

    #app-root .as-list { border: 1px solid #e1e9e5; border-radius: 16px; }
    #app-root .as-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
    #app-root .as-row + .as-row { border-top: 1px solid #e1e9e5; }
    #app-root .as-row.as-hidden-row { opacity: 0.6; }
    #app-root .as-avatar { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; overflow: hidden; color: #fff; font-size: 1.25rem; font-weight: bold; }
    #app-root .as-avatar img { width: 100%; height: 100%; object-fit: cover; }
    #app-root .as-info { flex: 1; min-width: 0; display: grid; justify-items: start; }
    #app-root .as-info .btn-prof-link { background: none; border: none; padding: 0; color: #10261f; font-family: inherit; font-weight: bold; font-size: 1.1rem; cursor: pointer; text-align: right; }
    #app-root .as-info .btn-prof-link:hover { color: var(--dh-emerald-700); text-decoration: underline; }
    #app-root .as-sub { color: #6b7f77; font-size: 0.88rem; }
    #app-root .as-info .btn-weakness { background: none !important; border: none !important; box-shadow: none !important; padding: 0 !important; margin: 0; min-width: unset; color: #b45309 !important; font-family: inherit; font-size: 0.88rem; cursor: pointer; }

    #app-root .as-menu-wrap { position: relative; }

    #app-root .as-more:hover, #app-root .as-menu-wrap.open .as-more { background: #edf3f0; color: #10261f; }
    #app-root .as-menu { display: none; position: absolute; top: 44px; left: 0; z-index: 20; background: #fff; border: 1px solid #e1e9e5; border-radius: 12px; box-shadow: 0 12px 28px rgba(0,0,0,0.18); padding: 6px; min-width: 190px; }
    #app-root .as-menu-wrap.open .as-menu { display: grid; }
    #app-root .as-menu button { background: none !important; border: none !important; box-shadow: none !important; color: #10261f !important; text-align: right; padding: 10px 12px !important; margin: 0 !important; border-radius: 8px; font-family: inherit; font-size: 1rem !important; min-width: unset !important; cursor: pointer; }
    #app-root .as-menu button:hover { background: #edf3f0 !important; }
    #app-root .as-menu .btn-delete { color: #b91c1c !important; }

    #app-root .as-hidden-box summary { cursor: pointer; color: #6b7f77; padding: 6px 2px; }
    #app-root .as-hidden-box .as-list { margin-top: 8px; }
    #app-root .as-empty { text-align: center; color: #6b7f77; padding: 24px; }

    @media (max-width: 520px) {
        #app-root .as-panel { padding: 14px; border-radius: 16px; }
        #app-root .as-head h1 { font-size: 1.35rem; }
        #app-root .as-row { flex-wrap: wrap; }
        #app-root .as-info { flex-basis: calc(100% - 60px); }
        #app-root .as-pts { flex: 1; margin-right: 58px; }
        #app-root .as-go { min-height: 44px; }
        #app-root .as-more { width: 44px; height: 44px; }
    }
</style>

<div class="screen active">
    <div class="as-panel">
        <div class="as-toplinks">
            <button class="as-link" id="btn-back-login" data-i18n="btn_back_to_my_students">🔙 رجوع لطلابي</button>
            <button class="as-link" id="btn-export-backup" data-i18n="backup_export_students_btn">📥 تصدير الطلاب فقط</button>
            <button class="as-link" id="btn-import-backup-trigger" data-i18n="backup_import_students_btn">📤 استيراد الطلاب</button>
            <input type="file" id="importFile" accept=".json" style="display:none;">
        </div>
        <div class="as-head">
            <h1><span data-i18n="as_page_title">📊 السجل العام لبيانات وإنجازات الطلاب</span><span class="as-count" id="as-count"></span></h1>
            <!-- يفتح شاشة "طلابي" ثم يُطلق نافذة "إضافة طالب جديد" الموجودة هناك (راجع setupAllStudentsListeners) -->
            <button class="btn as-btn-primary" id="btn-add-champion-shortcut" data-i18n="btn_add_student">تسجيل طالب جديد ➕</button>
        </div>
        <input type="search" class="as-search" id="as-search" data-i18n-placeholder="as_search_ph" placeholder="🔎 ابحث عن طالب...">
        <div id="all-students-body"></div>
    </div>
</div>

<!-- نافذة تعديل بيانات الطالب -->
<div id="edit-modal" class="modal-overlay">
    <div class="modal-content">
        <h2 style="margin-top:0; font-size: 2.2rem;" data-i18n="as_edit_title">تعديل بيانات الطالب</h2>
        <input type="hidden" id="edit-stu-id">
        <div class="form-grid">
            <div class="input-group"><label><span data-i18n="name_full">الاسم (ثلاثي):</span> <span class="dh-opt-tag dh-req-tag" data-i18n="stu_required_tag">(مطلوب)</span></label><input type="text" id="edit-stu-name" data-i18n-placeholder="name_ph" placeholder="اسم الطالب..."></div>
            <div class="input-group"><label><span data-i18n="dob">تاريخ الميلاد:</span> <span class="dh-opt-tag" data-i18n="stu_optional_tag">(اختياري)</span> <span id="edit-age-display" style="font-size:0.9rem;"></span></label><input type="date" id="edit-stu-dob"></div>
            <!-- 🌟 [عدّل] نفس تعديل قائمة الصف في student/my-students.html بالحرف: تفصيل
            المرحلتين الإعدادية والثانوية لصفوف فردية 1/2/3 بدل خيار مجمَّع واحد لكل
            منهما، و"خريج" صارت "خريج جامعي" — راجع تعليق my-students.html للتفاصيل 🌟 -->
            <div class="input-group"><label><span data-i18n="grade">الصف الدراسي:</span> <span class="dh-opt-tag" data-i18n="stu_optional_tag">(اختياري)</span></label><select id="edit-stu-grade"><option value="" data-i18n="stu_not_set">غير محدد</option><option value="التمهيدي" data-i18n="التمهيدي">التمهيدي</option><option value="الأول الابتدائي" data-i18n="الأول الابتدائي">الأول الابتدائي</option><option value="الثاني الابتدائي" data-i18n="الثاني الابتدائي">الثاني الابتدائي</option><option value="الثالث الابتدائي" data-i18n="الثالث الابتدائي">الثالث الابتدائي</option><option value="الرابع الابتدائي" data-i18n="الرابع الابتدائي">الرابع الابتدائي</option><option value="الخامس الابتدائي" data-i18n="الخامس الابتدائي">الخامس الابتدائي</option><option value="السادس الابتدائي" data-i18n="السادس الابتدائي">السادس الابتدائي</option><option value="الأول الإعدادي" data-i18n="الأول الإعدادي">الأول الإعدادي</option><option value="الثاني الإعدادي" data-i18n="الثاني الإعدادي">الثاني الإعدادي</option><option value="الثالث الإعدادي" data-i18n="الثالث الإعدادي">الثالث الإعدادي</option><option value="الأول الثانوي" data-i18n="الأول الثانوي">الأول الثانوي</option><option value="الثاني الثانوي" data-i18n="الثاني الثانوي">الثاني الثانوي</option><option value="الثالث الثانوي" data-i18n="الثالث الثانوي">الثالث الثانوي</option><option value="المرحلة الجامعية" data-i18n="المرحلة الجامعية">المرحلة الجامعية</option><option value="خريج جامعي" data-i18n="خريج جامعي">خريج جامعي</option></select></div>
            <div class="input-group"><label><span data-i18n="country">البلد:</span> <span class="dh-opt-tag" data-i18n="stu_optional_tag">(اختياري)</span></label><input type="text" id="edit-stu-country" data-i18n-placeholder="country_ph" placeholder="مثال: مصر، السعودية..."></div>
            <div class="input-group"><label data-i18n="as_parent_phone">رقم ولي الأمر (اختياري):</label><input type="text" id="edit-stu-phone" data-i18n-placeholder="phone_ph" placeholder="لإرسال التقارير..."></div>
            <div class="input-group"><label data-i18n="as_gender_label">الجنس (للصورة الرمزية):</label><select id="edit-stu-gender"><option value="boy" data-i18n="as_gender_boy">👦🏻 ولد</option><option value="girl" data-i18n="as_gender_girl">👧🏻 بنت</option></select></div>
            <div class="input-group" style="grid-column: span 2;"><label><span data-i18n="as_memo_label">مقدار الحفظ (من سورة - إلى سورة):</span> <span class="dh-opt-tag" data-i18n="stu_optional_tag">(اختياري)</span></label><div style="display:flex; gap:10px;"><select id="edit-stu-memo-from"></select><select id="edit-stu-memo-to"></select></div></div>
            <div class="input-group" style="grid-column: span 2;"><label data-i18n="as_photo_label">صورة شخصية (اختياري):</label><input type="file" id="edit-stu-avatar" accept="image/*"></div>
        </div>
        <button class="btn as-btn-primary" style="width: 100%; margin-top:15px; padding: 15px; font-size: 1.3rem;" id="btn-save-edited-student" data-i18n="as_save_edits">حفظ التعديلات ✔️</button>
        <button class="btn btn-outline as-btn-secondary" style="width: 100%; margin-top:10px; padding: 15px; font-size: 1.3rem;" id="btn-close-edit-modal" data-i18n="cancel">إلغاء</button>
    </div>
</div>
