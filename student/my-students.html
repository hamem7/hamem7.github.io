<!-- student/my-students.html -->
<style>
    input::-webkit-calendar-picker-indicator { display: none !important; }

    #add-modal .modal-content { background: white !important; border: none !important; border-radius: 20px !important; box-shadow: 0 10px 30px rgba(0,0,0,0.1) !important; color: #1e293b !important; }
    #add-modal input, #add-modal select { border: 2px solid #cbd5e1 !important; border-radius: 10px !important; padding: 12px !important; background: #f8fafc !important; color: #1e293b !important; box-shadow: none !important; }
    #add-modal label { color: #475569 !important; font-weight: bold !important; margin-bottom: 5px !important; display: block !important; }
    /* 🌟 [جديد 2026-10-01] وسم الحقول: "مطلوب" للاسم فقط و"اختياري" لباقي الحقول (الاسم وحده إلزامي فعلاً) */
    #add-modal .dh-opt-tag { font-size: 0.85rem !important; font-weight: normal !important; color: #94a3b8 !important; }
    #add-modal .dh-req-tag { color: #b45309 !important; font-weight: bold !important; }
    .avatar-opt { font-size: 2.8rem; cursor: pointer; padding: 5px; border-radius: 50%; border: 3px solid transparent; transition: 0.3s; user-select: none; }
    .avatar-opt.active { border-color: #10b981; background: #f1f5f9; transform: scale(1.1); }
    /* 🌟 [2026-10-03] «طلابي» بالتصميم الجديد (المقترح ①). المحدِّدات تبدأ بـ #app-root #ms-screen عمداً: قواعد عامة
       في kids.css/adults.css/mobile.css تفرض لون/ظل/حجم كل h1/h2 داخل .login-container بـ !important. */
    #app-root #ms-screen { max-width: 560px; text-align: start; padding: 22px 20px !important; display: flex; flex-direction: column; gap: 20px; color: #10241c; }
    #app-root #ms-screen .ms-head { display: flex; align-items: center; gap: 10px; }
    #app-root #ms-screen .ms-back { width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; border: 1px solid #e4dfcc; background: #fff; color: #0d5c46; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
    #app-root #ms-screen .ms-back:hover { background: #eaf4ef; }
    [dir="ltr"] #ms-screen .ms-back svg, html[lang="en"] #ms-screen .ms-back svg { transform: scaleX(-1); }
    #app-root #ms-screen .ms-title { margin: 0 !important; font-size: 1.9rem !important; font-weight: 700 !important; color: #0d5c46 !important; text-shadow: none !important; line-height: 1.3; }
    #app-root #ms-screen .ms-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    #app-root #ms-screen .ms-stat { background: #fff; border: 1px solid #e4dfcc; border-radius: 16px; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    #app-root #ms-screen .ms-stat-primary { background: #0d5c46; border-color: #0d5c46; }
    #app-root #ms-screen .ms-stat-num { font-size: 1.5rem; font-weight: 700; line-height: 1.2; color: #10241c; }
    #app-root #ms-screen .ms-stat-num.is-alert { color: #b45309; }
    #app-root #ms-screen .ms-stat-num.is-ok { color: #166534; }
    #app-root #ms-screen .ms-stat-of { font-size: .95rem; font-weight: 500; color: #4a6058; }
    #app-root #ms-screen .ms-stat-label { font-size: .82rem; color: #4a6058; line-height: 1.4; }
    #app-root #ms-screen .ms-stat-primary .ms-stat-num { color: #fff; }
    #app-root #ms-screen .ms-stat-primary .ms-stat-label { color: #d7efe6; }
    #app-root #ms-screen .ms-section { display: flex; flex-direction: column; gap: 10px; }
    #app-root #ms-screen .ms-section-title { margin: 0 !important; font-size: .95rem !important; font-weight: 600 !important; color: #4a6058 !important; text-shadow: none !important; line-height: 1.5; }
    #app-root #ms-screen .ms-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    #app-root #ms-screen .ms-card { position: relative; text-align: start; font-family: inherit; cursor: pointer; background: #fff; color: #10241c; border: 1px solid #e4dfcc; border-radius: 20px; padding: 16px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 150px; transition: transform .15s, box-shadow .15s; }
    #app-root #ms-screen .ms-card:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(6, 35, 28, .12); }
    #app-root #ms-screen .ms-card:focus-visible, #app-root #ms-screen .ms-back:focus-visible, #app-root #ms-screen .ms-reminder-btn:focus-visible { outline: 3px solid #d4af37; outline-offset: 2px; }
    #app-root #ms-screen .ms-card-primary { background: #0d5c46; color: #fff; border-color: #0d5c46; }
    #app-root #ms-screen .ms-card-icon { width: 44px; height: 44px; border-radius: 14px; background: #eaf4ef; color: #0d5c46; display: flex; align-items: center; justify-content: center; margin-bottom: 2px; }
    #app-root #ms-screen .ms-card-primary .ms-card-icon { background: rgba(255, 255, 255, .14); color: #fff; }
    #app-root #ms-screen .ms-card-icon-gold { background: #fbf3dc; color: #8a6a10; }
    #app-root #ms-screen .ms-card-title { font-size: 1.05rem; font-weight: 700; line-height: 1.4; }
    #app-root #ms-screen .ms-card-desc { font-size: .82rem; color: #4a6058; line-height: 1.5; }
    #app-root #ms-screen .ms-card-primary .ms-card-desc { color: #d7efe6; }
    #app-root #ms-screen .ms-badge { position: absolute; top: 14px; inset-inline-end: 12px; font-size: .75rem; font-weight: 700; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
    #app-root #ms-screen .ms-badge[hidden], #app-root #ms-screen .ms-reminder[hidden] { display: none; }
    #app-root #ms-screen .ms-badge-alert { background: #b45309; color: #fff; }
    #app-root #ms-screen .ms-badge-soft { background: #fbf3dc; color: #6b5310; }
    #app-root #ms-screen .ms-reminder { background: #f6f3e8; border-radius: 16px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
    #app-root #ms-screen .ms-reminder-dot { width: 10px; height: 10px; border-radius: 50%; background: #b45309; flex-shrink: 0; }
    #app-root #ms-screen .ms-reminder-text { font-size: .9rem; line-height: 1.6; flex-grow: 1; }
    #app-root #ms-screen .ms-reminder-btn { font-family: inherit; font-size: .9rem; font-weight: 700; color: #0d5c46; background: none; border: none; cursor: pointer; padding: 8px 4px; min-height: 40px; white-space: nowrap; }
    @media (max-width: 380px) {
        #app-root #ms-screen .ms-card { min-height: 136px; padding: 14px 12px; }
        #app-root #ms-screen .ms-stat-num { font-size: 1.3rem; }
    }
</style>

<!-- 🌟 [إعادة تصميم 2026-10-03 — «المقترح ①» الذي اختاره المعلم] بدل أربعة أزرار متساوية + زر عودة كبير:
     شريط أرقام (عدد الطلاب / بانتظار الحفظ / تقارير الشهر)، ثم قسمان ببطاقات: «الطلاب» و«المتابعة الشهرية»،
     مع شارات تنبيه وسطر تذكير. نفس معرّفات الأزرار القديمة بالضبط (btn-all-students، btn-add-student،
     btn-monthly-memo-bulk، btn-monthly-reports-hub، btn-back-my-students) فلا يتغير أي مستمع أو اختصار يضغطها.
     الأرقام تُملأ من setupMyStudentsListeners → refreshMyStudentsSummary في student/student.js. -->
<div class="screen active">
    <div class="login-container" id="ms-screen">
        <div class="ms-head">
            <button type="button" class="ms-back" id="btn-back-my-students">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
            <h1 class="ms-title" data-i18n="my_students_title">طلابي</h1>
        </div>

        <div class="ms-stats" id="ms-stats">
            <div class="ms-stat ms-stat-primary">
                <span class="ms-stat-num" id="ms-stat-students">—</span>
                <span class="ms-stat-label" data-i18n="ms_stat_students">عدد الطلاب</span>
            </div>
            <div class="ms-stat">
                <span class="ms-stat-num" id="ms-stat-memo">—</span>
                <span class="ms-stat-label" data-i18n="ms_stat_memo">بانتظار الحفظ</span>
            </div>
            <div class="ms-stat">
                <span class="ms-stat-num"><span id="ms-stat-reports">—</span><span class="ms-stat-of" id="ms-stat-reports-of"></span></span>
                <span class="ms-stat-label" id="ms-stat-reports-label" data-i18n="ms_stat_reports_generic">تقارير صُدِّرت</span>
            </div>
        </div>

        <section class="ms-section">
            <h2 class="ms-section-title" data-i18n="ms_section_students">الطلاب</h2>
            <div class="ms-grid">
                <button type="button" class="ms-card ms-card-primary" id="btn-all-students">
                    <span class="ms-card-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="3.2"/><path d="M2.5 20c1-4 3.6-6 6.5-6s5.5 2 6.5 6"/><circle cx="17.5" cy="8" r="2.6"/></svg></span>
                    <span class="ms-card-title" data-i18n="ms_card_all_title">سجل الطلاب</span>
                    <span class="ms-card-desc" data-i18n="ms_card_all_desc">افتح ملف أي طالب أو عدّل بياناته</span>
                </button>
                <button type="button" class="ms-card" id="btn-add-student">
                    <span class="ms-card-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="3.2"/><path d="M2.5 20c1-4 3.6-6 6.5-6s5.5 2 6.5 6"/><line x1="19" y1="7" x2="19" y2="13"/><line x1="22" y1="10" x2="16" y2="10"/></svg></span>
                    <span class="ms-card-title" data-i18n="ms_card_add_title">طالب جديد</span>
                    <span class="ms-card-desc" data-i18n="ms_card_add_desc">الاسم فقط مطلوب</span>
                </button>
            </div>
        </section>

        <section class="ms-section">
            <h2 class="ms-section-title" id="ms-section-monthly" data-i18n="ms_section_monthly_generic">المتابعة الشهرية</h2>
            <div class="ms-grid">
                <button type="button" class="ms-card" id="btn-monthly-memo-bulk">
                    <span class="ms-badge ms-badge-alert" id="ms-badge-memo" hidden></span>
                    <span class="ms-card-icon ms-card-icon-gold"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg></span>
                    <span class="ms-card-title" data-i18n="ms_card_memo_title">الحفظ الشهري</span>
                    <span class="ms-card-desc" data-i18n="ms_card_memo_desc">أين توقف كل طالب هذا الشهر؟</span>
                </button>
                <button type="button" class="ms-card" id="btn-monthly-reports-hub">
                    <span class="ms-badge ms-badge-soft" id="ms-badge-reports" hidden></span>
                    <span class="ms-card-icon ms-card-icon-gold"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2.5v3M16 2.5v3M4 9.5h16M8 14h3M8 17h6"/></svg></span>
                    <span class="ms-card-title" data-i18n="ms_card_reports_title">تقارير الشهر</span>
                    <span class="ms-card-desc" data-i18n="ms_card_reports_desc">واتساب لولي الأمر أو PDF</span>
                </button>
            </div>
        </section>

        <div class="ms-reminder" id="ms-reminder" hidden>
            <span class="ms-reminder-dot" aria-hidden="true"></span>
            <span class="ms-reminder-text" id="ms-reminder-text"></span>
            <button type="button" class="ms-reminder-btn" id="ms-reminder-btn" data-i18n="ms_reminder_start">ابدأ الآن</button>
        </div>
    </div>
</div>

<div id="add-modal" class="modal-overlay">
    <div class="modal-content">
        <h2 style="margin-top:0; font-size: 2.2rem; text-align:center; color:#1e3a5f!important;" data-i18n="add_new_champion">إضافة طالب جديد</h2>
        <div class="form-grid" style="text-align: right;">
            <div class="input-group"><label><span data-i18n="name_full">الاسم (ثلاثي):</span> <span class="dh-opt-tag dh-req-tag" data-i18n="stu_required_tag">(مطلوب)</span></label><input type="text" id="stu-name" data-i18n-placeholder="name_ph" placeholder="اسم الطالب..."></div>
            <div class="input-group"><label><span data-i18n="dob">تاريخ الميلاد:</span> <span class="dh-opt-tag" data-i18n="stu_optional_tag">(اختياري)</span> <span id="age-display" style="font-size:0.9rem; color:#10b981;"></span></label><input type="date" id="stu-dob"></div>
            <!-- 🌟 [عدّل] كانت المرحلتان الإعدادية والثانوية خيارًا واحدًا مجمَّعًا لكل منهما،
            فصرنا الآن نفصّلهما لصفوف فردية (الأول/الثاني/الثالث) بنفس أسلوب تسمية صفوف
            الابتدائي أعلاه بالحرف، حتى يغطي الصف صفوف 1 إلى 12 دراسيًا كاملة. المرحلة
            الجامعية بقيت كما هي، و"خريج" أصبحت "خريج جامعي" (نفس الطلب صراحة) 🌟 -->
            <div class="input-group"><label><span data-i18n="grade">الصف الدراسي:</span> <span class="dh-opt-tag" data-i18n="stu_optional_tag">(اختياري)</span></label><select id="stu-grade"><option value="" data-i18n="stu_not_set">غير محدد</option><option value="التمهيدي" data-i18n="التمهيدي">التمهيدي</option><option value="الأول الابتدائي" data-i18n="الأول الابتدائي">الأول الابتدائي</option><option value="الثاني الابتدائي" data-i18n="الثاني الابتدائي">الثاني الابتدائي</option><option value="الثالث الابتدائي" data-i18n="الثالث الابتدائي">الثالث الابتدائي</option><option value="الرابع الابتدائي" data-i18n="الرابع الابتدائي">الرابع الابتدائي</option><option value="الخامس الابتدائي" data-i18n="الخامس الابتدائي">الخامس الابتدائي</option><option value="السادس الابتدائي" data-i18n="السادس الابتدائي">السادس الابتدائي</option><option value="الأول الإعدادي" data-i18n="الأول الإعدادي">الأول الإعدادي</option><option value="الثاني الإعدادي" data-i18n="الثاني الإعدادي">الثاني الإعدادي</option><option value="الثالث الإعدادي" data-i18n="الثالث الإعدادي">الثالث الإعدادي</option><option value="الأول الثانوي" data-i18n="الأول الثانوي">الأول الثانوي</option><option value="الثاني الثانوي" data-i18n="الثاني الثانوي">الثاني الثانوي</option><option value="الثالث الثانوي" data-i18n="الثالث الثانوي">الثالث الثانوي</option><option value="المرحلة الجامعية" data-i18n="المرحلة الجامعية">المرحلة الجامعية</option><option value="خريج جامعي" data-i18n="خريج جامعي">خريج جامعي</option></select></div>
            <div class="input-group"><label><span data-i18n="country">البلد:</span> <span class="dh-opt-tag" data-i18n="stu_optional_tag">(اختياري)</span></label><input type="text" id="stu-country" data-i18n-placeholder="country_ph" placeholder="مثال: مصر، السعودية..."></div>
            <div class="input-group" style="grid-column: span 2;"><label data-i18n="parent_phone">رقم ولي الأمر (اختياري للواتساب):</label><input type="text" id="stu-phone" data-i18n-placeholder="phone_ph" placeholder="لإرسال التقارير..."></div>
            <div class="input-group" style="grid-column: span 2;"><label><span data-i18n="memo_amount">مقدار الحفظ (من سورة - إلى سورة):</span> <span class="dh-opt-tag" data-i18n="stu_optional_tag">(اختياري)</span></label><div style="display:flex; gap:10px;"><select id="stu-memo-from"></select><select id="stu-memo-to"></select></div></div>

            <div class="input-group" style="grid-column: span 2; background: rgba(0,0,0,0.02); padding: 15px; border-radius: 10px; border: 1px dashed #cbd5e1;">
                <label style="text-align:center;" data-i18n="choose_avatar">اختر أفاتار للبطل:</label>
                <div style="display:flex; justify-content:center; gap:15px; flex-wrap:wrap; margin-bottom: 15px;" id="avatar-gallery">
                    <div class="avatar-opt active" data-av="👦🏻">👦🏻</div>
                    <div class="avatar-opt" data-av="👨🏻‍🦱">👨🏻‍🦱</div>
                    <div class="avatar-opt" data-av="👲🏻">👲🏻</div>
                    <div class="avatar-opt" data-av="👧🏻">👧🏻</div>
                    <div class="avatar-opt" data-av="👩🏻">👩🏻</div>
                    <div class="avatar-opt" data-av="🧕🏻">🧕🏻</div>
                </div>
                <input type="hidden" id="selected-avatar" value="👦🏻">
                <label style="text-align:center;" data-i18n="upload_photo">أو ارفع صورة شخصية حقيقية:</label>
                <input type="file" id="stu-avatar" accept="image/*" style="width: 100%;">
            </div>
        </div>
        <button class="btn" style="width: 100%; margin-top:15px; padding: 15px; font-size: 1.3rem; background:#10b981; border:none;" id="btn-save-new-student" data-i18n="save_champ">حفظ بيانات الطالب ✔️</button>
        <button class="btn btn-outline" style="width: 100%; margin-top:10px; padding: 15px; font-size: 1.3rem;" id="btn-close-add-modal" data-i18n="cancel">إلغاء</button>
    </div>
</div>
