<!-- 🌟 [عدّل 2026-10-03] نافذة "إضافة طالب جديد" بنموذج الخطوات الذي اختاره صاحب المنصة (بعد تجربة النموذج السريع):
     3 خطوات قصيرة مع مؤشر أعلاها — ① الاسم والصورة ② الصف وتاريخ الميلاد ③ ولي الأمر والحفظ والبلد + بطاقة معاينة.
     الاسم وحده مطلوب، و"تخطَّ واحفظ الآن" متاح من الخطوة الثانية. تاريخ الميلاد 3 قوائم (يوم/شهر/سنة) تكتب في
     #stu-dob المخفي بصيغة YYYY-MM-DD (خانة type=date كانت تُظهر «قنس/رهش/موي» على الأجهزة العربية).
     نفس معرّفات الحقول القديمة (stu-name/stu-grade/...) فلا يتغير الحفظ؛ التنقل بين الخطوات في student.js 🌟 -->
<div id="add-modal" class="modal-overlay">
    <div class="modal-content as-add">
        <h2 class="as-add-title" data-i18n="add_new_champion">إضافة طالب جديد</h2>
        <div class="as-steps" aria-hidden="true">
            <span class="as-dot" data-dot="1">1</span><span class="as-dot-bar"></span>
            <span class="as-dot" data-dot="2">2</span><span class="as-dot-bar"></span>
            <span class="as-dot" data-dot="3">3</span>
        </div>
        <p class="as-step-title" id="add-step-title"></p>
        <div class="as-add-toast" id="add-saved-toast" style="display:none;"></div>

        <!-- ① الاسم والصورة -->
        <div class="as-step" data-step="1">
            <div class="as-add-field as-add-name">
                <label for="stu-name"><span data-i18n="name_full">الاسم (ثلاثي):</span> <span class="dh-opt-tag dh-req-tag" data-i18n="stu_required_tag">(مطلوب)</span></label>
                <input type="text" id="stu-name" data-i18n-placeholder="name_ph" placeholder="اسم الطالب..." autocomplete="off">
                <span class="as-add-warn" id="add-name-warn" style="display:none;"></span>
            </div>
            <div class="as-add-field">
                <label data-i18n="add_choose_photo">اختر صورة:</label>
                <div class="as-add-avatars" id="avatar-gallery">
                    <button type="button" class="avatar-opt active" data-av="👦🏻">👦🏻</button>
                    <button type="button" class="avatar-opt" data-av="👨🏻‍🦱">👨🏻‍🦱</button>
                    <button type="button" class="avatar-opt" data-av="👲🏻">👲🏻</button>
                    <button type="button" class="avatar-opt" data-av="👧🏻">👧🏻</button>
                    <button type="button" class="avatar-opt" data-av="👩🏻">👩🏻</button>
                    <button type="button" class="avatar-opt" data-av="🧕🏻">🧕🏻</button>
                    <button type="button" class="avatar-opt avatar-upload" id="btn-avatar-upload" data-i18n-title="upload_photo_title" title="رفع صورة حقيقية">📷</button>
                </div>
            </div>
            <input type="hidden" id="selected-avatar" value="👦🏻">
            <input type="file" id="stu-avatar" accept="image/*" style="display:none;">
        </div>

        <!-- ② الصف وتاريخ الميلاد -->
        <div class="as-step" data-step="2">
