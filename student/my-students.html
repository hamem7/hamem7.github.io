<!-- student/my-students.html -->
<style>
    input::-webkit-calendar-picker-indicator { display: none !important; }

    #add-modal .modal-content { background: white !important; border: none !important; border-radius: 20px !important; box-shadow: 0 10px 30px rgba(0,0,0,0.1) !important; color: #1e293b !important; }
    #add-modal input, #add-modal select { border: 2px solid #cbd5e1 !important; border-radius: 10px !important; padding: 12px !important; background: #f8fafc !important; color: #1e293b !important; box-shadow: none !important; }
    #add-modal label { color: #475569 !important; font-weight: bold !important; margin-bottom: 5px !important; display: block !important; }
    .avatar-opt { font-size: 2.8rem; cursor: pointer; padding: 5px; border-radius: 50%; border: 3px solid transparent; transition: 0.3s; user-select: none; }
    .avatar-opt.active { border-color: #10b981; background: #f1f5f9; transform: scale(1.1); }
</style>

<div class="screen active">
    <div class="login-container">
        <h1 class="splash-title" style="font-size:2.5rem; margin-bottom:20px;" data-i18n="my_students_title">طلابي</h1>
        <h2 style="font-size: 1.6rem; margin-bottom: 25px;" data-i18n="my_students_subtitle">إدارة سجلات الطلاب</h2>

        <div style="display: flex; flex-direction: column; gap: 15px;">
            <button class="btn" style="width: 100%; font-size: 1.3rem;" id="btn-all-students" data-i18n="btn_all_students">📊 سجل الطلاب العام</button>
            <button class="btn btn-outline" style="width: 100%; font-size: 1.3rem;" id="btn-add-student" data-i18n="btn_add_student">تسجيل بطل جديد ➕</button>
        </div>

        <button class="btn btn-outline" style="width: 100%; margin-top:20px; background:#64748b !important; border:none; color:white!important;" id="btn-back-my-students" data-i18n="btn_back">🔙 العودة للقائمة الرئيسية</button>
    </div>
</div>

<div id="add-modal" class="modal-overlay">
    <div class="modal-content">
        <h2 style="margin-top:0; font-size: 2.2rem; text-align:center; color:#1e3a5f!important;" data-i18n="add_new_champion">إضافة بطل جديد</h2>
        <div class="form-grid" style="text-align: right;">
            <div class="input-group"><label data-i18n="name_full">الاسم (ثلاثي):</label><input type="text" id="stu-name" data-i18n-placeholder="name_ph" placeholder="اسم الطالب..."></div>
            <div class="input-group"><label><span data-i18n="dob">تاريخ الميلاد:</span> <span id="age-display" style="font-size:0.9rem; color:#10b981;"></span></label><input type="date" id="stu-dob"></div>
            <div class="input-group"><label data-i18n="grade">الصف الدراسي:</label><select id="stu-grade"><option>التمهيدي</option><option>الأول الابتدائي</option><option>الثاني الابتدائي</option><option>الثالث الابتدائي</option><option>الرابع الابتدائي</option><option>الخامس الابتدائي</option><option>السادس الابتدائي</option><option>المرحلة الإعدادية</option><option>المرحلة الثانوية</option><option>المرحلة الجامعية</option><option>خريج</option></select></div>
            <div class="input-group"><label data-i18n="country">البلد:</label><input type="text" id="stu-country" data-i18n-placeholder="country_ph" placeholder="مثال: مصر، السعودية..."></div>
            <div class="input-group" style="grid-column: span 2;"><label data-i18n="parent_phone">رقم ولي الأمر (اختياري للواتساب):</label><input type="text" id="stu-phone" data-i18n-placeholder="phone_ph" placeholder="لإرسال التقارير..."></div>
            <div class="input-group" style="grid-column: span 2;"><label data-i18n="memo_amount">مقدار الحفظ (من سورة - إلى سورة):</label><div style="display:flex; gap:10px;"><select id="stu-memo-from"></select><select id="stu-memo-to"></select></div></div>

            <div class="input-group" style="grid-column: span 2; background: rgba(0,0,0,0.02); padding: 15px; border-radius: 10px; border: 1px dashed #cbd5e1;">
                <label style="text-align:center;" data-i18n="choose_avatar">اختر أفاتار للبطل:</label>
                <div style="display:flex; justify-content:center; gap:15px; flex-wrap:wrap; margin-bottom: 15px;" id="avatar-gallery">
                    <div class="avatar-opt active" data-av="👦🏻">👦🏻</div>
                    <div class="avatar-opt" data-av="👨🏻‍🦱">👨🏻‍🦱</div>
                    <div class="avatar-opt" data-av="👲🏻">👲🏻</div>
                    <div class="avatar-opt" data-av="👧🏻">👧🏻</div>
                    <div class="avatar-opt" data-av="👩🏻">👩🏻</div>
                    <div class="avatar-opt" data-av="🧕🏻">🧕🏻</div>
                </div>
                <input type="hidden" id="selected-avatar" value="👦🏻">
                <label style="text-align:center;" data-i18n="upload_photo">أو ارفع صورة شخصية حقيقية:</label>
                <input type="file" id="stu-avatar" accept="image/*" style="width: 100%;">
            </div>
        </div>
        <button class="btn" style="width: 100%; margin-top:15px; padding: 15px; font-size: 1.3rem; background:#10b981; border:none;" id="btn-save-new-student" data-i18n="save_champ">حفظ بيانات البطل ✔️</button>
        <button class="btn btn-outline" style="width: 100%; margin-top:10px; padding: 15px; font-size: 1.3rem;" id="btn-close-add-modal" data-i18n="cancel">إلغاء</button>
    </div>
</div>
