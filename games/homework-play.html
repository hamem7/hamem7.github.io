<!-- 🌟🌟 نافذة "حالة التسليم" الصادقة: كل نص هنا يُملأ من games/homework-play.js (renderSubmissionStatus) حسب الحالة الحقيقية:
     جاري الإرسال / فشل (الإجابات محفوظة) / وصل (مؤكَّد من الخادم) / مرفوض. -->
<div id="hp-result-modal" class="hp-modal">
    <div class="hp-modal-card">
        <div id="hp-result-icon" style="font-size: 4.5rem; margin-bottom: 6px;">⏳</div>
        <h2 id="hp-result-title" style="color: var(--dh-emerald-700, #0d5c46); font-size: 1.8rem; margin-top: 0;"></h2>
