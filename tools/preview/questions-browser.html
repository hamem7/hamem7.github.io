<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تصفّح أسئلة المتشابهات</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f4ef; --fg:#1d2a24; --muted:#5b6b63; --card:#ffffff; --line:#d9d4c7; --ok:#0b7a3b; --okbg:#e6f4ea; --accent:#0f5c44; --warn:#8a4b08; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141b18; --fg:#e8efe9; --muted:#9db0a5; --card:#1c2622; --line:#33423b; --ok:#6fd49a; --okbg:#173326; --accent:#6fd49a; --warn:#f0b36a; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg:#141b18; --fg:#e8efe9; --muted:#9db0a5; --card:#1c2622; --line:#33423b; --ok:#6fd49a; --okbg:#173326; --accent:#6fd49a; --warn:#f0b36a; color-scheme: dark; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.7 'IBM Plex Sans Arabic', system-ui, sans-serif; padding-inline: max(16px, env(safe-area-inset-left,0px)) max(16px, env(safe-area-inset-right,0px)); padding-block: 16px 64px; }
  header { max-width: 980px; margin: 0 auto 16px; display:grid; gap:10px; }
  h1 { font-size: 1.5rem; margin: 0; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  select, input, button { font: inherit; padding: 6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); min-width:0; }
  button { cursor:pointer; } button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #status { color:var(--muted); font-size:.9rem; }
  main { max-width: 980px; margin: 0 auto; display:grid; gap:18px; }
  .group { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:14px 16px; min-width:0; }
  .group > h2 { font-size:1.05rem; margin:0 0 4px; display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline; }
  .tag { color:var(--muted); font-size:.85rem; font-weight:400; }
  .warn { color:var(--warn); font-size:.9rem; }
  .q { border-top:1px dashed var(--line); padding:10px 0; }
  .q:first-of-type { border-top:0; }
  .qt { font-family:'Amiri Quran', serif; font-size:1.25rem; line-height:2.1; white-space:pre-line; }
  .kind { font-weight:600; font-size:.85rem; color:var(--accent); }
  ol { margin:6px 0 0; padding-inline-start: 1.6rem; font-family:'Amiri Quran', serif; font-size:1.15rem; line-height:1.9; }
  li.ok.show { color:var(--ok); background:var(--okbg); border-radius:4px; font-weight:700; }
  .ref { color:var(--muted); font-size:.8rem; }
  .pg { display:flex; gap:10px; justify-content:center; align-items:center; }
</style>
</head>
<body>
<header>
  <h1>تصفّح أسئلة المتشابهات (القرآن كله)</h1>
  <div class="bar">
    <label>الجزء <select id="juz"><option value="">الكل</option></select></label>
    <label>النوع <select id="type"><option value="">الكل</option><option value="sim_surah">من أي سورة؟</option><option value="sim_complete">أكمل الآية</option><option value="sim_which">أيُّ الآيتين من السورة؟</option><option value="sim_match">صِل الآية بسورتها</option></select></label>
    <label>بحث في العبارة <input id="q" type="search" placeholder="مثال: ٱلَّذِينَ"></label>
    <label><input id="ans" type="checkbox" checked> إظهار الجواب الصحيح</label>
  </div>
  <div id="status">جارٍ توليد الأسئلة من المصحف…</div>
</header>
<main id="out"></main>
<div class="pg" id="pg" hidden><button id="prev">السابق</button><span id="pos"></span><button id="next">التالي</button></div>
<script type="module">
import { QuranIndex, generateGroupQuestions, mulberry32, SIM_TYPE_LABELS, stripHizbMark } from './engine/similarityQuestions.js';
import { MUTASHABIHAT_SEED as LATE } from './database/data/mutashabihatSeed.js';
import { MUTASHABIHAT_SEED_PART1 as P1 } from './database/data/mutashabihatSeedPart1.js';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const PAGE = 25;
let results = [], view = [], page = 0;
for (let j = 1; j <= 30; j++) $('juz').insertAdjacentHTML('beforeend', `<option value="${j}">الجزء ${j}</option>`);
const surahs = (await (await fetch('./database/quran-uthmani.json')).json()).data.surahs;
const Q = new QuranIndex(surahs);
const groups = [...P1, ...LATE], rng = mulberry32(7), posRef = { n: 0 };
for (let i = 0; i < groups.length; i++) {
  const r = generateGroupQuestions(Q, groups[i], { rng, posRef });
  results.push({ g: groups[i], r, juz: r.questions[0] ? r.questions[0].juz : null });
  if (i % 100 === 0) { $('status').textContent = `جارٍ توليد الأسئلة… ${i} / ${groups.length}`; await new Promise(res => setTimeout(res)); }
}
const total = results.reduce((n, x) => n + x.r.questions.length, 0);
$('status').textContent = `${groups.length} مجموعة · ${total} سؤالاً — الأجوبة المعروضة للمعلم فقط`;
function render() {
  const j = $('juz').value, t = $('type').value, q = stripHizbMark($('q').value).trim(), show = $('ans').checked;
  view = results.filter(x => (!j || String(x.juz) === j) && (!q || stripHizbMark(x.g.anchorPhrase).includes(q)) &&
    (!t || x.r.questions.some(z => z.type === t)));
  const slice = view.slice(page * PAGE, page * PAGE + PAGE);
  $('out').innerHTML = slice.map(({ g, r }) => {
    const qs = r.questions.filter(z => !t || z.type === t);
    return `<section class="group"><h2>${esc(g.groupId)} <span>«${esc(stripHizbMark(g.anchorPhrase))}»</span> <span class="tag">${r.questions.length} أسئلة${r.reason ? '' : ''}</span></h2>
      ${r.questions.length < 4 && r.reason ? `<div class="warn">${esc(r.reason)}</div>` : ''}
      ${qs.map(z => `<div class="q"><div class="kind">${SIM_TYPE_LABELS[z.type]}</div><div class="qt">${esc(z.text).replace(/﴿([^﴾]*)﴾/g, '﴿$1﴾')}</div>
        <ol>${z.type === 'sim_match' ? z.match.pairs.map(p => `<li class="${show ? 'ok show' : ''}">${esc(z.match.left.find(x => x.id === p.left).text)} ⇄ ${esc(z.match.right.find(x => x.id === p.right).text)}</li>`).join('') : z.optionsDisplay.map((o, i) => `<li class="${i === z.correctIndex ? 'ok' : ''} ${show ? 'show' : ''}">${esc(o)}</li>`).join('')}</ol>
        <div class="ref">المرجع (للمعلم): ${esc(z.ref)}</div></div>`).join('') || '<div class="warn">لا أسئلة لهذه المجموعة.</div>'}
    </section>`;
  }).join('') || '<p>لا نتائج.</p>';
  const pages = Math.max(1, Math.ceil(view.length / PAGE));
  $('pg').hidden = pages <= 1; $('pos').textContent = `${page + 1} / ${pages}  (${view.length} مجموعة)`;
  $('prev').disabled = page === 0; $('next').disabled = page >= pages - 1;
}
['juz', 'type', 'q', 'ans'].forEach(id => $(id).addEventListener(id === 'q' ? 'input' : 'change', () => { page = 0; render(); }));
$('prev').onclick = () => { page--; render(); scrollTo(0, 0); }; $('next').onclick = () => { page++; render(); scrollTo(0, 0); };
render();
</script>
</body>
</html>
